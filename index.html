<style>
:root{
  --bg:#000000; --card:#151515; --card2:#232323; --line:#353535;
  --text:#ffffff; --muted:#a8a8a8; --akzent:#e3141b; --akzent2:#ff6b6f; --weissgrau:#dcdcdc;
  --gruen:#7cc47f; --rot:#ff5a52; --gelb:#e8c547;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html{touch-action:manipulation} /* wie in der Koeppchen-App: kein Zoom beim Doppeltippen, zwei Finger zoomen weiter */
*{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:0 0 40px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:3px solid var(--akzent);box-shadow:0 1px 0 var(--weissgrau);padding:10px 0 8px}
.kopf{display:flex;align-items:center;gap:10px}
.kopf h1{font-size:22px;margin:0;flex:1;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.kopf h1 img{width:36px;height:36px;display:block}
.kopf h1 .akz{position:relative;display:inline-block}
.kopf h1 .akz::after{content:"";position:absolute;left:.07em;top:.3em;width:.38em;height:.11em;background:var(--akzent);border-radius:1px;transform:rotate(-10deg)}
#sync{font-size:13px;color:var(--muted);text-align:right}
#sync.fehler{color:var(--gelb)}
.zahnrad{background:none;border:0;color:var(--text);font-size:22px;padding:4px 2px;cursor:pointer}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}
@media (min-width:600px){nav{grid-template-columns:repeat(6,1fr)}}
nav button{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;
  padding:8px 0;font-size:13px;font-weight:600;cursor:pointer;position:relative;white-space:nowrap}
nav button.an{background:var(--akzent);color:#fff;border-color:var(--akzent)}
nav .badge{position:absolute;top:-6px;right:-4px;background:var(--rot);color:#fff;border-radius:9px;
  font-size:11px;padding:1px 6px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.card h2{font-size:17px;margin:0 0 10px}
.card h3{font-size:15px;margin:14px 0 6px;color:var(--akzent2)}
.muted{color:var(--muted)} small{font-size:13px}
.kacheln{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kachel{background:var(--card2);border-radius:12px;padding:10px 12px}
.kachel b{display:block;font-size:26px;line-height:1.15}
.kachel span{font-size:13px;color:var(--muted)}
.kachel.geld b{color:var(--gruen)} .kachel.offen b{color:var(--gelb)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
tr.summe td{font-weight:700;border-bottom:0}
.tabwrap{overflow-x:auto}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,select{width:100%;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 12px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:30px}
.zeile{display:flex;gap:8px;align-items:center}
.zeile > *{flex:1}

.kunde .kopfz{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

.vk{font-size:14px;padding:6px 0;border-top:1px dashed var(--line);display:flex;justify-content:space-between;gap:8px}

.log.weg .lt > div{text-decoration:line-through;color:var(--muted)}
.log .zurueck{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 8px;font-size:13px;cursor:pointer}
.hinweis{font-size:13px;color:var(--muted);margin-top:8px}
#neu{display:block;width:100%;margin:8px 0 0;padding:10px 12px;border:0;border-radius:10px;background:var(--akzent);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.probe{background:#3a3115;color:#f4e2a0;border-radius:10px;padding:8px 12px;font-size:13px;margin-top:10px}
.sorte-ed{display:grid;grid-template-columns:1fr 84px 44px 32px;gap:6px;align-items:center;margin-bottom:6px}
.sorte-ed input[type=checkbox]{width:22px;height:22px;-webkit-appearance:checkbox;appearance:auto}
.sorte-ed button,.person-ed button{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer}

.ichwahl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ichwahl button{padding:16px 8px;font-size:18px;font-weight:700;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);cursor:pointer}
.liv{border-top:1px solid var(--line);padding:12px 0}
.liv:first-of-type{border-top:0}
.liv .kopfz{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.liv .kopfz b{font-size:17px}
.liv .wann{font-size:13px;color:var(--muted)}
.liv .wann.faellig{color:var(--gelb);font-weight:700}
.chip{display:inline-block;font-size:12px;padding:3px 8px;border-radius:9px;background:var(--card2);margin:6px 4px 0 0}
.chip.ok{background:#1f3a20;color:#bfe8c0} .chip.warn{background:#3a3115;color:#f4e2a0}
tr.klick{cursor:pointer} tr.klick td:first-child::after{content:" ▾";color:var(--muted)} tr.klick.auf td:first-child::after{content:" ▴"}
.detail td{font-size:13px;vertical-align:top}
.detail td:first-child,.detail th:first-child{text-align:left;padding-right:8px}
.detail tr.geplant td{color:var(--muted);font-style:italic}
input[type=date]{min-height:44px}
textarea{width:100%;font:16px/1.4 inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.check{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:15px}
.check input{width:22px;height:22px;-webkit-appearance:checkbox;appearance:auto}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:24px}
.versteckt{display:none !important}
</style>

<body>
<header><div class="wrap">
  <div class="kopf">
    <h1><img src="bilder/logo-96.png" alt=""><span aria-label="Millebéier">Milleb<span class="akz">e</span>ier</span></h1>
    <div id="sync"></div>

  </div>
  <nav id="nav">
    <button data-tab="bestand">Stock</button>

<main class="wrap">
  <section id="t-start" class="versteckt"></section>
  <section id="t-uebersicht" class="versteckt"></section>
  <section id="t-verkaufen" class="versteckt"><div id="vForm"></div></section>
  <section id="t-livraisons" class="versteckt"><div id="lListe"></div><div id="lForm"></div></section>
  <section id="t-offen" class="versteckt"></section>
  <section id="t-bestand" class="versteckt"><div id="bTabelle"></div><div id="bForm"></div></section>

</main>
<datalist id="kaeuferListe"></datalist>

<script>
/* Adresse des Cloudflare-Workers. Leer = Probe-Modus (alles nur auf diesem Handy). */
const WORKER_URL = "https://millebeier.rjtp6r9s9h.workers.dev/";
const FASSUNG = "14.11.2026 b";

/* === Logik === (kein DOM; test/logik.mjs schneidet diesen Block aus) */
const LAGER = "Lager";
const STANDARD = {
  sorten: [{ name: "NEIPA", preis: 3 }, { name: "White IPA", preis: 3 }, { name: "Brown Porter", preis: 3 }],
  leute: ["Jeff", "Marc", "Claude", "Laurent"],
};
const GRUENDE = { getrunken: "selwer gedronk", verschenkt: "verschenkt / Prouf", kaputt: "futti", sonst: "soss eppes" };
const ARTEN = ["abfuellung", "bewegung", "abgang", "verkauf", "zahlung", "einstellungen", "storno", "livraison", "rechnung"];

const ganz = n => Number.isInteger(n) && n > 0 && n <= 100000;
const geld = x => typeof x === "number" && isFinite(x) && x >= 0 && x <= 1000000;
const text = (s, max = 60) => typeof s === "string" && s.trim().length > 0 && s.length <= max;
const runde = x => Math.round(x * 100) / 100;

function euro(x) {
  const r = runde(x || 0);
  return (Number.isInteger(r) ? String(r) : r.toFixed(2).replace(".", ",")) + " €";
}

const postenOk = p => Array.isArray(p) && p.length > 0 && p.length <= 30 && p.every(x => x && text(x.sorte) && ganz(x.n));

function gueltig(e) {
  if (!e || typeof e !== "object" || typeof e.id !== "string" || typeof e.zeit !== "number") return false;
  switch (e.art) {
    case "abfuellung": return text(e.sorte) && ganz(e.n);
    case "bewegung": return text(e.sorte) && ganz(e.n) && text(e.von) && text(e.an) && e.von !== e.an;
    case "abgang": return text(e.sorte) && ganz(e.n) && text(e.wer) && e.grund in GRUENDE;
    case "verkauf":
      return text(e.verkaeufer) && text(e.kaeufer) && geld(e.betrag) && postenOk(e.posten) &&
        (e.aus === undefined || text(e.aus)) && (e.liv === undefined || typeof e.liv === "string");
    case "livraison":
      return text(e.kunde) && text(e.kontakt, 30) && text(e.aus, 30) && geld(e.betrag) && postenOk(e.posten) &&
        typeof e.datum === "string" && /^\d{4}-\d{2}-\d{2}$/.test(e.datum) &&
        (e.anlass === undefined || e.anlass === "" || text(e.anlass, 80)) &&
        (e.notiz === undefined || (typeof e.notiz === "string" && e.notiz.length <= 300));
    case "rechnung": return typeof e.ref === "string";
    case "zahlung": return typeof e.ref === "string" && geld(e.betrag) && e.betrag > 0;
    case "einstellungen":
      return Array.isArray(e.sorten) && e.sorten.length > 0 && e.sorten.length <= 30 &&
        e.sorten.every(s => s && text(s.name, 30) && geld(s.preis)) &&
        Array.isArray(e.leute) && e.leute.length > 0 && e.leute.length <= 30 && e.leute.every(p => text(p, 30) && p !== LAGER);
    case "storno": return typeof e.ref === "string";
  }
  return false;
}

const ordnung = (a, b) => a.zeit - b.zeit || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);

/* Rechnet aus allen Einträgen den Stand. Nichts wird gespeichert außer den Einträgen selbst. */
function rechne(eintraege) {
  const gesehen = new Set();
  const liste = [];
  for (const e of eintraege || []) {
    if (!gueltig(e) || gesehen.has(e.id)) continue;
    gesehen.add(e.id); liste.push(e);
  }
  liste.sort(ordnung);
  const nachId = new Map(liste.map(e => [e.id, e]));
  // Rückgängig nur für echte Einträge, nie für ein Rückgängig selbst.
  const storniert = new Map();
  for (const e of liste) {
    const ziel = e.art === "storno" && nachId.get(e.ref);
    if (ziel && ziel.art !== "storno" && !storniert.has(ziel.id)) storniert.set(ziel.id, e);
  }
  const aktiv = liste.filter(e => e.art !== "storno" && !storniert.has(e.id));

  let cfg = { sorten: STANDARD.sorten.map(s => ({ ...s })), leute: [...STANDARD.leute] };
  for (const e of aktiv) if (e.art === "einstellungen")
    cfg = { sorten: e.sorten.map(s => ({ name: s.name.trim(), preis: runde(s.preis), aus: !!s.aus })), leute: e.leute.map(p => p.trim()) };

  const bestand = {};
  const add = (h, s, n) => { (bestand[h] ||= {}); bestand[h][s] = (bestand[h][s] || 0) + n; };
  const sorten = {};
  const st = s => (sorten[s] ||= { abgefuellt: 0, verkauft: 0, abgang: 0, da: 0 });
  for (const s of cfg.sorten) st(s.name);
  const personen = {};
  const pe = p => (personen[p] ||= { verkauft: 0, umsatz: 0, bezahlt: 0, offen: 0 });
  for (const p of cfg.leute) pe(p);
  const vk = new Map();

  for (const e of aktiv) {
    if (e.art === "abfuellung") { add(LAGER, e.sorte, e.n); st(e.sorte).abgefuellt += e.n; }
    else if (e.art === "bewegung") { add(e.von, e.sorte, -e.n); add(e.an, e.sorte, e.n); st(e.sorte); }
    else if (e.art === "abgang") { add(e.wer, e.sorte, -e.n); st(e.sorte).abgang += e.n; }
    else if (e.art === "verkauf") {
      let n = 0;
      // Flaschen kommen von „aus“ (z. B. Lager bei einer Livraison), sonst vom Verkäufer selbst.
      for (const p of e.posten) { add(e.aus || e.verkaeufer, p.sorte, -p.n); st(p.sorte).verkauft += p.n; n += p.n; }
      vk.set(e.id, { ...e, flaschen: n, bezahlt: 0, offen: 0 });
      const P = pe(e.verkaeufer); P.verkauft += n; P.umsatz += e.betrag;
    }
  }
  // Livraisons: geplant, bis ein (nicht rückgängig gemachter) Verkauf mit liv = ihre id existiert.
  const liv = new Map();
  for (const e of aktiv) if (e.art === "livraison") { liv.set(e.id, { ...e, verkauf: null }); for (const p of e.posten) st(p.sorte); }
  for (const v of vk.values()) if (v.liv && liv.has(v.liv)) { liv.get(v.liv).verkauf = v; v.livraison = liv.get(v.liv); }
  for (const e of aktiv) if (e.art === "rechnung" && vk.has(e.ref)) vk.get(e.ref).rechnungGemacht = true;
  let kasse = 0;
  for (const e of aktiv) if (e.art === "zahlung") {
    const v = vk.get(e.ref);
    if (!v) continue; // Verkauf rückgängig gemacht → Zahlung zählt nicht mehr
    v.bezahlt = runde(v.bezahlt + e.betrag);
    kasse = runde(kasse + e.betrag);
  }
  let offen = 0;
  const kaeufer = new Map();
  for (const v of vk.values()) {
    v.offen = runde(Math.max(0, v.betrag - v.bezahlt));
    offen = runde(offen + v.offen);
    const P = pe(v.verkaeufer); P.bezahlt = runde(P.bezahlt + Math.min(v.bezahlt, v.betrag)); P.offen = runde(P.offen + v.offen);
    const k = v.kaeufer.trim();
    const K = kaeufer.get(k.toLowerCase()) || { name: k, offen: 0, verkaeufe: [] };
    K.offen = runde(K.offen + v.offen); K.verkaeufe.push(v);
    kaeufer.set(k.toLowerCase(), K);
  }
  for (const h in bestand) for (const s in bestand[h]) st(s).da += bestand[h][s];

  const halter = [LAGER, ...cfg.leute];
  for (const h in bestand) if (!halter.includes(h) && Object.values(bestand[h]).some(n => n !== 0)) halter.push(h);
  const sortenNamen = [...cfg.sorten.map(s => s.name), ...Object.keys(sorten).filter(s => !cfg.sorten.some(c => c.name === s))];
  const summe = f => sortenNamen.reduce((a, s) => a + sorten[s][f], 0);

  return {
    cfg, liste, aktiv, storniert, nachId, bestand, halter, sorten, sortenNamen, personen,
    verkaeufe: [...vk.values()],
    vkNachId: vk,
    livraisons: [...liv.values()].sort((a, b) => a.datum.localeCompare(b.datum) || ordnung(a, b)),
    kaeufer: [...kaeufer.values()].sort((a, b) => b.offen - a.offen || a.name.localeCompare(b.name, "de")),
    kasse, offen,
    umsatz: runde([...vk.values()].reduce((a, v) => a + v.betrag, 0)),
    flaschen: { abgefuellt: summe("abgefuellt"), verkauft: summe("verkauft"), abgang: summe("abgang"), da: summe("da") },
  };
}

/* Luxemburgisch steht vor Namen ein Artikel. Die Verkäufer sind Männer → „de“/„beim“; Käufer (Geschlecht
   unbekannt) bekommen keinen, die Sätze sind dort ohne Artikel gebaut. */
const de = h => h === LAGER ? "d'Lager" : "de " + h;
const beim = h => h === LAGER ? "am Lager" : "beim " + h;
const hat = (Z, wer, sorte) => (Z.bestand[wer] && Z.bestand[wer][sorte]) || 0;
const preisVon = (cfg, sorte) => { const s = cfg.sorten.find(x => x.name === sorte); return s ? s.preis : 0; };
const postenText = posten => posten.map(p => `${p.n} × ${p.sorte}`).join(", ");

function beschreibe(e, Z) {
  switch (e.art) {
    case "abfuellung": return `🍺 ${e.n} × ${e.sorte} ofgefëllt (an d'Lager)`;
    case "bewegung": return `➡️ ${e.n} × ${e.sorte}: ${e.von} → ${e.an}`;
    case "abgang": return `🗑️ ${e.n} × ${e.sorte} ${beim(e.wer)}: ${GRUENDE[e.grund]}`;
    case "verkauf": return `${e.liv ? "🚚 Geliwwert" : "💶"} ${e.verkaeufer} → ${e.kaeufer}: ${postenText(e.posten)} · ${euro(e.betrag)}`;
    case "zahlung": {
      const v = Z && Z.nachId.get(e.ref);
      return `✓ ${euro(e.betrag)} bezuelt` + (v ? `: ${v.kaeufer} (${beim(v.verkaeufer)})` : "");
    }
    case "livraison": return `🚚 Livraison geplangt: ${e.kunde}, ${postenText(e.posten)}, ${datumKurz(e.datum)} · ${euro(e.betrag)}`;
    case "rechnung": {
      const v = Z && Z.nachId.get(e.ref);
      return "🧾 Rechnung gemaach" + (v ? `: ${v.kaeufer}` : "");
    }
    case "einstellungen": return `⚙️ Zorten/Präisser/Leit geännert: ${e.sorten.filter(s => !s.aus).map(s => `${s.name} ${euro(s.preis)}`).join(", ")}`;
    case "storno": {
      const z = Z && Z.nachId.get(e.ref);
      return "↶ Réckgängeg: " + (z ? beschreibe(z, Z) : "?");
    }
  }
  return "?";
}

/* Teilbetrag auf die ältesten offenen Verkäufe verteilen. */
function verteile(verkaeufe, betrag) {
  const out = [];
  let rest = runde(betrag);
  for (const v of [...verkaeufe].sort(ordnung)) {
    if (rest <= 0) break;
    if (v.offen <= 0) continue;
    const b = runde(Math.min(rest, v.offen));
    out.push({ art: "zahlung", ref: v.id, betrag: b });
    rest = runde(rest - b);
  }
  return { zahlungen: out, rest };
}

function erinnerung(K) {
  const offene = K.verkaeufe.filter(v => v.offen > 0);
  const posten = {};
  for (const v of offene) for (const p of v.posten) posten[p.sorte] = (posten[p.sorte] || 0) + p.n;
  const was = Object.entries(posten).map(([s, n]) => `${n}x ${s}`).join(", ");
  return `Moien ${K.name}, vir den Millebéier (${was}) stinn nach ${euro(K.offen)} op. Merci & Prost! 🍺`;
}

function csv(Z, zeitText) {
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  const zeilen = [["Datum", "Verkeefer", "Keefer", ...Z.sortenNamen, "Fläschen", "Betrag", "Bezuelt", "Op"].map(q).join(";")];
  for (const v of [...Z.verkaeufe].sort(ordnung)) {
    const n = Z.sortenNamen.map(s => v.posten.filter(p => p.sorte === s).reduce((a, p) => a + p.n, 0));
    zeilen.push([zeitText(v.zeit), v.verkaeufer, v.kaeufer, ...n, v.flaschen,
      String(v.betrag).replace(".", ","), String(v.bezahlt).replace(".", ","), String(v.offen).replace(".", ",")].map(q).join(";"));
  }
  return "﻿" + zeilen.join("\r\n") + "\r\n";
}

const datumKurz = d => { const [j, m, t] = d.split("-"); return `${+t}.${+m}.${j}`; };
const istFass = sorte => /keg|fass|fût/i.test(sorte);

/* Anteil eines Postens am Betrag (gewichtet nach Listenpreis; ohne Preise nach Flaschen). */
function anteil(cfg, posten, betrag, p) {
  const w = x => x.n * preisVon(cfg, x.sorte);
  const summe = posten.reduce((a, x) => a + w(x), 0);
  if (summe > 0) return runde(betrag * w(p) / summe);
  const n = posten.reduce((a, x) => a + x.n, 0);
  return n ? runde(betrag * p.n / n) : 0;
}
const bezahltText = v => v.offen <= 0 ? "Jo" : v.bezahlt > 0 ? `Deelweis (${euro(v.offen)} op)` : "Nee";

/* Alle Zeilen einer Sorte, wie ein Blatt in der alten Excel-Tabelle: wer hat was wem verkauft. */
function proSorte(Z, sorte) {
  const zeilen = [];
  for (const v of Z.verkaeufe) for (const p of v.posten) if (p.sorte === sorte) {
    const r = anteil(Z.cfg, v.posten, v.betrag, p);
    const L = v.livraison;
    zeilen.push({ zeit: v.zeit, datum: L ? L.datum : null, kunde: v.kaeufer, kontakt: v.verkaeufer, n: p.n,
      preis: runde(r / p.n), recetten: r, geliwwert: "Jo", bezuelt: bezahltText(v),
      rechnung: L && L.rechnung ? (v.rechnungGemacht ? "gemaach" : "nach ze maachen") : "",
      remarque: L ? [L.anlass, L.notiz].filter(Boolean).join(" · ") : "", id: v.id });
  }
  for (const e of Z.aktiv) if (e.art === "abgang" && e.sorte === sorte)
    zeilen.push({ zeit: e.zeit, datum: null, kunde: GRUENDE[e.grund], kontakt: e.wer, n: e.n, preis: 0, recetten: 0,
      geliwwert: "–", bezuelt: "–", rechnung: "", remarque: "", id: e.id });
  for (const L of Z.livraisons) if (!L.verkauf) for (const p of L.posten) if (p.sorte === sorte) {
    const r = anteil(Z.cfg, L.posten, L.betrag, p);
    zeilen.push({ zeit: L.zeit, datum: L.datum, kunde: L.kunde, kontakt: L.kontakt, n: p.n, preis: runde(r / p.n), recetten: r,
      geliwwert: "geplangt " + datumKurz(L.datum), bezuelt: "–", rechnung: L.rechnung ? "nach ze maachen" : "",
      remarque: [L.anlass, L.notiz].filter(Boolean).join(" · "), id: L.id, geplant: true });
  }
  return zeilen.sort((a, b) => (a.datum ? Date.parse(a.datum) : a.zeit) - (b.datum ? Date.parse(b.datum) : b.zeit));
}

/* Tabellen für den Excel-Export: je Sorte ein Blatt wie bisher, dazu Livraisons und Stock.
   Reine Daten (Zeilen als Arrays), damit der Test ohne Excel-Bibliothek prüfen kann. */
function exportBlaetter(Z, zeitFmt) {
  const blaetter = [];
  const kopf = ["Datum", "Client", "Kontakt", "Unzuel", "Präis/Fl", "Recetten", "geliwwert?", "bezuel?", "Rechnung", "Remarquen"];
  for (const s of Z.sortenNamen) {
    const z = proSorte(Z, s), x = Z.sorten[s];
    if (!z.length && !x.abgefuellt && !x.da) continue;
    const zeilen = z.map(r => [r.datum ? datumKurz(r.datum) : zeitFmt(r.zeit), r.kunde, r.kontakt, r.n, r.preis, r.recetten, r.geliwwert, r.bezuelt, r.rechnung, r.remarque]);
    const fest = z.filter(r => !r.geplant);
    blaetter.push({ name: s, titel: s, info: [
      `Ofgefëllt: ${x.abgefuellt} · Verkaaft: ${x.verkauft} · Fort: ${x.abgang} · Nach do: ${x.da}`,
      `Präis: ${euro(preisVon(Z.cfg, s))} pro ${istFass(s) ? "Fass" : "Fläsch"}`],
      kopf, zeilen,
      summe: ["Total", "", "", fest.reduce((a, r) => a + r.n, 0), "", runde(fest.reduce((a, r) => a + r.recetten, 0)), "", "", "", "ouni geplangten"] });
  }
  blaetter.push({ name: "Livraisons", titel: "Livraisons", info: [],
    kopf: ["Datum", "Client", "Kontakt", "Wat", "Betrag", "Anlass", "geliwwert?", "Rechnung", "bezuel?", "Remarquen"],
    zeilen: Z.livraisons.map(L => [datumKurz(L.datum), L.kunde, L.kontakt, postenText(L.posten), L.betrag, L.anlass || "",
      L.verkauf ? "Jo" : "geplangt", L.rechnung ? (L.verkauf && L.verkauf.rechnungGemacht ? "gemaach" : "nach ze maachen") : "",
      L.verkauf ? bezahltText(L.verkauf) : "–", L.notiz || ""]), summe: null });
  blaetter.push({ name: "Stock", titel: "Stock", info: [], kopf: ["", ...Z.sortenNamen, "Total"],
    zeilen: Z.halter.map(h => [h, ...Z.sortenNamen.map(s => hat(Z, h, s)), Z.sortenNamen.reduce((a, s) => a + hat(Z, h, s), 0)]),
    summe: ["Total", ...Z.sortenNamen.map(s => Z.sorten[s].da), Z.flaschen.da] });
  return blaetter;
}

function neueId() {
  if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
  return "x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
}
/* === Oberfläche === */

const SP = "millebeier_v1";              // {code, ich, tab}
const SP_DATEN = "millebeier_v1_daten";  // letzter Stand vom Server (offline lesbar)
const SP_AUSGANG = "millebeier_v1_ausgang"; // Einträge, die noch nicht beim Server sind
const SP_PROBE = "millebeier_v1_probe";  // Probe-Modus: die „Datenbank“ auf dem Handy

const lade = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch { return d; } };
const merke = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const PROBE = !WORKER_URL;

let EIN = lade(SP, {});
let SERVER = lade(SP_DATEN, []);
let AUSGANG = lade(SP_AUSGANG, []);
let Z = rechne([]);
let TAB = EIN.tab || "verkaufen";
let STATUS = { zuletzt: 0, fehler: "" };
let FORM = null, BFORM = null, EFORM = null;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TZ = "Europe/Luxembourg";
const zeitText = t => new Date(t).toLocaleString("de-LU", { timeZone: TZ, weekday: "short", day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" });
const datumText = t => new Date(t).toLocaleDateString("de-DE", { timeZone: TZ, day: "numeric", month: "numeric", year: "numeric" });

function neuRechnen() {
  const ids = new Set(SERVER.map(e => e.id));
  Z = rechne([...SERVER, ...AUSGANG.filter(e => !ids.has(e.id))]);
  document.getElementById("kaeuferListe").innerHTML = Z.kaeufer.map(k => `<option value="${esc(k.name)}">`).join("");
}

/* ---------- Server ---------- */
async function anfrage(daten) {
  if (PROBE) {
    const db = lade(SP_PROBE, []);
    if (daten.aktion === "neu") {
      const ids = new Set(db.map(e => e.id));
      for (const e of daten.eintraege) if (!ids.has(e.id)) db.push(e);
      merke(SP_PROBE, db);
    }
    return { eintraege: db };
  }
  const r = await fetch(WORKER_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ code: EIN.code, ...daten }) });
  let j = {};
  try { j = await r.json(); } catch {}
  if (!r.ok) { const f = new Error(j.fehler || `Feeler ${r.status}`); f.status = r.status; throw f; }
  return j;
}

let LAEUFT = false;
async function abgleichen() {
  if (LAEUFT || !bereit()) return;
  LAEUFT = true;
  try {
    let antwort, abgelehnt = [];
    const uebernehmen = a => {
      SERVER = a.eintraege || [];
      const ids = new Set(SERVER.map(e => e.id));
      AUSGANG = AUSGANG.filter(e => !ids.has(e.id));
      merke(SP_DATEN, SERVER); merke(SP_AUSGANG, AUSGANG);
    };
    do {
      const bündel = AUSGANG.filter(e => !abgelehnt.includes(e.id)).slice(0, 50);
      if (!bündel.length) { antwort = await anfrage({ aktion: "liste" }); uebernehmen(antwort); break; }
      try { antwort = await anfrage({ aktion: "neu", eintraege: bündel }); uebernehmen(antwort); }
      catch (f) {
        if (f.status !== 400) throw f;
        // Ein Eintrag, den der Server nicht kennt (z. B. alter Worker), darf die anderen nicht aufhalten:
        // einzeln schicken, Abgelehntes bleibt im Ausgang.
        for (const e of bündel) {
          try { uebernehmen(await anfrage({ aktion: "neu", eintraege: [e] })); }
          catch (f2) { if (f2.status !== 400) throw f2; abgelehnt.push(e.id); }
        }
      }
    } while (AUSGANG.some(e => !abgelehnt.includes(e.id)));
    STATUS = { zuletzt: Date.now(), fehler: abgelehnt.length ? `${abgelehnt.length} Agab(en) refuséiert — Worker muss aktualiséiert ginn` : "" };
  } catch (f) {
    if (f.status === 401) { EIN.code = ""; merke(SP, EIN); STATUS.fehler = "Code stëmmt net méi"; }
    else STATUS.fehler = navigator.onLine === false ? "offline" : f.status ? (f.message || "Feeler " + f.status) : "keng Verbindung"; // Browser-Meldungen („Failed to fetch“) sind englisch
  } finally {
    LAEUFT = false;
    neuRechnen(); render();
  }
}

/* Doppeltipp-Schutz, Stufe 2: derselbe Inhalt innerhalb von 3 s wird nicht noch einmal gespeichert. */
let LETZTER_EINTRAG = { sig: "", t: 0 };
function eintragen(teile) {
  const jetzt = Date.now();
  const sig = JSON.stringify([EIN.ich, teile]);
  if (sig === LETZTER_EINTRAG.sig && jetzt - LETZTER_EINTRAG.t < 3000) return [];
  LETZTER_EINTRAG = { sig, t: jetzt };
  const neu = teile.map((t, i) => ({ ...t, id: neueId(), zeit: jetzt + i, durch: EIN.ich }));
  AUSGANG.push(...neu);
  merke(SP_AUSGANG, AUSGANG);
  neuRechnen(); render();
  abgleichen();
  return neu;
}

/* ---------- Rendern ---------- */
const bereit = () => !!EIN.ich && (PROBE || !!EIN.code);
// iPhone-Regel: nie einen Kasten neu bauen, in dem gerade getippt wird.
function tipptIn(el) {
  const a = document.activeElement;
  return !!(a && el && el.contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName));
}

function render() {
  const tab = bereit() ? TAB : "start";

  $('#nav [data-tab="offen"]').innerHTML = "Ausstoend" + (nOffen ? ` <span class="badge">${nOffen}</span>` : "");
  renderSync();

  ({ start: renderStart, uebersicht: renderUebersicht, verkaufen: renderVerkaufen, offen: renderOffen, livraisons: renderLivraisons,
     bestand: renderBestand, verlauf: renderVerlauf, einst: renderEinst })[tab]();
  $("#fuss").innerHTML = `Versioun ${esc(FASSUNG)}` + (EIN.ich ? ` · Du bass ${esc(de(EIN.ich))}` : "");
}

function renderSync() {
  const el = $("#sync");

  if (PROBE) t = "Prouf-Modus";
  else if (STATUS.fehler) t = "⚠️ " + STATUS.fehler;
  else if (STATUS.zuletzt) t = "✓ synchroniséiert";
  if (AUSGANG.length) t += `<br>⏳ ${AUSGANG.length} nach net geschéckt`;
  el.innerHTML = t;
  el.classList.toggle("fehler", !!STATUS.fehler || AUSGANG.length > 0);
}

/* Excel-Export: SheetJS wird erst beim Tippen geladen (cdnjs, feste Version). */
const SHEETJS = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
function sheetjsLaden() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((ok, nok) => {
    const sc = document.createElement("script");
    sc.src = SHEETJS; sc.onload = () => ok(window.XLSX); sc.onerror = () => nok(new Error("Excel-Bibliothéik net geluede (Internet?)"));
    document.head.appendChild(sc);
  });
}
async function excelExport(meldBox) {
  const meld = (art, t) => { if (meldBox) meldBox.innerHTML = `<div class="meldung ${art}">${esc(t)}</div>`; };
  try {
    meld("ok", "Excel gëtt gemaach…");
    const X = await sheetjsLaden();
    const wb = X.utils.book_new();
    const heute = new Date().toLocaleDateString("de-DE", { timeZone: TZ });
    for (const b of exportBlaetter(Z, t => new Date(t).toLocaleDateString("de-DE", { timeZone: TZ }))) {
      const aoa = [[`MILLEBÉIER – ${b.titel.toUpperCase()}`], [`Stand: ${heute}`], ...b.info.map(i => [i]), [], b.kopf, ...b.zeilen];
      if (b.summe) aoa.push([], b.summe);
      const ws = X.utils.aoa_to_sheet(aoa);
      ws["!cols"] = b.kopf.map((k, i) => ({ wch: i === 1 || i === 9 ? 28 : i === 3 && b.name === "Livraisons" ? 30 : 12 }));
      ws["!merges"] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: Math.max(3, b.kopf.length - 1) } }];
      // Euro-Format für Geldspalten
      const kopfZeile = 3 + b.info.length;
      b.kopf.forEach((k, c) => {
        if (!/Präis|Recetten|Betrag/.test(k)) return;
        for (let r = kopfZeile + 1; r < aoa.length; r++) { const z = ws[X.utils.encode_cell({ r, c })]; if (z && z.t === "n") z.z = '#,##0.00 "€"'; }
      });
      X.utils.book_append_sheet(wb, ws, b.name.replace(/[\\/?*\[\]:]/g, " ").slice(0, 31));
    }
    const daten = X.write(wb, { bookType: "xlsx", type: "array" });
    const name = `Millebeier-${new Date().toISOString().slice(0, 10)}.xlsx`;
    const datei = new File([daten], name, { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    meld("ok", "✓ " + name);
    try { if (navigator.canShare && navigator.canShare({ files: [datei] })) { await navigator.share({ files: [datei] }); return; } }
    catch (f) { if (f && f.name === "AbortError") return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(datei); a.download = name; a.click();
  } catch (f) { meld("fehler", f.message || "Excel-Export huet net geklappt."); }
}

/* ---------- Verkaufen ---------- */
function leeresFormular() {
  return { verkaeufer: EIN.ich, kaeufer: "", n: {}, betrag: null, bezahlt: null, meldung: FORM && FORM.meldung };
}
function vSorten() { return Z.cfg.sorten.filter(s => !s.aus); }
function vAutoBetrag() { return runde(vSorten().reduce((a, s) => a + (FORM.n[s.name] || 0) * s.preis, 0)); }
function vFlaschen() { return vSorten().reduce((a, s) => a + (FORM.n[s.name] || 0), 0); }

function renderVerkaufen() {
  if (!FORM) FORM = leeresFormular();
  const box = $("#vForm");
  if (tipptIn(box)) { vHinweise(); return; }
  const leute = Z.cfg.leute.includes(FORM.verkaeufer) ? Z.cfg.leute : [...Z.cfg.leute, FORM.verkaeufer];
  box.innerHTML = `<div class="card">

    <label for="vVerk">Wien verkeeft?</label>

    <label for="vKaeufer">Un wien?</label>
    <input id="vKaeufer" list="kaeuferListe" autocomplete="off" autocapitalize="words" placeholder="Numm vum Keefer" value="${esc(FORM.kaeufer)}">
    <label>Wéi vill Fläschen?</label>
    ${vSorten().map((s, i) => `<div class="posten">
      <div class="pn"><b>${esc(s.name)}</b><small class="muted" id="vHat${i}"></small></div>
      <div class="stepper"><button data-minus="${i}" aria-label="manner">−</button>
        <input id="vN${i}" data-i="${i}" inputmode="numeric" pattern="[0-9]*" value="${FORM.n[s.name] || ""}" placeholder="0">
        <button data-plus="${i}" aria-label="méi">+</button></div></div>`).join("")}
    <label for="vBetrag">Betrag (€)</label>
    <div class="zeile"><input id="vBetrag" inputmode="decimal" value="${FORM.betrag != null ? String(FORM.betrag).replace(".", ",") : (vAutoBetrag() ? String(vAutoBetrag()).replace(".", ",") : "")}" placeholder="0">
      <small class="muted" id="vAuto" style="flex:1.4"></small></div>
    <div class="seg">
      <button data-bez="1" class="${FORM.bezahlt === true ? "an gruen" : ""}">Bezuelt ✓</button>
      <button data-bez="0" class="${FORM.bezahlt === false ? "an gelb" : ""}">Bezillt méi spéit</button>
    </div>
    <button class="haupt" id="vSpeichern">Verkaf androen</button>

  const setzeN = (i, n) => {
    const s = vSorten()[i]; FORM.n[s.name] = Math.max(0, Math.min(9999, n | 0));
    const inp = $("#vN" + i); if (document.activeElement !== inp) inp.value = FORM.n[s.name] || "";

  };
  box.querySelectorAll("[data-plus]").forEach(b => b.onclick = () => setzeN(+b.dataset.plus, (FORM.n[vSorten()[+b.dataset.plus].name] || 0) + 1));
  box.querySelectorAll("[data-minus]").forEach(b => b.onclick = () => setzeN(+b.dataset.minus, (FORM.n[vSorten()[+b.dataset.minus].name] || 0) - 1));
  box.querySelectorAll("[data-i]").forEach(inp => inp.oninput = () => setzeN(+inp.dataset.i, parseInt(inp.value, 10) || 0));
  $("#vBetrag").oninput = e => {
    const v = e.target.value.trim().replace(",", ".");

    vHinweise();
  };
  box.querySelectorAll("[data-bez]").forEach(b => b.onclick = () => {
    FORM.bezahlt = b.dataset.bez === "1";
    box.querySelectorAll("[data-bez]").forEach(x => x.className = "");

function vHinweise() {
  vSorten().forEach((s, i) => {
    const el = $("#vHat" + i); if (!el) return;
    const n = hat(Z, FORM.verkaeufer, s.name);
    el.textContent = `${euro(s.preis)} · ${de(FORM.verkaeufer)} huet nach ${n}`;
    el.style.color = (FORM.n[s.name] || 0) > n ? "var(--gelb)" : "";
  });
  const auto = vAutoBetrag();
  const inp = $("#vBetrag");
  if (inp && FORM.betrag == null && document.activeElement !== inp) inp.value = auto ? String(auto).replace(".", ",") : "";
  const a = $("#vAuto");
  if (a) a.textContent = FORM.betrag != null && FORM.betrag !== auto
    ? `amplaz ${euro(auto)} (${vFlaschen()} Fläschen)` : (vFlaschen() ? `${vFlaschen()} Fläschen` : "");
}

function vSpeichern() {
  const zeige = (art, t) => { FORM.meldung = { art, text: t }; $("#vMeldung").innerHTML = `<div class="meldung ${art}">${esc(t)}</div>`; };
  const kaeufer = FORM.kaeufer.trim().replace(/\s+/g, " ");
  const posten = vSorten().filter(s => FORM.n[s.name] > 0).map(s => ({ sorte: s.name, n: FORM.n[s.name] }));
  if (!kaeufer) return zeige("fehler", "Un wien? Schreif w.e.g. en Numm an.");
  if (!posten.length) return zeige("fehler", "Wéi vill Fläschen? Mindestens eng.");
  if (FORM.bezahlt == null) return zeige("fehler", "Bezuelt oder bezillt méi spéit? Tipp w.e.g. eent un.");
  const betrag = FORM.betrag != null ? FORM.betrag : vAutoBetrag();
  const zuWenig = posten.filter(p => p.n > hat(Z, FORM.verkaeufer, p.sorte));
  if (zuWenig.length && !confirm(`Laut der App huet ${de(FORM.verkaeufer)} just ${zuWenig.map(p => `${hat(Z, FORM.verkaeufer, p.sorte)} × ${p.sorte}`).join(", ")}.\n\nTrotzdeem androen?`)) return;
  // Gleicher Name in anderer Schreibweise? Dann den bekannten nehmen.
  const bekannt = Z.kaeufer.find(k => k.name.toLowerCase() === kaeufer.toLowerCase());
  const name = bekannt ? bekannt.name : kaeufer;
  const [v] = eintragen([{ art: "verkauf", verkaeufer: FORM.verkaeufer, kaeufer: name, posten, betrag }]);
  if (!v) return; // gerade eben schon gespeichert (Doppeltipp)
  if (FORM.bezahlt && betrag > 0) eintragen([{ art: "zahlung", ref: v.id, betrag }]);
  const verk = FORM.verkaeufer, bez = FORM.bezahlt;
  FORM = leeresFormular(); FORM.verkaeufer = verk;
  FORM.meldung = { art: "ok", text: `✓ Agedroen: ${name}, ${postenText(posten)}, ${euro(betrag)} — ${bez ? "bezuelt" : "steet ënner „Ausstoend“"}` };
  if (document.activeElement) document.activeElement.blur();
  renderVerkaufen();
}

    <div class="knopfe">

    const K = liste[+b.dataset.alles];
    if (!confirm(`${K.name}: ${euro(K.sichtOffen)} bezuelt?`)) return;
    eintragen(K.sicht.map(v => ({ art: "zahlung", ref: v.id, betrag: v.offen })));
  });
  box.querySelectorAll("[data-teil]").forEach(b => b.onclick = () => {
    const K = liste[+b.dataset.teil];
    const t = prompt(`${K.name}: wéi vill gouf bezuelt? (op: ${euro(K.sichtOffen)})`, "");
    if (t == null) return;
    const x = runde(+t.trim().replace(",", ".").replace("€", ""));
    if (!(x > 0)) return alert("Dat ass kee Betrag.");
    const { zahlungen, rest } = verteile(K.sicht, x);
    if (rest > 0 && !confirm(`Dat sinn ${euro(rest)} méi wéi op. Agedroe ginn nëmmen ${euro(x - rest)}. Ok?`)) return;
    eintragen(zahlungen);
  });
  box.querySelectorAll("[data-erinnern]").forEach(b => b.onclick = async () => {
    const K = liste[+b.dataset.erinnern];
    const t = erinnerung({ ...K, verkaeufe: K.sicht, offen: K.sichtOffen });
    try { if (navigator.share) { await navigator.share({ text: t }); return; } } catch (f) { if (f && f.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(t); alert("Text kopéiert:\n\n" + t); } catch { prompt("Text fir ze kopéieren:", t); }
  });
}

/* ---------- Bestand ---------- */
function renderBestand() {
  const tab = $("#bTabelle");
  const sorten = Z.sortenNamen.filter(s => Z.halter.some(h => hat(Z, h, s) !== 0) || !(Z.cfg.sorten.find(c => c.name === s) || {}).aus);
  tab.innerHTML = `<div class="card"><h2>Wien huet wat?</h2><div class="tabwrap"><table>
    <tr><th></th>${sorten.map(s => `<th>${esc(s)}</th>`).join("")}<th>Σ</th></tr>
    ${Z.halter.map(h => `<tr><td>${h === LAGER ? "📦 Lager" : esc(h)}</td>${sorten.map(s => { const n = hat(Z, h, s); return `<td style="${n < 0 ? "color:var(--rot)" : ""}">${n || "–"}</td>`; }).join("")}<td><b>${sorten.reduce((a, s) => a + hat(Z, h, s), 0)}</b></td></tr>`).join("")}
    <tr class="summe"><td>Total</td>${sorten.map(s => `<td>${Z.sorten[s].da}</td>`).join("")}<td>${Z.flaschen.da}</td></tr>

    ${B.modus === "bewegung" ? `<div class="zeile"><div><label>Vun</label><select id="bVon">${opt(halter, B.von, nameH)}</select></div>

    <div class="zeile"><div><label>Zort</label><select id="bSorte">${opt(sorten, B.sorte)}</select></div>
      <div><label>Fläschen</label><input id="bN" inputmode="numeric" pattern="[0-9]*" value="${esc(B.n)}" placeholder="0"></div></div>
    <button class="haupt" id="bOk">Androen</button>

  box.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { B.modus = b.dataset.m; renderBForm(); });
  const bind = (id, k) => { const el = $(id); if (el) el.oninput = el.onchange = () => { B[k] = el.value; }; };
  bind("#bVon", "von"); bind("#bAn", "an"); bind("#bWer", "wer"); bind("#bGrund", "grund"); bind("#bSorte", "sorte"); bind("#bN", "n");
  $("#bOk").onclick = () => {
    const meld = (art, t) => $("#bMeld").innerHTML = `<div class="meldung ${art}">${esc(t)}</div>`;
    const n = parseInt(B.n, 10);
    if (!ganz(n)) return meld("fehler", "Wéi vill Fläschen?");
    let e;
    if (B.modus === "abfuellung") e = { art: "abfuellung", sorte: B.sorte, n };
    else if (B.modus === "bewegung") {
      if (B.von === B.an) return meld("fehler", "Vun an Un sinn d'selwecht.");
      if (n > hat(Z, B.von, B.sorte) && !confirm(`Laut der App huet ${de(B.von)} just ${hat(Z, B.von, B.sorte)} × ${B.sorte}. Trotzdeem?`)) return;
      e = { art: "bewegung", sorte: B.sorte, n, von: B.von, an: B.an };

/* ---------- Verlauf ---------- */

/* ---------- Doppeltipp-Schutz, Stufe 1 ----------
   Ein zweiter Tipp auf denselben Knopf innerhalb von 800 ms wird verschluckt. „Derselbe“ heißt gleiche
   id, gleiche data-Werte und gleicher Text — gilt also auch, wenn der Knopf inzwischen neu gebaut
   wurde (sonst träfe der zweite Tipp z. B. den nächsten Käufer, der in der Liste nachrückt).
   Verschiedene Knöpfe schnell hintereinander gehen durch. Ausnahme: −/+ beim Verkaufen. */
let LETZTER_TIPP = { k: "", t: 0 };
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("button");
  if (!b || b.closest(".stepper")) return;
  const jetzt = Date.now();
  const k = b.id + "|" + JSON.stringify(b.dataset) + "|" + b.textContent.trim();
  if (k === LETZTER_TIPP.k && jetzt - LETZTER_TIPP.t < 800) { e.preventDefault(); e.stopImmediatePropagation(); return; }
  LETZTER_TIPP = { k, t: jetzt };
}, true);

/* Doppeltipp-Zoom, Stufe 2: touch-action allein hat am iPhone nicht gereicht (Fassung n, gemeldet
   13.11.2026 — in der Koeppchen-App reicht es, Ursache unbekannt). Ein zweiter Ein-Finger-Tipp innerhalb
   von 350 ms wird abgefangen, bevor iOS zoomt. Zwei-Finger-Zoom bleibt (nur changedTouches = 1, und
   nur wenn kein zweiter Finger liegt). −/+ bekommt den Tipp trotzdem (click() von Hand);
   Eingabefelder bleiben unberührt (Doppeltipp markiert dort ein Wort). */
let LETZTES_ENDE = { t: 0, x: 0, y: 0 };
document.addEventListener("touchend", e => {
  const jetzt = Date.now();
  const z = e.target;
  const einFinger = e.changedTouches.length === 1 && e.touches.length === 0;
  const p = e.changedTouches[0];
  // Zoom-Doppeltipp = zweimal dieselbe Stelle. Zwei verschiedene Knöpfe schnell hintereinander gehen durch.
  const nah = p && Math.abs(p.clientX - LETZTES_ENDE.x) < 40 && Math.abs(p.clientY - LETZTES_ENDE.y) < 40;
  if (einFinger && nah && jetzt - LETZTES_ENDE.t < 350 && !(z.closest && z.closest("input,select,textarea"))) {
    e.preventDefault();
    const knopf = z.closest && z.closest(".stepper button");
    if (knopf) knopf.click();
  }
  LETZTES_ENDE = einFinger && p ? { t: jetzt, x: p.clientX, y: p.clientY } : { t: 0, x: 0, y: 0 };
}, { passive: false });

/* ---------- Start ---------- */
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => {
  TAB = b.dataset.tab; EIN.tab = TAB; merke(SP, EIN);
  if (TAB === "verkaufen" && FORM) FORM.meldung = null;
  EFORM = null; render(); window.scrollTo(0, 0);
});
$("#zahnrad").onclick = () => { TAB = "einst"; EFORM = null; render(); window.scrollTo(0, 0); };
/* ---------- Neue Fassung ----------
   Beim Öffnen und bei jeder Rückkehr zur App: liegt bei GitHub eine andere FASSUNG, lädt die App
   sich selbst neu — außer mitten in einem Eintrag, dann ein Knopf. Erst fetch mit cache:"reload"
   (ersetzt die Kopie im Zwischenspeicher), dann reload. Je Zielfassung höchstens ein Versuch in
   5 min, damit ein noch alter CDN-Stand keine Schleife macht. */
let NEUE = "";
function mittenImEintrag() {
  const a = document.activeElement;
  if (a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return true;
  if (TAB === "einst" && EFORM) return true;
  if (FORM && (FORM.kaeufer.trim() || Object.values(FORM.n).some(n => n > 0) || FORM.betrag != null)) return true;
  if (BFORM && String(BFORM.n).trim()) return true;
  if (L_NEU) return true;
  return false;
}
function neuLaden() {
  try { localStorage.setItem("millebeier_v1_update", JSON.stringify({ f: NEUE, t: Date.now() })); } catch {}
  location.reload();
}
async function updatePruefen() {
  if (navigator.onLine === false) return;
  try {
    const r = await fetch(location.href.split("#")[0], { cache: "reload" });
    if (!r.ok) return;
    const m = (await r.text()).match(/const FASSUNG = "([^"]+)"/);
    if (!m || m[1] === FASSUNG) return;
    NEUE = m[1];
    const v = lade("millebeier_v1_update", {});
    const kuerzlich = v.f === NEUE && Date.now() - v.t < 5 * 60000;
    if (!kuerzlich && !mittenImEintrag()) return neuLaden();
    const k = $("#neu");
    k.textContent = `Nei Versioun (${NEUE}) — tippen fir ze aktualiséieren`;
    k.classList.remove("versteckt");
  } catch {}
}
$("#neu").onclick = neuLaden;
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { abgleichen(); updatePruefen(); } });
window.addEventListener("online", abgleichen);
setInterval(() => { if (document.visibilityState === "visible") abgleichen(); }, 20000);

neuRechnen();
render();
abgleichen();
updatePruefen();
</script>
