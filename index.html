<!doctype html>
<html lang="lb">
<head>
<meta charset="utf-8">
<!-- Kein viewport-fit=cover (Lehre aus den anderen Apps: iOS legt die Seite dann selbst in den sicheren Bereich). -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Millebéier</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Millebéier">
<script>/* Home-Bildschirm-App erkennen: iOS meldet ohne Manifest kein display-mode standalone (Fassung g) */
if (navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches)) document.documentElement.classList.add("app");</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" sizes="180x180" href="bilder/icon-180.png">
<link rel="icon" type="image/png" href="bilder/icon-180.png">
<style>
:root{
  --bg:#000000; --card:#151515; --card2:#232323; --line:#353535;
  --text:#ffffff; --muted:#a8a8a8; --akzent:#e3141b; --akzent2:#ff6b6f; --weissgrau:#dcdcdc;
  --gruen:#7cc47f; --rot:#ff5a52; --gelb:#e8c547;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html{touch-action:manipulation} /* wie in der Koeppchen-App: kein Zoom beim Doppeltippen, zwei Finger zoomen weiter */
*{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:0 0 96px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:3px solid var(--akzent);box-shadow:0 1px 0 var(--weissgrau);padding:10px 0 8px}
.kopf{display:flex;align-items:center;gap:10px}
.kopf h1{font-size:22px;margin:0;flex:1;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.kopf h1 img{width:36px;height:36px;display:block}
.kopf h1 .akz{position:relative;display:inline-block}
.kopf h1 .akz::after{content:"";position:absolute;left:.07em;top:.3em;width:.38em;height:.11em;background:var(--akzent);border-radius:1px;transform:rotate(-10deg)}
/* Sync als kleines Zeichen (vom Nutzer, Fassung b: Kopf war zu voll); Antippen zeigt den ganzen Text darunter */
#sync{flex:none;font-size:13px;font-weight:700;border-radius:10px;padding:3px 7px;white-space:nowrap;cursor:pointer;color:var(--gruen);background:none;border:0}
#sync:empty{display:none}
#sync.ok{font-size:18px;padding:2px 6px}
@media (max-width:360px){.kopf{gap:5px}.kopf h1{font-size:18px;gap:6px}.kopf h1 img{width:28px;height:28px}.zahnrad{font-size:19px}#sync{padding:2px 5px;font-size:12px}}
#syncInfo{margin:8px 0 2px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14px;color:#ddd}
.kopf h1 > span{white-space:nowrap} /* Name nie umbrechen, auch bei langem Status daneben */
#sync.fehler{color:var(--gelb);background:#3a3115}
.zahnrad{background:none;border:0;color:var(--text);font-size:22px;padding:4px 2px;cursor:pointer;position:relative;flex:none}
.zahnrad.an{background:var(--akzent);border-radius:10px;padding:4px 6px}
.kalic{display:inline-flex;flex-direction:column;width:26px;height:27px;border-radius:6px;overflow:hidden;background:#fff;vertical-align:middle;box-shadow:0 0 0 1px #000}
.kalic i{display:block;height:9px;background:var(--akzent);color:#fff;font-style:normal;font-size:7px;line-height:9px;font-weight:800;text-align:center;letter-spacing:.2px}
.kalic b{display:block;flex:1;color:#111;font-size:15px;line-height:18px;font-weight:800;text-align:center}
.zahnrad.an .kalic{box-shadow:0 0 0 1px #fff}
#kalBtn .badge{top:auto;bottom:-6px;right:-8px} /* unten rechts, damit der Monat frei bleibt */
.zahnrad .badge{position:absolute;top:-4px;right:-6px;background:var(--akzent);color:#fff;border-radius:9px;font-size:11px;padding:1px 5px;font-weight:700;border:1px solid #000;line-height:1.3}
/* Kalender */
.tmonat{color:var(--akzent2);font-weight:700;font-size:15px;margin:14px 0 2px}
.tmonat:first-of-type{margin-top:4px}
.ter{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.tmonat + .ter{border-top:0}
.ter.vorbei{opacity:.55}
.tdat{width:46px;flex:none;text-align:center;background:var(--card2);border-radius:10px;padding:4px 0;align-self:flex-start}
.tdat b{display:block;font-size:20px;line-height:1.1}.tdat small{font-size:11px;color:var(--muted);text-transform:uppercase}
.tdat.haut{background:var(--akzent)}.tdat.haut small{color:#fff}
.tinh{flex:1;min-width:0}.tinh > b{font-size:16px}.tinh .z{font-size:13px;color:var(--muted)}
.chip.auto{border:1px dashed #666;color:var(--muted);background:none}
.tarten{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tarten button{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 2px;font-size:12px;font-weight:600;cursor:pointer}
.tarten button i{display:block;font-style:normal;font-size:20px;height:26px;line-height:26px}
.tflasche{width:11px;height:22px;vertical-align:-4px}
.tarten .tflasche{width:12px;height:24px;vertical-align:-3px}
/* alle zehn Filter in einer Zeile ohne Scrollen (vom Nutzer, Fassung e) */
.tfilter{display:grid;grid-template-columns:auto repeat(9,minmax(0,1fr));gap:3px;margin-top:8px}
.tfilter button{min-width:0;height:34px;padding:0;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:16px;line-height:1;cursor:pointer}
.tfilter button.alle{font-size:12px;font-weight:700;padding:0 6px}
.tfilter .tflasche{width:9px;height:18px;vertical-align:-3px}
.tfilter button.an{border:2px solid var(--akzent);background:#2a1415}
.tfilter button.alle.an{background:var(--akzent);border-color:var(--akzent)}
.tarten button.an{border:2px solid var(--gruen)}
.leit{display:flex;gap:6px;flex-wrap:wrap}
.leit button{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:18px;padding:7px 14px;font-size:15px;cursor:pointer}
.leit button.an{background:#1f3a20;color:#bfe8c0;border-color:var(--gruen)}
.tfolge{background:#1a261a;border:1px solid #3a5a3a;border-radius:10px;padding:10px;margin-top:14px}
.tfz{margin-top:10px}.tfz .check{margin:0}.tfz input[type=date]{display:block;width:100%;box-sizing:border-box;margin-top:6px}
/* Reiter unten wie bei iPhone-Apps, Symbol + kurzer Name (vom Nutzer, Fassung j) */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(6,minmax(max-content,1fr));gap:0;
  background:#0b0b0b;border-top:1px solid var(--line);padding:4px max(2px, calc((100% - 640px) / 2)) 8px}
html.app nav{padding-bottom:22px;padding-left:max(14px, calc((100% - 640px) / 2));padding-right:max(14px, calc((100% - 640px) / 2))} /* Home-Balken und runde Ecken am iPhone (kein viewport-fit=cover); Fassung f: S von Stock / t von Client lagen in der Rundung; Fassung g: über die Klasse app statt @media, die iOS ohne Manifest nicht erkennt */
nav button{background:none;border:0;color:var(--muted);border-radius:10px;padding:2px 0;font-size:10px;font-weight:600;
  cursor:pointer;position:relative;white-space:nowrap;min-width:0}
nav button i{display:block;font-style:normal;font-size:22px;line-height:30px;margin:0 7px 1px;border-radius:10px}
nav button.an{color:#fff}
nav button.an i{background:var(--akzent)}
nav .badge{position:absolute;top:-3px;left:calc(50% + 6px);background:var(--rot);color:#fff;border-radius:9px;
  font-size:10px;padding:0 5px;font-weight:700;line-height:16px}
nav .badge.grau{background:var(--card2);border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.card h2{font-size:17px;margin:0 0 10px}
/* Startseite */
.hallo{font-size:21px;font-weight:700;margin:16px 2px 4px}.hallo small{display:block;font-size:14px;color:var(--muted);font-weight:400}
.hgross{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.hgross button{position:relative;background:var(--card2);color:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 2px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.hgross button i{display:block;font-style:normal;font-size:30px;line-height:36px;margin-bottom:2px}
.hgross button.hg{background:#1f3a20;border:1px solid var(--gruen);color:#bfe8c0}
.hgross button.hb{background:var(--card2);border:1px solid var(--line)}
.hgross .badge{position:absolute;top:-6px;right:-4px;background:var(--rot);color:#fff;border-radius:9px;font-size:12px;padding:1px 6px;font-weight:700}
.hz{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.card h2 + .hz{border-top:0}.hz b{font-size:17px}
.gelb{color:var(--gelb)}
/* Aufgaben (vom Nutzer, 17.11.2026) */
.kgross{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 0}
.kgross button{border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--text);padding:11px 4px;cursor:pointer;text-align:center}
.kgross button b{display:block;font-size:17px} .kgross button small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.kgross button.an{background:var(--akzent);border-color:var(--akzent)} .kgross button.an small{color:#fdd}
.aufz{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid #262626}
.aufz:first-of-type{border-top:0}
.abox{width:26px;height:26px;flex:none;border:2px solid #888;border-radius:7px;background:none;color:#10200f;font-weight:900;font-size:15px;padding:0;cursor:pointer;line-height:1}
.abox.an{background:var(--gruen);border-color:var(--gruen)} .abox.leer{border:0;font-size:18px;text-align:center;cursor:default}
.atx{flex:1;min-width:0;font-size:15px;overflow-wrap:anywhere} .atx small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.aufz.erl .atx{color:var(--muted)}
.atx .rot{color:var(--rot);font-weight:700}
.alink{color:#8cb8ff;cursor:pointer;white-space:nowrap} .alink .tflasche{height:14px;width:auto;vertical-align:-2px}
.aleg{margin-top:10px;padding-top:8px;border-top:1px solid #333;font-size:13px;color:var(--muted)}
.aform .atitel{display:block;color:var(--gelb);margin-bottom:6px}
.aneu{display:flex;gap:6px} .aneu input{flex:1;margin:0}
.aplus{flex:none;width:48px;border:0;border-radius:10px;background:var(--akzent);color:#fff;font-size:24px;font-weight:700;cursor:pointer}
.afuer{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
.afuer button{border:1px solid var(--line);background:none;color:#ddd;border-radius:14px;padding:4px 10px;font-size:13px;cursor:pointer}
.afuer button.an{background:#3a1012;border-color:var(--akzent);color:#fff}
.liv .aform,.ter .aform{margin-top:10px;background:#1d1a0c;border:1px solid #4a4115;border-radius:12px;padding:10px}
.knopf.gelbk{border-color:var(--gelb);color:var(--gelb)}
.knopfe.einz{flex-wrap:nowrap;gap:5px} .knopfe.einz .knopf{flex:1 1 auto;min-width:0;padding:9px 4px;font-size:13px;white-space:nowrap}
.knopfe.einz.t .knopf{font-size:14px;padding:9px 6px}
@media (max-width:340px){.knopfe.einz{flex-wrap:wrap}.knopfe.einz .knopf{flex:0 1 auto;padding:9px 8px}}
/* Fläschen (Fassung c) */
.absicht{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.absicht button{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:12px 8px;text-align:left;font-size:15px;font-weight:700;line-height:1.25;cursor:pointer}
.absicht button i{display:block;font-style:normal;font-size:24px;margin-bottom:4px;height:56px} .absicht button i svg{display:block}
.absicht button small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.pfeil{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:10px} .pfeil.eins{grid-template-columns:1fr}
.pk{background:#0b0b0b;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;min-width:0}
.pk b{display:block;font-size:16px;overflow-wrap:anywhere} .pk small{color:var(--muted);font-size:12px}
.pk .aend{display:block;margin:3px auto 0;background:none;border:0;color:#8cb8ff;font-size:13px;cursor:pointer} .pk select{margin-top:6px}
.pm{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:26px;color:var(--akzent)}
.pm button{font-size:14px;border:1px solid var(--line);border-radius:8px;padding:2px 8px;background:var(--card2);color:#ddd;cursor:pointer}
.vorschau{margin-top:10px;background:#16241a;border:1px solid #2d4a33;border-radius:10px;padding:8px 10px;font-size:14px;color:#cfe9d0}
.gruende{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.gruende button{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 4px;font-size:14px;font-weight:600;cursor:pointer}
.gruende button.an{background:#3a1012;border-color:var(--akzent)}
.zurueck{background:none;border:0;color:var(--muted);font-size:14px;padding:4px 0;cursor:pointer}
.ajed{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.ajed button{border:1px solid var(--line);background:none;color:#ddd;border-radius:10px;padding:8px 4px;font-size:13px;font-weight:600;cursor:pointer}
.ajed button.an{background:#3a1012;border-color:var(--akzent);color:#fff}
.ajed button small{display:block;font-weight:400;font-size:11px;color:var(--muted);margin-top:1px}
.astand{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.astand span{font-size:11.5px;border-radius:8px;padding:1px 7px;background:#262626;color:#bbb}
.astand span.ok{background:#1f3a20;color:#bfe8c0}
.hgross button i.hbild{height:44px;display:flex;justify-content:center;margin-top:-4px} .hgross button i.hbild svg{width:60px;height:52px;margin-top:-6px}
.hgross button.hh{background:var(--card2);border:1px solid var(--line)} .hgross button.hh.an{border-color:#fff;background:#2c2c2c}
.hkopf{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hmehr{background:var(--akzent);border:1px solid var(--akzent);color:#000;font-size:13px;cursor:pointer;padding:5px 12px;border-radius:14px;font-weight:700;flex:none}
.hklick{cursor:pointer}
.card h3{font-size:15px;margin:14px 0 6px;color:var(--akzent2)}
.muted{color:var(--muted)} small{font-size:13px}
.kacheln{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kachel{background:var(--card2);border-radius:12px;padding:10px 12px}
.kachel b{display:block;font-size:26px;line-height:1.15}
.kachel span{font-size:13px;color:var(--muted)}
.kachel.geld b{color:var(--gruen)} .kachel.offen b{color:var(--gelb)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
tr.summe td{font-weight:700;border-bottom:0}
.rz{display:block;font-size:11px;color:var(--gelb);font-weight:500;white-space:nowrap;line-height:1.2}
tr.resz td{color:var(--gelb);border-top:0;padding-top:2px;padding-bottom:2px}
tr.totz td{color:var(--muted);border-top:0;padding-top:2px}
.stocktab table{font-size:13px}.stocktab th,.stocktab td{padding:6px 3px}.stocktab th small{font-weight:400}
.stocktab .rz{font-size:10.5px}
.tabwrap{overflow-x:auto}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,select{width:100%;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 12px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:30px}
.zeile{display:flex;gap:8px;align-items:center}
.zeile > *{flex:1}
.posten{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.posten:last-child{border-bottom:0}
.posten .pn{flex:1;min-width:0}
.posten .pn b{display:block}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);
  color:var(--text);font-size:24px;line-height:1;cursor:pointer;touch-action:manipulation}
.stepper input{width:56px;text-align:center;font-size:20px;font-weight:700;padding:8px 2px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.seg.drei{grid-template-columns:1fr 1fr 1fr}
.seg button{padding:12px 4px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);
  font-size:15px;font-weight:600;cursor:pointer}
.seg button.an{background:var(--akzent);color:#fff;border-color:var(--akzent)}
.seg button.an.gruen{background:var(--gruen);border-color:var(--gruen);color:#0d1f0e}
.seg.zahl{grid-template-columns:1fr 1fr;margin-top:4px} .seg button.breit{grid-column:1/-1}
/* Zahlungsart-Knöpfe: Bild oben, Name darunter; gewählt = grüner Rahmen, das Bild bleibt sichtbar */
.seg button.zbtn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 7px 6px}
.seg button.zbtn img{display:block;width:100%;height:48px;object-fit:cover;border-radius:8px}
.seg button.zbtn span{font-size:13px}
.seg button.zbtn.an{background:var(--card2);color:var(--text);border-color:var(--gruen);box-shadow:0 0 0 2px var(--gruen) inset}
.seg button.zbtn.an span::before{content:"✓ ";color:var(--gruen)}
#zahlWahl .seg button.zbtn{padding:8px}
#zahlWahl .seg button.zbtn img{height:56px}
.seg button.an.gelb{background:var(--gelb);border-color:var(--gelb);color:#231d05}
.haupt{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:var(--akzent);color:#fff;
  font-size:17px;font-weight:700;cursor:pointer}
.haupt:disabled{opacity:.45}
.knopf{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);
  font-size:14px;font-weight:600;cursor:pointer}
.knopf.akt{background:var(--akzent);color:#fff;border-color:var(--akzent)}
.knopfe{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.meldung{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:14px}
.meldung.ok{background:#20331f;color:#bfe8c0}
.meldung.warn{background:#3a3115;color:#f4e2a0}
.meldung.fehler{background:#3d1c18;color:#ffc2b8}
.leer{color:var(--muted);text-align:center;padding:12px 0}
.kunde .kopfz{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.kunde .betrag{font-size:22px;font-weight:700;color:var(--gelb);white-space:nowrap}
.vk{font-size:14px;padding:6px 0;border-top:1px dashed var(--line);display:flex;justify-content:space-between;gap:8px}
.vk span:last-child{white-space:nowrap}
.log{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.log:last-child{border-bottom:0}
.log .lt{flex:1;min-width:0}
.log .lt small{display:block;color:var(--muted)}
.log.weg .lt > div{text-decoration:line-through;color:var(--muted)}
.log .zurueck{background:none;border:1.5px solid var(--akzent);color:var(--akzent);border-radius:10px;min-width:40px;height:36px;padding:0 10px;font-size:18px;font-weight:700;line-height:1;cursor:pointer}
.hinweis{font-size:13px;color:var(--muted);margin-top:8px}
#neu{display:block;width:100%;margin:8px 0 0;padding:10px 12px;border:0;border-radius:10px;background:var(--akzent);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.probe{background:#3a3115;color:#f4e2a0;border-radius:10px;padding:8px 12px;font-size:13px;margin-top:10px}
.sorte-ed{display:grid;grid-template-columns:1fr 84px 44px 32px;gap:6px;align-items:center;margin-bottom:6px}

<script>
/* Adresse des Cloudflare-Workers. Leer = Probe-Modus (alles nur auf diesem Handy). */
const WORKER_URL = "https://millebeier.rjtp6r9s9h.workers.dev/";
const FASSUNG = "20.11.2026 a";

/* === Logik === (kein DOM; test/logik.mjs schneidet diesen Block aus) */
const LAGER = "Lager";
const STANDARD = {
  sorten: [{ name: "NEIPA", preis: 3 }, { name: "White IPA", preis: 3 }, { name: "Brown Porter", preis: 3 }],
  leute: ["Jeff", "Marc", "Claude", "Laurent"],
};
const GRUENDE = { getrunken: "selwer gedronk", verschenkt: "verschenkt / Prouf", kaputt: "futti", sonst: "soss eppes" };
const ARTEN = ["abfuellung", "bewegung", "abgang", "verkauf", "zahlung", "einstellungen", "storno", "livraison", "rechnung", "bier", "bierstatus", "datei", "kunde", "termin", "aufgabe", "aufhak"];
/* Kalender (vom Nutzer, 16.11.2026): feste Arten; Akafen bewusst nicht (vom Nutzer). Reihenfolge = Knöpfe im Formular. */
const TERMIN_ARTEN = {
  braudag: { ic: "🍺", txt: "Braudag" }, umschlauchen: { ic: "🔄", txt: "Ëmschlauchen" }, hopfen: { ic: "🌿", txt: "Hopfestopfen" },
  abfuellen: { ic: "🍾", txt: "Afëllen" }, etikett: { ic: "🏷️", txt: "Etikettéieren" }, stand: { ic: "🎪", txt: "Stand / Fest" },
  reunioun: { ic: "🗣️", txt: "Reunioun" }, aanescht: { ic: "📝", txt: "Aanescht" },
};
// Vorschlag nach dem Braudag (vom Nutzer): Ëmschlauchen +7, Afëllen +14 Tage, im Formular änderbar.
// Biersorten zum Auswählen im Kalender (vom Nutzer, Fassung e) — fest, nicht der Bestand; Neues über „Neien Béier antippen“.
const TERMIN_BIERE = ["IPA", "NEIPA", "WHIPA", "Brown Porter", "Clasico", "Rusty"];
const NO_BRAUDAG = [{ typ: "umschlauchen", tage: 7 }, { typ: "abfuellen", tage: 14 }];
/* Gebinde: Fässer sind kein eigenes Bier, sondern „<Bier> Keg 20l“ / „<Bier> Keg 30l“ als Schlüssel im Bestand
   (so hießen die Fass-Biere vorher schon — Altbestand ordnet sich damit von selbst seinem Bier zu). */
const FAESSER = [{ l: 20, std: 150 }, { l: 30, std: 180 }];
const fassKey = (bier, l) => `${bier} Keg ${l}l`;
const zerlege = key => { const m = /^(.*) Keg (20|30)l$/.exec(key); return m ? { bier: m[1], l: +m[2] } : { bier: key, l: 0 }; };
const istFass = key => zerlege(key).l > 0;
const gebindeText = key => { const l = zerlege(key).l; return l ? `Fass ${l} l` : "Fläsch"; };
const ZAHLARTEN = { wero: "WERO", sumup: "SumUp", bank: "Iwwerweisung", bar: "Bar" };
const ZAHLBILD = { wero: "bilder/zahl-wero.jpg", sumup: "bilder/zahl-sumup.png", bank: "bilder/zahl-bank.png", bar: "bilder/zahl-bar.jpg" }; // vom Nutzer, 14.11.2026
const FELDER = { etikett: "Etikett", rezept: "Rezept", protokoll: "Brauprotokoll", anner: "Aner Dateien" };

const ganz = n => Number.isInteger(n) && n > 0 && n <= 100000;
const geld = x => typeof x === "number" && isFinite(x) && x >= 0 && x <= 1000000;
const text = (s, max = 60) => typeof s === "string" && s.trim().length > 0 && s.length <= max;
const runde = x => Math.round(x * 100) / 100;

function euro(x) {
  const r = runde(x || 0);
  return (Number.isInteger(r) ? String(r) : r.toFixed(2).replace(".", ",")) + " €";
}

const optDatum = d => d === undefined || d === "" || (typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d));
const optZahl = (x, a, b) => x === undefined || x === null || (typeof x === "number" && isFinite(x) && x >= a && x <= b);
const kfOk = kf => kf === undefined || (kf && typeof kf === "object" && !Array.isArray(kf) &&
  Object.keys(kf).every(x => ["firma", "name", "vorname"].includes(x) && typeof kf[x] === "string" && kf[x].length <= 80));
const optText = (t, m) => t === undefined || (typeof t === "string" && t.length <= m);
const postenOk = p => Array.isArray(p) && p.length > 0 && p.length <= 30 && p.every(x => x && text(x.sorte) && ganz(x.n));

function gueltig(e) {
  if (!e || typeof e !== "object" || typeof e.id !== "string" || typeof e.zeit !== "number") return false;
  switch (e.art) {
    case "abfuellung": return text(e.sorte) && ganz(e.n);
    case "bewegung": return text(e.sorte) && ganz(e.n) && text(e.von) && text(e.an) && e.von !== e.an;
    case "abgang": return text(e.sorte) && ganz(e.n) && text(e.wer) && e.grund in GRUENDE && optText(e.notiz, 300);
    case "verkauf":
      return text(e.verkaeufer) && text(e.kaeufer, 120) && geld(e.betrag) && postenOk(e.posten) &&
        (e.aus === undefined || text(e.aus)) && (e.liv === undefined || typeof e.liv === "string") &&
        optText(e.notiz, 300) && optDatum(e.datum) && (e.alt === undefined || typeof e.alt === "boolean") &&
        (e.kid === undefined || typeof e.kid === "string") && kfOk(e.kf);
    case "livraison":
      return text(e.kunde, 120) && text(e.kontakt, 30) && text(e.aus, 30) && geld(e.betrag) && postenOk(e.posten) &&
        typeof e.datum === "string" && /^\d{4}-\d{2}-\d{2}$/.test(e.datum) &&
        (e.anlass === undefined || e.anlass === "" || text(e.anlass, 80)) && (e.kid === undefined || typeof e.kid === "string") && kfOk(e.kf) &&
        (e.notiz === undefined || (typeof e.notiz === "string" && e.notiz.length <= 300)) &&
        (e.vorher === undefined || (typeof e.vorher === "string" && e.vorher.length <= 80));
    case "rechnung": return typeof e.ref === "string";
    case "bier":
      return text(e.name, 30) && e.name !== LAGER && geld(e.preis) && optDatum(e.braudatum) && optDatum(e.mhd) &&
        optZahl(e.alk, 0, 30) && optZahl(e.liter, 0, 100000) && optText(e.stil, 40) && optText(e.notiz, 300) &&
        (e.preis20 === undefined || geld(e.preis20)) && (e.preis30 === undefined || geld(e.preis30));
    case "bierstatus": return text(e.name, 30) && ["aktiv", "archiv", "weg"].includes(e.status);
    case "termin": {
      const uhrOk = x => x === undefined || x === "" || (typeof x === "string" && /^\d{2}:\d{2}$/.test(x));
      return typeof e.tid === "string" && /^[A-Za-z0-9_-]{6,64}$/.test(e.tid) && (e.weg === true || (
        e.typ in TERMIN_ARTEN && text(e.titel, 80) && typeof e.datum === "string" && /^\d{4}-\d{2}-\d{2}$/.test(e.datum) &&
        uhrOk(e.uhr) && uhrOk(e.bis) && optText(e.bier, 120) && optText(e.wou, 120) && optText(e.notiz, 300) &&
        (e.wer === undefined || (Array.isArray(e.wer) && e.wer.length <= 12 && e.wer.every(w => text(w, 30))))));
    }
    case "aufgabe": // Aufgaben (vom Nutzer, 17.11.2026): je aid gilt der neueste Eintrag; abhaken = derselbe Inhalt mit erledigt
      return typeof e.aid === "string" && /^[A-Za-z0-9_:-]{6,100}$/.test(e.aid) && (e.weg === true || (text(e.text, 200) &&
        Array.isArray(e.fuer) && e.fuer.length >= 1 && e.fuer.length <= 12 && e.fuer.every(w => text(w, 30)))) &&
        optDatum(e.bis) && (e.erledigt === undefined || typeof e.erledigt === "boolean") && (e.auto === undefined || typeof e.auto === "boolean") &&
        (e.jeder === undefined || typeof e.jeder === "boolean") &&
        (e.ref === undefined || (e.ref && ["liv", "termin"].includes(e.ref.typ) && typeof e.ref.id === "string" && e.ref.id.length <= 80));
    case "aufhak": // „Jidderee muss“ (vom Nutzer, Fassung b): jeder Haken einzeln, wer = durch; an:false nimmt ihn zurück
      return typeof e.aid === "string" && /^[A-Za-z0-9_:-]{6,100}$/.test(e.aid) && typeof e.durch === "string" && (e.an === undefined || typeof e.an === "boolean");
    case "kunde":
      return typeof e.kid === "string" && /^[A-Za-z0-9_-]{6,64}$/.test(e.kid) && (e.weg === true || text(e.firma, 80) || text(e.name, 80) || text(e.vorname, 60)) &&
        (e.alias === undefined || (Array.isArray(e.alias) && e.alias.length <= 20 && e.alias.every(a => text(a, 120)))) &&
        optText(e.firma, 80) && optText(e.name, 80) && optText(e.vorname, 60) &&
        optText(e.adresse, 200) && optText(e.ort, 120) && optText(e.tel, 40) && optText(e.mail, 120) && optText(e.notiz, 300) &&
        (e.weg === undefined || typeof e.weg === "boolean");
    case "datei":
      return typeof e.fid === "string" && /^[A-Za-z0-9_-]{8,80}$/.test(e.fid) && text(e.name, 120) && optText(e.typ, 100) &&
        Number.isInteger(e.groesse) && e.groesse > 0 && Number.isInteger(e.teile) && e.teile >= 1 && e.teile <= 200 &&
        typeof e.bier === "string" && e.bier.length <= 30 && e.feld in FELDER;
    case "zahlung": return typeof e.ref === "string" && geld(e.betrag) && e.betrag > 0 && (e.wie === undefined || e.wie in ZAHLARTEN) &&
      (e.vor === undefined || typeof e.vor === "boolean"); // vor: Vorauszahlung, ref = lid der Bestellung (Fassung h)
    case "einstellungen":
      return Array.isArray(e.sorten) && e.sorten.length > 0 && e.sorten.length <= 30 &&
        e.sorten.every(s => s && text(s.name, 30) && geld(s.preis)) &&
        Array.isArray(e.leute) && e.leute.length > 0 && e.leute.length <= 30 && e.leute.every(p => text(p, 30) && p !== LAGER);
    case "storno": return typeof e.ref === "string";
  }
  return false;
}

const ordnung = (a, b) => a.zeit - b.zeit || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);

/* Rechnet aus allen Einträgen den Stand. Nichts wird gespeichert außer den Einträgen selbst. */
function rechne(eintraege) {
  const gesehen = new Set();
  const liste = [];
  for (const e of eintraege || []) {
    if (!gueltig(e) || gesehen.has(e.id)) continue;
    gesehen.add(e.id); liste.push(e);
  }
  liste.sort(ordnung);
  const nachId = new Map(liste.map(e => [e.id, e]));
  // Rückgängig nur für echte Einträge, nie für ein Rückgängig selbst.
  const storniert = new Map();
  for (const e of liste) {
    const ziel = e.art === "storno" && nachId.get(e.ref);
    if (ziel && ziel.art !== "storno" && !storniert.has(ziel.id)) storniert.set(ziel.id, e);
  }
  const aktiv = liste.filter(e => e.art !== "storno" && !storniert.has(e.id));

  let cfg = { sorten: STANDARD.sorten.map(s => ({ ...s })), leute: [...STANDARD.leute] };
  for (const e of aktiv) if (e.art === "einstellungen")
    cfg = { sorten: e.sorten.map(s => ({ name: s.name.trim(), preis: runde(s.preis), aus: !!s.aus })), leute: e.leute.map(p => p.trim()) };

  // Biere mit Eigenschaften (seit 14.11.2026). Die Liste aus den Einstellungen bleibt die Grundlage
  // (Altbestand); ein „bier“-Eintrag fügt ein Bier hinzu oder ergänzt Preis und Eigenschaften.
  // Status: archiv = nicht mehr zu verkaufen, bleibt in Iwwersiicht/Excel; weg = verschwindet überall
  // (Verkäufe bleiben im Verlauf und in der Kasse). Ein neuer „bier“-Eintrag holt ein gelöschtes zurück.
  const basisSorten = cfg.sorten.map(x => ({ ...x }));
  const biere = new Map(), status = new Map();
  for (const e of aktiv) {
    if (e.art === "bier") {
      biere.set(e.name, { name: e.name, preis: runde(e.preis), stil: e.stil || "", braudatum: e.braudatum || "", alk: e.alk ?? null,
        liter: e.liter ?? null, mhd: e.mhd || "", notiz: e.notiz || "", id: e.id, zeit: e.zeit,
        preis20: e.preis20 ?? null, preis30: e.preis30 ?? null });
      if (status.get(e.name) === "weg") status.delete(e.name);
    } else if (e.art === "bierstatus") status.set(e.name, e.status);
  }
  const sl = cfg.sorten.filter(x => !istFass(x.name)).map(x => ({ ...x }));
  const altFass = []; // früher als eigenes Bier angelegte Fässer („Rusty Keg 30l“): nur ihr Preis zählt, fürs Bier
  for (const b of biere.values()) {
    if (istFass(b.name)) { altFass.push(b); continue; }
    const x = sl.find(y => y.name === b.name); if (x) x.preis = b.preis; else sl.push({ name: b.name, preis: b.preis });
  }
  for (const x of sl) {
    const m = biere.get(x.name) || {};
    for (const F of FAESSER) {
      const alt = altFass.find(b => zerlege(b.name).bier === x.name && zerlege(b.name).l === F.l);
      x["preis" + F.l] = m["preis" + F.l] != null ? m["preis" + F.l] : alt ? alt.preis : F.std;
    }
  }
  for (const x of sl) {
    x.meta = biere.get(x.name) || null;
    const stt = status.get(x.name);
    if (stt === "archiv" || (x.aus && stt !== "aktiv")) { x.aus = true; x.archiv = true; }
    if (stt === "aktiv") { x.aus = false; x.archiv = false; }
    if (stt === "weg") x.weg = true;
  }
  const geloescht = new Set(sl.filter(x => x.weg).flatMap(x => [x.name, ...FAESSER.map(F => fassKey(x.name, F.l))]));
  BRAUDATEN = new Map(sl.filter(x => x.meta && x.meta.braudatum).map(x => [x.name, x.meta.braudatum]));
  cfg = { ...cfg, sorten: sl.filter(x => !x.weg) };

  const bestand = {};
  const add = (h, s, n) => { (bestand[h] ||= {}); bestand[h][s] = (bestand[h][s] || 0) + n; };
  const sorten = {};
  const st = s => (sorten[s] ||= { abgefuellt: 0, verkauft: 0, abgang: 0, da: 0 });
  for (const s of cfg.sorten) st(s.name);
  const personen = {};
  const pe = p => (personen[p] ||= { verkauft: 0, umsatz: 0, bezahlt: 0, offen: 0 });
  for (const p of cfg.leute) pe(p);
  const vk = new Map(), altVk = [];
  // Clienten (vom Nutzer, 15.11.2026): je kid gilt der neueste Eintrag; weg = gelöscht. Ältere Einträge (ohne v, nur
  // „name“) gelten als Firma. Verkäufe und Bestellungen zeigen den AKTUELLEN Namen des Clients: über die kid, sonst über
  // einen seiner Namen (auch frühere, `alias`) — so gehen beim Umbenennen keine Käufe verloren (vom Nutzer, Fassung f).
  const kunden = (() => { const m = new Map(); for (const e of aktiv) if (e.art === "kunde") m.set(e.kid, e);
    return [...m.values()].filter(k => !k.weg).map(k => {
      const K = k.v ? { ...k } : { ...k, firma: k.name || "", name: "", vorname: "" };
      return { ...K, label: kundeLabel(K) };
    }).sort((a, b) => a.label.localeCompare(b.label, "de")); })();
  const kNachKid = new Map(kunden.map(K => [K.kid, K])), kNachName = new Map();
  for (const K of kunden) for (const n of kundeNamen(K)) if (!kNachName.has(n)) kNachName.set(n, K);
  const kundeZu = (kid, name) => (kid && kNachKid.get(kid)) || kNachName.get(String(name || "").trim().toLowerCase()) || null;

  for (const e of aktiv) {
    if (e.art === "abfuellung") { add(LAGER, e.sorte, e.n); st(e.sorte).abgefuellt += e.n; }
    else if (e.art === "bewegung") { add(e.von, e.sorte, -e.n); add(e.an, e.sorte, e.n); st(e.sorte); }
    else if (e.art === "abgang") { add(e.wer, e.sorte, -e.n); st(e.sorte).abgang += e.n; }
    else if (e.art === "verkauf") {
      let n = 0;
      // Flaschen kommen von „aus“ (z. B. Lager bei einer Livraison), sonst vom Verkäufer selbst.
      for (const p of e.posten) { add(e.aus || e.verkaeufer, p.sorte, -p.n); st(p.sorte).verkauft += p.n; n += p.n; }
      // Alte Verkäufe aus der Excel-Tabelle (alt: true, vom Nutzer 14.11.2026: „gar nicht in die Kasse“):
      // zählen im Bestand und in der Liste pro Bier, nie in Kasse, Ausstoend oder Umsatz je Person.
      if (e.alt) { altVk.push({ ...e, flaschen: n }); continue; }
      const K = kundeZu(e.kid, e.kaeufer);
      vk.set(e.id, { ...e, kaeuferText: e.kaeufer, kaeufer: K ? K.label : e.kaeufer, kid: K ? K.kid : e.kid, flaschen: n, bezahlt: 0, offen: 0 });
      // Je Person: Flaschen und Fässer getrennt zählen (nie zusammen in einer Zahl).
      const P = pe(e.verkaeufer); P.umsatz += e.betrag;
      for (const p of e.posten) if (istFass(p.sorte)) P.faesser = (P.faesser || 0) + p.n; else P.verkauft += p.n;
    }
  }
  // Livraisons: geplant, bis ein (nicht rückgängig gemachter) Verkauf mit liv = ihre id existiert.
  const liv = new Map();
  for (const e of aktiv) if (e.art === "livraison") {
    const K = kundeZu(e.kid, e.kunde);
    // lid: bleibt beim Ändern gleich (neue Fassung trägt `vorher`), damit Aufgaben an der Bestellung hängen bleiben
    let lid = e.id, x = e; for (let i = 0; x && x.vorher && i < 50; i++) { lid = x.vorher; x = nachId.get(x.vorher); }
    liv.set(e.id, { ...e, lid, kundeText: e.kunde, kunde: K ? K.label : e.kunde, kid: K ? K.kid : e.kid, verkauf: null }); for (const p of e.posten) st(p.sorte);
  }
  for (const v of vk.values()) if (v.liv && liv.has(v.liv)) { liv.get(v.liv).verkauf = v; v.livraison = liv.get(v.liv); }
  for (const e of aktiv) if (e.art === "rechnung" && vk.has(e.ref)) vk.get(e.ref).rechnungGemacht = true;
  let kasse = 0;
  const kasseNach = {};
  // Vorauszahlung (vom Nutzer, Fassung h): hängt an der Bestellung (lid, bleibt beim Ändern). Vor der Lieferung zählt sie in der
  // Kasse und an der Bestellung, danach am Verkauf der Lieferung. Bestellung gelöscht → zählt nicht mehr (wie ein stornierter Verkauf).
  const livNachLid = new Map([...liv.values()].map(L => [L.lid, L]));
  for (const L of liv.values()) { L.vorbezahlt = 0; L.vorWie = []; }
  for (const e of aktiv) if (e.art === "zahlung") {
    let v = null;
    if (e.vor) {
      const L = livNachLid.get(e.ref); if (!L) continue;
      L.vorbezahlt = runde(L.vorbezahlt + e.betrag); if (e.wie && !L.vorWie.includes(e.wie)) L.vorWie.push(e.wie);
      v = L.verkauf;
    } else { v = vk.get(e.ref); if (!v) continue; } // Verkauf rückgängig gemacht → Zahlung zählt nicht mehr
    if (v) { v.bezahlt = runde(v.bezahlt + e.betrag); if (e.wie) (v.wie ||= []).includes(e.wie) || v.wie.push(e.wie); }
    kasse = runde(kasse + e.betrag);
    kasseNach[e.wie || "?"] = runde((kasseNach[e.wie || "?"] || 0) + e.betrag);
  }
  let offen = 0;
  const kaeufer = new Map();
  for (const v of vk.values()) {
    v.offen = runde(Math.max(0, v.betrag - v.bezahlt));
    offen = runde(offen + v.offen);
    const P = pe(v.verkaeufer); P.bezahlt = runde(P.bezahlt + Math.min(v.bezahlt, v.betrag)); P.offen = runde(P.offen + v.offen);
    const k = v.kaeufer.trim();
    const K = kaeufer.get(k.toLowerCase()) || { name: k, offen: 0, verkaeufe: [] };
    K.offen = runde(K.offen + v.offen); K.verkaeufe.push(v);
    kaeufer.set(k.toLowerCase(), K);
  }
  for (const h in bestand) for (const s in bestand[h]) st(s).da += bestand[h][s];

  const halter = [LAGER, ...cfg.leute];
  for (const h in bestand) if (!halter.includes(h) && Object.values(bestand[h]).some(n => n !== 0)) halter.push(h);
  // sortenNamen = Biere (Flaschen-Schlüssel). Fässer hängen am Bier: fassNamen(bier).
  const sortenNamen = [...cfg.sorten.map(s => s.name), ...Object.keys(sorten).filter(s => !istFass(s) && !cfg.sorten.some(c => c.name === s) && !geloescht.has(s))];
  for (const k of Object.keys(sorten)) if (istFass(k) && !geloescht.has(k) && !sortenNamen.includes(zerlege(k).bier)) sortenNamen.push(zerlege(k).bier);
  for (const s of sortenNamen) st(s);
  const summe = f => sortenNamen.reduce((a, s) => a + sorten[s][f], 0);
  // Reserviert: geplante Livraisons belegen den Bestand dort, wo sie herkommen (vom Nutzer, 14.11.2026).
  const reserviert = {};
  for (const L of liv.values()) if (!L.verkauf) for (const p of L.posten) {
    (reserviert[L.aus] ||= {}); reserviert[L.aus][p.sorte] = (reserviert[L.aus][p.sorte] || 0) + p.n;
  }

  return {
    reserviert, kasseNach, cfg, basisSorten, geloescht, liste, aktiv, storniert, nachId, bestand, halter, sorten, sortenNamen, personen,
    verkaeufe: [...vk.values()],
    altVerkaeufe: altVk,
    vkNachId: vk,
    livraisons: [...liv.values()].sort((a, b) => a.datum.localeCompare(b.datum) || ordnung(a, b)),
    dateien: aktiv.filter(e => e.art === "datei"),
    kunden,
    // Termine (Kalender): je tid gilt der neueste Eintrag, weg = gelöscht; nach Datum und Uhrzeit sortiert
    termine: (() => { const m = new Map(); for (const e of aktiv) if (e.art === "termin") m.set(e.tid, e);
      return [...m.values()].filter(t => !t.weg).sort((a, b) => a.datum.localeCompare(b.datum) || (a.uhr || "").localeCompare(b.uhr || "")); })(),
    // Aufgaben: je aid der neueste Eintrag; erstDurch/erstZeit = wer sie angelegt hat
    aufgaben: (() => { const m = new Map(), erst = new Map(); for (const e of aktiv) if (e.art === "aufgabe") { m.set(e.aid, e); if (!erst.has(e.aid)) erst.set(e.aid, e); }
      // „Jidderee muss“: Haken je Person aus `aufhak`; erledigt erst, wenn alle Nötigen (bei All: alle Leute) abgehakt haben
      const haken = new Map(); for (const e of aktiv) if (e.art === "aufhak") { const h = haken.get(e.aid) || new Map(); if (e.an === false) h.delete(e.durch); else h.set(e.durch, e.zeit); haken.set(e.aid, h); }
      return [...m.values()].filter(a => !a.weg).map(a => {
        const A = { ...a, erstDurch: erst.get(a.aid).durch, erstZeit: erst.get(a.aid).zeit };
        if (!a.jeder) return A;
        const noetig = a.fuer.includes("All") ? [...cfg.leute] : [...a.fuer], h = haken.get(a.aid) || new Map();
        const gemacht = noetig.filter(p => h.has(p)).map(p => ({ wer: p, zeit: h.get(p) }));
        const fertig = gemacht.length === noetig.length, letzt = gemacht.reduce((x, g) => !x || g.zeit > x.zeit ? g : x, null);
        return { ...A, noetig, gemacht, erledigt: fertig, ...(fertig && letzt ? { durch: letzt.wer, zeit: letzt.zeit } : {}) };
      }); })(),
    kaeufer: [...kaeufer.values()].sort((a, b) => b.offen - a.offen || a.name.localeCompare(b.name, "de")),
    kasse, offen,
    umsatz: runde([...vk.values()].reduce((a, v) => a + v.betrag, 0)),
    flaschen: { abgefuellt: summe("abgefuellt"), verkauft: summe("verkauft"), abgang: summe("abgang"), da: summe("da") },
  };
}

/* Luxemburgisch steht vor Namen ein Artikel. Die Verkäufer sind Männer → „de“/„beim“; Käufer (Geschlecht
   unbekannt) bekommen keinen, die Sätze sind dort ohne Artikel gebaut. */
const de = h => h === LAGER ? "d'Lager" : "de " + h;
const beim = h => h === LAGER ? "am Lager" : "beim " + h;
const hat = (Z, wer, sorte) => (Z.bestand[wer] && Z.bestand[wer][sorte]) || 0;
const reserviertBei = (Z, wer, sorte) => (Z.reserviert[wer] && Z.reserviert[wer][sorte]) || 0;
const frei = (Z, wer, sorte) => hat(Z, wer, sorte) - reserviertBei(Z, wer, sorte);
const preisVon = (cfg, key) => {
  const { bier, l } = zerlege(key);
  const s = cfg.sorten.find(x => x.name === bier);
  if (!s) return l ? FAESSER.find(F => F.l === l).std : 0;
  return l ? s["preis" + l] : s.preis;
};
/* Schlüssel eines Biers: Flaschen immer, Fässer nur, wenn es sie gibt oder gab. */
const fassNamen = (Z, bier) => FAESSER.map(F => fassKey(bier, F.l)).filter(k => Z.sorten[k] && (Z.sorten[k].abgefuellt || Z.sorten[k].da || Z.sorten[k].verkauft || Z.sorten[k].abgang || Z.halter.some(h => reserviertBei(Z, h, k))));
const artikelVon = (Z, bier) => [bier, ...fassNamen(Z, bier)];
/* Was eine Menge braucht und was fehlt: [{sorte, n, frei}] für alle Posten mit n > frei. */
const zuWenig = (Z, wer, posten) => posten.map(p => ({ ...p, frei: frei(Z, wer, p.sorte), hat: hat(Z, wer, p.sorte), res: reserviertBei(Z, wer, p.sorte) })).filter(p => p.n > p.frei);
/* Name mit Braudatum in Klammern (vom Nutzer, Fassung r): „NEIPA (28.07.2026)“. Neue Biere tragen das Datum schon im
   Namen; ältere bekommen es nur angezeigt. Namen, die schon ein Datum oder „MM/JJJJ“ enthalten, bleiben wie sie sind. */
let BRAUDATEN = new Map();
const hatDatum = n => /\(\d{1,2}\.\d{1,2}\.\d{4}\)|\d{2}\/\d{4}/.test(n);
// Angezeigt wird immer das aktuelle Braudatum: steht schon ein (älteres) Datum im Namen, wird es in der Anzeige
// ersetzt — der Name selbst (Schlüssel des Bestands) bleibt unverändert. „MM/JJJJ“-Namen (alter Import) bleiben.
const bierText = name => {
  const d = BRAUDATEN.get(name);
  if (!d || /\d{2}\/\d{4}/.test(name)) return name;
  return `${name.replace(/ \(\d{1,2}\.\d{1,2}\.\d{4}\)$/, "")} (${datumLang(d)})`;
};
const datumLang = d => { const [j, m, t] = d.split("-"); return `${t}.${m}.${j}`; };
const artikelText = key => istFass(key) ? `${bierText(zerlege(key).bier)} (Fass ${zerlege(key).l} l)` : bierText(key);
const postenText = posten => posten.map(p => `${p.n} × ${artikelText(p.sorte)}`).join(", ");

function beschreibe(e, Z) {
  switch (e.art) {
    case "abfuellung": return e.vorher != null ? `🍺 Ofgefëllt geännert: ${artikelText(e.sorte)} ${e.vorher} → ${e.n}` : `🍺 ${e.n} × ${artikelText(e.sorte)} ofgefëllt (an d'Lager)`;
    case "bewegung": return `➡️ ${e.n} × ${artikelText(e.sorte)}: ${e.von} → ${e.an}`;
    case "abgang": return `🗑️ ${e.n} × ${artikelText(e.sorte)} ${beim(e.wer)}: ${GRUENDE[e.grund]}`;
    case "verkauf": return `${e.alt ? "📜 Al Tabell:" : e.liv ? "🚚 Geliwwert" : "💶"} ${e.verkaeufer} → ${((Z && Z.vkNachId && Z.vkNachId.get(e.id)) || e).kaeufer}: ${postenText(e.posten)} · ${euro(e.betrag)}`;
    case "zahlung": {
      if (e.vor) { const L = Z && ((Z.livraisons || []).find(x => x.lid === e.ref) || Z.nachId.get(e.ref));
        return `💶 Virauszuelung ${euro(e.betrag)}${e.wie ? " per " + ZAHLARTEN[e.wie] : ""}` + (L ? `: ${L.kunde}` : ""); }
      const v = Z && Z.nachId.get(e.ref);
      return `✓ ${euro(e.betrag)} bezuelt${e.wie ? " per " + ZAHLARTEN[e.wie] : ""}` + (v ? `: ${v.kaeufer} (${beim(v.verkaeufer)})` : "");
    }
    case "livraison": return `🚚 Bestellung geplangt: ${((Z && Z.livraisons && Z.livraisons.find(L => L.id === e.id)) || e).kunde}, ${postenText(e.posten)}, ${datumKurz(e.datum)} · ${euro(e.betrag)}`;
    case "rechnung": {
      const v = Z && Z.nachId.get(e.ref);
      return "🧾 Rechnung gemaach" + (v ? `: ${v.kaeufer}` : "");
    }
    case "bier": return `🍺 Béier: ${e.name}` + [e.stil, e.alk != null ? String(e.alk).replace(".", ",") + " %" : "", euro(e.preis), e.braudatum ? "gebraut " + datumKurz(e.braudatum) : ""].filter(Boolean).map(x => " · " + x).join("");
    case "bierstatus": return { archiv: "📦 Archivéiert: ", aktiv: "↩️ Aus dem Archiv zréck: ", weg: "✕ Béier geläscht: " }[e.status] + bierText(e.name);
    case "termin": return e.weg ? `📅 Termin geläscht` : `📅 ${(TERMIN_ARTEN[e.typ] || {}).ic || ""} ${e.titel}${e.bier ? " · " + e.bier : ""}, ${datumKurz(e.datum)}${e.uhr ? " " + e.uhr : ""}`;
    case "aufgabe": return e.weg ? `✅ Aufgab geläscht` : e.erledigt ? `☑️ Ofgehaakt: ${e.auto ? "💡 " : ""}${e.text}` : e.erledigt === false ? `↩️ Erëm op: ${e.text}`
      : `✅ Aufgab: ${e.text} · fir ${e.fuer.join(", ")}${e.bis ? " · bis " + datumKurz(e.bis) : ""}`;
    case "aufhak": { const a = Z && Z.aufgaben && Z.aufgaben.find(x => x.aid === e.aid); const t = a ? a.text : "Aufgab";
      return e.an === false ? `↩️ ${e.durch}: erëm op — ${t}` : `☑️ ${e.durch} huet ofgehaakt: ${t}`; }
    case "kunde": return e.weg ? `📇 Client geläscht` : `📇 Client: ${e.v ? kundeLabel(e) : e.name}${e.ort ? " · " + e.ort : ""}`;
    case "datei": return `📎 ${FELDER[e.feld]}${e.bier ? " · " + e.bier : ""}: ${e.name}`;
    case "einstellungen": return `⚙️ Zorten/Präisser/Leit geännert: ${e.sorten.filter(s => !s.aus).map(s => `${s.name} ${euro(s.preis)}`).join(", ")}`;
    case "storno": {
      const z = Z && Z.nachId.get(e.ref);
      return "✕ Geläscht: " + (z ? beschreibe(z, Z) : "?");
    }
  }
  return "?";
}

/* Teilbetrag auf die ältesten offenen Verkäufe verteilen. */
function verteile(verkaeufe, betrag) {
  const out = [];
  let rest = runde(betrag);
  for (const v of [...verkaeufe].sort(ordnung)) {
    if (rest <= 0) break;
    if (v.offen <= 0) continue;
    const b = runde(Math.min(rest, v.offen));
    out.push({ art: "zahlung", ref: v.id, betrag: b });
    rest = runde(rest - b);
  }
  return { zahlungen: out, rest };
}

function erinnerung(K) {
  const offene = K.verkaeufe.filter(v => v.offen > 0);
  const posten = {};
  for (const v of offene) for (const p of v.posten) posten[p.sorte] = (posten[p.sorte] || 0) + p.n;
  const was = Object.entries(posten).map(([s, n]) => `${n}x ${s}`).join(", ");
  return `Moien ${K.name}, vir den Millebéier (${was}) stinn nach ${euro(K.offen)} op. Merci & Prost! 🍺`;
}

function csv(Z, zeitText) {
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  const zeilen = [["Datum", "Verkeefer", "Keefer", ...Z.sortenNamen, "Fläschen", "Betrag", "Bezuelt", "Op"].map(q).join(";")];
  for (const v of [...Z.verkaeufe].sort(ordnung)) {
    const n = Z.sortenNamen.map(s => v.posten.filter(p => p.sorte === s).reduce((a, p) => a + p.n, 0));
    zeilen.push([zeitText(v.zeit), v.verkaeufer, v.kaeufer, ...n, v.flaschen,
      String(v.betrag).replace(".", ","), String(v.bezahlt).replace(".", ","), String(v.offen).replace(".", ",")].map(q).join(";"));
  }
  return "﻿" + zeilen.join("\r\n") + "\r\n";
}

const datumKurz = d => { const [j, m, t] = d.split("-"); return `${+t}.${+m}.${j}`; };

/* Dateien eines Biers (bier "" = allgemein): je festes Feld die neueste, „anner“ alle (neueste zuerst). */
function dateienVon(Z, bier) {
  const d = Z.dateien.filter(x => x.bier === bier);
  const out = { anner: d.filter(x => x.feld === "anner").reverse() };
  for (const f of ["etikett", "rezept", "protokoll"]) out[f] = d.filter(x => x.feld === f).pop() || null;
  out.anzahl = ["etikett", "rezept", "protokoll"].filter(f => out[f]).length + out.anner.length;
  return out;
}
const groesseText = b => b < 1024 * 1024 ? Math.max(1, Math.round(b / 1024)) + " KB" : (b / 1048576).toFixed(1).replace(".", ",") + " MB";

/* Client: in der Liste steht die Firma, sonst „Name Vorname“ (vom Nutzer). Auf der Rechnung: Firma, darunter
   „À l'attention de Vorname Name“ (Kontaktperson), sonst nur „Vorname Name“; dann Adresse. */
const kundeLabel = K => (K.firma || "").trim() || [K.name, K.vorname].map(x => (x || "").trim()).filter(Boolean).join(" ");
const kundePerson = K => [K.vorname, K.name].map(x => (x || "").trim()).filter(Boolean).join(" ");
function rechnungsAdresse(K) {
  const z = [];
  if (K.firma) { z.push(K.firma); if (kundePerson(K)) z.push("À l'attention de " + kundePerson(K)); }
  else if (kundePerson(K)) z.push(kundePerson(K));
  for (const t of String(K.adresse || "").split("\n")) if (t.trim()) z.push(t.trim());
  if (K.ort) z.push(K.ort);
  return z;
}
// Namen, unter denen ein Client beim Verkaufen auftauchen kann (Label, Firma, „Vorname Name“, „Name Vorname“)
const kundeNamen = K => [K.label, K.firma, kundePerson(K), [K.name, K.vorname].filter(Boolean).join(" "), ...(K.alias || [])]
  .filter(Boolean).map(n => String(n).trim().toLowerCase());
/* Alles, was ein Client gekauft hat (ab jetzt, ohne die alten Excel-Verkäufe): Verkäufe (auch gelieferte Bestellungen)
   und noch geplante Bestellungen, neueste zuerst. Zugeordnet über kid oder den Namen. */
function kaeufeVon(Z, K) {
  const namen = new Set(kundeNamen(K));
  const passt = (kid, name) => kid === K.kid || namen.has(String(name || "").trim().toLowerCase());
  const z = [];
  for (const v of Z.verkaeufe) if (passt(v.kid || (v.livraison && v.livraison.kid), v.kaeufer))
    z.push({ datum: v.livraison ? v.livraison.datum : null, zeit: v.zeit, posten: v.posten, betrag: v.betrag, offen: v.offen, wie: wieListe(v), bezahlt: v.bezahlt, geplant: false, liv: !!v.livraison });
  for (const L of Z.livraisons) if (!L.verkauf && passt(L.kid, L.kunde))
    z.push({ datum: L.datum, zeit: L.zeit, posten: L.posten, betrag: L.betrag, geplant: true, liv: true });
  const t = r => r.datum ? Date.parse(r.datum) : r.zeit;
  return z.sort((a, b) => t(b) - t(a));
}

/* Vorschläge beim Tippen eines Namens: Stammclienten zuerst, dann frühere Käufer (ohne Stammclienten).
   Treffer, wenn ein Wort des Namens mit dem Getippten anfängt (Groß/klein egal). */
function kundenSuche(Z, q, max = 5) {
  const t = String(q || "").trim().toLowerCase();
  if (!t) return { stamm: [], frueher: [] };
  const passt = n => n.toLowerCase().startsWith(t) || n.toLowerCase().split(/[\s\-–]+/).some(w => w.startsWith(t));
  const stamm = Z.kunden.filter(k => kundeNamen(k).some(passt)).slice(0, max);
  const namen = new Set(Z.kunden.flatMap(kundeNamen));
  // Frühere Käufer UND Kunden geplanter Bestellungen (vom Nutzer gemeldet, Fassung g: „Reimen David“ aus einer
  // noch nicht gelieferten Bestellung kam beim Tippen nicht). Gleiche Schreibweise ohne Groß/klein nur einmal.
  const alle = new Map();
  for (const n of [...Z.kaeufer.map(k => k.name), ...Z.livraisons.map(L => L.kunde)]) {
    const k = String(n || "").trim(); if (k && !alle.has(k.toLowerCase())) alle.set(k.toLowerCase(), k);
  }
  const frueher = [...alle.values()].filter(n => passt(n) && !namen.has(n.toLowerCase())).slice(0, Math.max(0, max - stamm.length));
  return { stamm, frueher };
}
/* Gespeicherte Aufteilung (kf) eines früheren Käufers: aus dem neuesten Verkauf / der neuesten Bestellung mit diesem Namen
   (Fassung j, vom Nutzer). Ohne kf → null, dann kommt der Text unverändert in ein Feld (nichts raten). */
function kfVon(Z, name) {
  const n = String(name || "").trim().toLowerCase();
  let best = null;
  for (const e of [...Z.verkaeufe, ...Z.livraisons]) {
    const t = String(e.kaeuferText || e.kundeText || e.kaeufer || e.kunde || "").trim().toLowerCase();
    if (e.kf && t === n && (!best || e.zeit > best.zeit)) best = e;
  }
  return best ? best.kf : null;
}
const stammVon = (Z, name) => { const n = String(name || "").trim().toLowerCase(); return n ? Z.kunden.find(k => kundeNamen(k).includes(n)) || null : null; };

/* Anteil eines Postens am Betrag (gewichtet nach Listenpreis; ohne Preise nach Flaschen). */
function anteil(cfg, posten, betrag, p) {
  const w = x => x.n * preisVon(cfg, x.sorte);
  const summe = posten.reduce((a, x) => a + w(x), 0);
  if (summe > 0) return runde(betrag * w(p) / summe);
  const n = posten.reduce((a, x) => a + x.n, 0);
  return n ? runde(betrag * p.n / n) : 0;
}
// Zahlungsart eigens (vom Nutzer: in Iwwersiicht und Excel muss klar stehen, wie bezahlt wurde)
const wieListe = v => v && v.wie && v.wie.length ? v.wie.map(w => ZAHLARTEN[w]).join(", ") : "";
const bezahltText = v => v.offen <= 0 ? "Jo" : v.bezahlt > 0 ? `Deelweis (${euro(v.offen)} op)` : "Nee";

/* Alle Zeilen einer Sorte, wie ein Blatt in der alten Excel-Tabelle: wer hat was wem verkauft. */
function proSorte(Z, sorte) {
  // Ein Bier mit seinen Fässern; jede Zeile sagt, ob Flaschen oder Fass (geb).
  const keys = new Set(artikelVon(Z, sorte));
  const zeilen = [];
  for (const v of Z.verkaeufe) for (const p of v.posten) if (keys.has(p.sorte)) {
    const r = anteil(Z.cfg, v.posten, v.betrag, p);
    const L = v.livraison;
    zeilen.push({ geb: gebindeText(p.sorte), zeit: v.zeit, datum: L ? L.datum : null, kunde: v.kaeufer, kontakt: v.verkaeufer, n: p.n,
      preis: runde(r / p.n), recetten: r, geliwwert: "Jo", bezuelt: bezahltText(v), wie: wieListe(v) || (v.bezahlt > 0 ? "ouni Aart" : ""),
      rechnung: L && L.rechnung ? (v.rechnungGemacht ? "gemaach" : "nach ze maachen") : "",
      remarque: L ? [L.anlass, L.notiz].filter(Boolean).join(" · ") : "", id: v.id });
  }
  for (const v of Z.altVerkaeufe) for (const p of v.posten) if (keys.has(p.sorte)) {
    const r = anteil(Z.cfg, v.posten, v.betrag, p);
    zeilen.push({ geb: gebindeText(p.sorte), zeit: v.zeit, datum: v.datum || null, kunde: v.kaeufer, kontakt: v.verkaeufer, n: p.n, preis: runde(r / p.n), recetten: r,
      geliwwert: "Jo", bezuelt: "–", rechnung: "", remarque: v.notiz || "", id: v.id, alt: true });
  }
  for (const e of Z.aktiv) if (e.art === "abgang" && keys.has(e.sorte))
    zeilen.push({ geb: gebindeText(e.sorte), zeit: e.zeit, datum: e.datum || null, kunde: GRUENDE[e.grund], kontakt: e.wer, n: e.n, preis: 0, recetten: 0,
      geliwwert: "–", bezuelt: "–", rechnung: "", remarque: e.notiz || "", id: e.id, alt: e.durch === "Excel-Import" });
  for (const L of Z.livraisons) if (!L.verkauf) for (const p of L.posten) if (keys.has(p.sorte)) {
    const r = anteil(Z.cfg, L.posten, L.betrag, p);
    zeilen.push({ geb: gebindeText(p.sorte), zeit: L.zeit, datum: L.datum, kunde: L.kunde, kontakt: L.kontakt, n: p.n, preis: runde(r / p.n), recetten: r,
      geliwwert: "geplangt " + datumKurz(L.datum), bezuelt: "–", rechnung: L.rechnung ? "nach ze maachen" : "",
      remarque: [L.anlass, L.notiz].filter(Boolean).join(" · "), id: L.id, geplant: true });
  }
  return zeilen.sort((a, b) => (a.datum ? Date.parse(a.datum) : a.zeit) - (b.datum ? Date.parse(b.datum) : b.zeit));
}

/* Tabellen für den Excel-Export: je Sorte ein Blatt wie bisher, dazu Livraisons und Stock.
   Reine Daten (Zeilen als Arrays), damit der Test ohne Excel-Bibliothek prüfen kann. */
function exportBlaetter(Z, zeitFmt, heute = tagVon(Date.now())) {
  const blaetter = [];
  const kopf = ["Datum", "Client", "Kontakt", "Unzuel", "Gebinde", "Präis", "Recetten", "geliwwert?", "bezuel?", "bezuelt per", "Rechnung", "Remarquen"];
  for (const s of Z.sortenNamen) {
    const z = proSorte(Z, s), x = Z.sorten[s];
    if (!z.length && !x.abgefuellt && !x.da && !(Z.cfg.sorten.find(y => y.name === s) || {}).meta) continue;
    const zeilen = z.map(r => [r.datum ? datumKurz(r.datum) : r.alt ? "" : zeitFmt(r.zeit), r.kunde, r.kontakt, r.n, r.geb, r.preis, r.recetten, r.geliwwert, r.bezuelt, r.wie || "", r.rechnung, r.remarque]);
    const fest = z.filter(r => !r.geplant), festFl = fest.filter(r => r.geb === "Fläsch");
    const c = Z.cfg.sorten.find(y => y.name === s) || {}, m = c.meta || {};
    blaetter.push({ name: bierText(s), titel: bierText(s), info: [
      [m.stil, m.braudatum ? `Braugang vum ${datumKurz(m.braudatum)}` : "", m.alk != null ? `Alk: ${String(m.alk).replace(".", ",")} %` : "",
        m.liter != null ? `Quantitéit: ${String(m.liter).replace(".", ",")} L` : "", m.mhd ? `Haltbar bis ${datumKurz(m.mhd)}` : "", c.archiv ? "ARCHIVÉIERT" : ""].filter(Boolean).join(" · "),
      `Fläschen — ofgefëllt: ${x.abgefuellt} · verkaaft: ${x.verkauft} · fort: ${x.abgang} · nach do: ${x.da}`,
      ...fassNamen(Z, s).map(k => { const y = Z.sorten[k]; return `${gebindeText(k)} — ofgefëllt: ${y.abgefuellt} · verkaaft: ${y.verkauft} · fort: ${y.abgang} · nach do: ${y.da}`; }),
      `Verkafspräis: ${euro(preisVon(Z.cfg, s))} pro Fläsch` + fassNamen(Z, s).map(k => ` · ${euro(preisVon(Z.cfg, k))} pro ${gebindeText(k)}`).join(""), m.notiz || ""].filter(Boolean),
      kopf, zeilen,
      summe: ["Total", "", "", festFl.reduce((a, r) => a + r.n, 0), "Fläschen", "", runde(fest.reduce((a, r) => a + r.recetten, 0)), "", "", "", "", "Recetten mat Fässer, ouni geplangten"] });
  }
  blaetter.push({ name: "Bestellungen", titel: "Bestellungen", info: [],
    kopf: ["Datum", "Client", "Kontakt", "Wat", "Betrag", "Anlass", "geliwwert?", "Rechnung", "bezuel?", "bezuelt per", "Remarquen"],
    zeilen: Z.livraisons.map(L => [datumKurz(L.datum), L.kunde, L.kontakt, postenText(L.posten), L.betrag, L.anlass || "",
      L.verkauf ? "Jo" : "geplangt", L.rechnung ? (L.verkauf && L.verkauf.rechnungGemacht ? "gemaach" : "nach ze maachen") : "",
      L.verkauf ? bezahltText(L.verkauf) : L.vorbezahlt ? (L.vorbezahlt >= L.betrag ? "Jo (am Viraus)" : `Acompte ${euro(L.vorbezahlt)}`) : "–",
      L.verkauf ? wieListe(L.verkauf) : L.vorWie.map(w => ZAHLARTEN[w]).join(", "), L.notiz || ""]), summe: null });
  // Clienten mit allen Daten und ihren Käufen ab jetzt (vom Nutzer, Fassung f)
  blaetter.push({ name: "Clienten", titel: "Clienten", info: [],
    kopf: ["Firma", "Numm", "Virnumm", "Adress", "Uertschaft", "Telefon", "E-Mail", "Remarque", "Akeef", "Total", "dovun op", "geplangt", "Leschten Akaf"],
    zeilen: Z.kunden.map(K => {
      const k = kaeufeVon(Z, K), fest = k.filter(r => !r.geplant), geplant = k.filter(r => r.geplant);
      const letzt = fest[0];
      return [K.firma || "", K.name || "", K.vorname || "", String(K.adresse || "").replace(/\n+/g, ", "), K.ort || "", K.tel || "", K.mail || "", K.notiz || "",
        k.length, runde(fest.reduce((a, r) => a + r.betrag, 0)), runde(fest.reduce((a, r) => a + (r.offen || 0), 0)),
        runde(geplant.reduce((a, r) => a + r.betrag, 0)), letzt ? (letzt.datum ? datumKurz(letzt.datum) : zeitFmt(letzt.zeit)) : ""];
    }), summe: null });
  // Aufgaben (vom Nutzer, 17.11.2026): eigene (offen und erledigt) und die offenen der App
  const AS = aufgabenStand(Z, heute, Date.now());
  const bezug = a => { if (!a.ref) return ""; if (a.ref.typ === "liv") { const L = Z.livraisons.find(x => x.lid === a.ref.id); return L ? `Bestellung ${L.kunde} ${datumKurz(L.datum)}` : ""; }
    const t = Z.termine.find(x => x.tid === a.ref.id); return t ? `${t.titel}${t.bier ? " · " + t.bier : ""} ${datumKurz(t.datum)}` : ""; };
  const alleK = Z.sortenNamen.flatMap(s => artikelVon(Z, s));
  blaetter.push({ name: "Stock", titel: "Stock", info: ["Total = Fläschen; Fässer an hiren eegene Kolonnen."], kopf: ["", ...alleK.map(artikelText), "Total Fl."],
    zeilen: Z.halter.map(h => [h, ...alleK.map(k => hat(Z, h, k)), Z.sortenNamen.reduce((a, s) => a + hat(Z, h, s), 0)]),
    summe: ["Total", ...alleK.map(k => Z.sorten[k].da), Z.flaschen.da] });
  blaetter.push({ name: "Ze maachen", titel: "Ze maachen", info: ["💡 = Virschlag vun der App"],
    kopf: ["Aufgab", "Fir", "Bis", "Status", "Erleedegt vum", "Erleedegt den", "Ugeluecht vum", "Ugeluecht den", "Bezuch"],
    zeilen: [...AS.op.map(a => [(a.auto ? "💡 " : "") + a.text, a.fuer.join(", ") + (a.jeder ? " (jidderee)" : ""), a.bis ? datumKurz(a.bis) : "",
      a.jeder ? `op (${a.gemacht.length} vu ${a.noetig.length})` : "op", a.jeder ? a.gemacht.map(g => g.wer).join(", ") : "", "", a.auto ? "App" : a.erstDurch || "", a.auto ? "" : zeitFmt(a.erstZeit), bezug(a)]),
      ...Z.aufgaben.filter(a => a.erledigt).map(a => [(a.auto ? "💡 " : "") + a.text, a.fuer.join(", "), a.bis ? datumKurz(a.bis) : "", "erleedegt", a.jeder ? a.gemacht.map(g => g.wer).join(", ") : a.durch || "", zeitFmt(a.zeit), a.auto ? "App" : a.erstDurch || "", a.auto ? "" : zeitFmt(a.erstZeit), bezug(a)])],
    summe: null });
  return blaetter;
}

/* Reserviert anzeigen (vom Nutzer, 16.11.2026, Fassung h, Variante A): groß steht, was noch FREI ist, darunter klein gelb
   „🚚 n“ = für geplante Bestellungen reserviert. Gilt in Stock, Iwwersiicht/Pro Zort und Pro Persoun. */
// Spaltenkopf schmal: Name, darunter klein das Datum („NEIPA“ / „28.07.26“) — sonst passt die Stock-Tabelle nicht aufs Handy (Fassung i)
function kopfZweizeilig(t) {
  const m = String(t).match(/^(.*?)\s*\((\d{2})\.(\d{2})\.\d{2}(\d{2})\)$/) || String(t).match(/^(.*?)\s+(\d{2})\/\d{2}(\d{2})$/);
  if (!m) return esc(t);
  return m.length === 5 ? `${esc(m[1])}<br><small>${m[2]}.${m[3]}.${m[4]}</small>` : `${esc(m[1])}<br><small>${m[2]}/${m[3]}</small>`;
}
const resAlle = k => Z.halter.reduce((a, h) => a + reserviertBei(Z, h, k), 0);
const resZeile = (r, fass) => r ? `<span class="rz">🚚 ${r}${fass ? ` + ${fass} F.` : ""}</span>` : fass ? `<span class="rz">🚚 ${fass} F.</span>` : "";
function mengeText(h) {
  const fl = Z.sortenNamen.reduce((a, s) => a + hat(Z, h, s), 0);
  const fassK = Z.sortenNamen.flatMap(s => fassNamen(Z, s));
  const fa = fassK.reduce((a, k) => a + hat(Z, h, k), 0);
  const rFl = Z.sortenNamen.reduce((a, s) => a + reserviertBei(Z, h, s), 0), rFa = fassK.reduce((a, k) => a + reserviertBei(Z, h, k), 0);
  const frei = fl - rFl, freiFa = fa - rFa;
  return `${frei < 0 ? `<span style="color:var(--rot)">${frei}</span>` : frei}${fa ? ` <small class="muted">+ ${freiFa} F.</small>` : ""}${resZeile(rFl, rFa)}`;
}

const SHEETJS = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
function sheetjsLaden() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((ok, nok) => {
    const sc = document.createElement("script");
    sc.src = SHEETJS; sc.onload = () => ok(window.XLSX); sc.onerror = () => nok(new Error("Excel-Bibliothéik net geluede (Internet?)"));
    document.head.appendChild(sc);
  });
}
async function excelExport(meldBox) {
  const meld = (art, t) => { if (meldBox) meldBox.innerHTML = `<div class="meldung ${art}">${esc(t)}</div>`; };
  try {
    meld("ok", "Excel gëtt gemaach…");
    const X = await sheetjsLaden();
    const wb = X.utils.book_new();
    const heute = new Date().toLocaleDateString("de-DE", { timeZone: TZ });
    for (const b of exportBlaetter(Z, t => new Date(t).toLocaleDateString("de-DE", { timeZone: TZ }))) {
      const aoa = [[`MILLEBÉIER – ${b.titel.toUpperCase()}`], [`Stand: ${heute}`], ...b.info.map(i => [i]), [], b.kopf, ...b.zeilen];
      if (b.summe) aoa.push([], b.summe);
      const ws = X.utils.aoa_to_sheet(aoa);
      ws["!cols"] = b.kopf.map((k, i) => ({ wch: k === "Client" || k === "Remarquen" ? 28 : k === "Wat" ? 30 : k === "bezuelt per" ? 14 : 12 }));
      ws["!merges"] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: Math.max(3, b.kopf.length - 1) } }];
      // Euro-Format für Geldspalten
      const kopfZeile = 3 + b.info.length;
      b.kopf.forEach((k, c) => {
        if (!/Präis|Recetten|Betrag/.test(k)) return;
        for (let r = kopfZeile + 1; r < aoa.length; r++) { const z = ws[X.utils.encode_cell({ r, c })]; if (z && z.t === "n") z.z = '#,##0.00 "€"'; }
      });
      // Blattnamen: max. 31 Zeichen, keine Sonderzeichen, und nie doppelt (Excel lehnt das ab)
      let blatt = b.name.replace(/[\\/?*\[\]:]/g, " ").slice(0, 31), nr = 2;
      while (wb.SheetNames.some(n => n.toLowerCase() === blatt.toLowerCase())) blatt = (b.name.replace(/[\\/?*\[\]:]/g, " ").slice(0, 26) + ` (${nr++})`);
      X.utils.book_append_sheet(wb, ws, blatt);
    }
    const daten = X.write(wb, { bookType: "xlsx", type: "array" });
    const name = `Millebeier-${new Date().toISOString().slice(0, 10)}.xlsx`;
    const datei = new File([daten], name, { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    meld("ok", "✓ " + name);
    try { if (navigator.canShare && navigator.canShare({ files: [datei] })) { await navigator.share({ files: [datei] }); return; } }
    catch (f) { if (f && f.name === "AbortError") return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(datei); a.download = name; a.click();
  } catch (f) { meld("fehler", f.message || "Excel-Export huet net geklappt."); }
}

/* ---------- Clienten (vom Nutzer, 15.11.2026, Fassung e) ----------
   Eigener Reiter „Client“ (statt Verlaf, der ins Zahnrad gewandert ist). Liste alphabetisch, je Client nur der Name
   (Firma, sonst „Name Vorname“) mit rotem ▶; aufgeklappt: Kontaktdaten und ▶ Akeef (alles ab jetzt). Beim Tippen eines
   Namens (Verkafen, Bestellung) erscheinen Clienten als Knöpfe darunter — bewusst kein Ausklappmenü. */
let KFORM = null;
const telLink = t => `tel:${String(t).replace(/[^\d+]/g, "")}`;
function kontaktHtml(K) {
  const z = [];
  if (K.firma && kundePerson(K)) z.push(`👤 ${esc(kundePerson(K))}`);
  for (const t of String(K.adresse || "").split("\n")) if (t.trim()) z.push(esc(t.trim()));
  if (K.ort) z.push(esc(K.ort));
  if (K.tel) z.push(`📞 <a href="${esc(telLink(K.tel))}">${esc(K.tel)}</a>`);
  if (K.mail) z.push(`✉️ <a href="mailto:${esc(K.mail)}">${esc(K.mail)}</a>`);
  if (K.notiz) z.push(`<span class="muted">${esc(K.notiz)}</span>`);
  return z.join("<br>");
}
const kundeInfoHtml = K => K ? `📇 <b>${esc(K.label)}</b>${kontaktHtml(K) ? "<br>" + kontaktHtml(K) : ""}` : "";
const leererKunde = () => ({ kid: null, firma: "", name: "", vorname: "", adresse: "", ort: "", tel: "", mail: "", notiz: "" });

   Vorschläge (Clienten 📇, frühere Käufer) als Knöpfe. Ist es kein Client, Haken „+ Neie Client“: dann Telefon, E-Mail,
   Adresse (freiwillig) und beim Speichern ein Eintrag `kunde`. Nichts wird geraten: ein früherer Käufer kommt unverändert
   in das Feld, in dem getippt wurde; aufteilen tut man selbst. Sein alter Name bleibt als `alias` am neuen Client. */
const leererKaeufer = () => ({ firma: "", name: "", vorname: "", tel: "", mail: "", adresse: "", ort: "", neu: false, kid: null, vorher: "" });
const kaeuferVon = (Z, k) => { const K = k.kid && Z.kunden.find(x => x.kid === k.kid); return K || stammVon(Z, kundeLabel(k)); };

    <div class="vorschlaege" id="${p}Vorschlag"></div><div class="kundeinfo" id="${p}KundeInfo"></div><div id="${p}NeuBox"></div>`;
}

  const box = $("#" + p + "Vorschlag"), info = $("#" + p + "KundeInfo"), neuBox = $("#" + p + "NeuBox");

    if (s2 === "" || s2 === "k") { neuBox.innerHTML = ""; return; }
    const g = (id, feld, lbl, attr = "", tag = "input") => `<label for="${p}${id}">${lbl}</label>${tag === "textarea"
      ? `<textarea id="${p}${id}" data-kx="${feld}" class="adr">${esc(k[feld])}</textarea>` : `<input id="${p}${id}" data-kx="${feld}" ${attr} value="${esc(k[feld])}">`}`;

        ${g("Mail", "mail", "E-Mail (fräiwëlleg)", 'type="email" inputmode="email" autocapitalize="off" autocorrect="off"')}
        ${g("Adr", "adresse", "Strooss an Nummer (fräiwëlleg)", "", "textarea")}

    neuBox.querySelectorAll("[data-kx]").forEach(el => el.oninput = () => { k[el.dataset.kx] = el.value; });

  const vorschlag = q => {
    const { stamm, frueher } = kundenSuche(Z, q);

    box.innerHTML = (K && !frueher.length && stamm.length <= 1) ? "" :
      stamm.map(x => `<button class="stamm" data-kid="${esc(x.kid)}">📇 ${esc(x.label)}</button>`).join("") +
      frueher.map(n => `<button data-name="${esc(n)}">${esc(n)}</button>`).join("");
  };
  let zuletzt = felder[0];
  felder.forEach(el => el.oninput = () => { zuletzt = el; k[el.dataset.kf] = el.value; k.kid = null; vorschlag(el.value); zustand(); });
  box.onclick = ev => {
    const b = ev.target.closest("button"); if (!b) return;
    if (b.dataset.kid) {
      const K = Z.kunden.find(x => x.kid === b.dataset.kid); if (!K) return;
      Object.assign(k, { firma: K.firma || "", name: K.name || "", vorname: K.vorname || "", kid: K.kid, neu: false, vorher: "" });

      const kf = kfVon(Z, b.dataset.name);

/* Beim Speichern: Name (+ kid) für Verkauf/Bestellung, dazu ggf. der neue Client. */
function kaeuferErgebnis(Z, k) {
  const sauber = t => String(t || "").trim().replace(/\s+/g, " ");
  const label = kundeLabel({ firma: sauber(k.firma), name: sauber(k.name), vorname: sauber(k.vorname) });
  if (!label) return { fehler: "Un wien? Firma, Numm oder Virnumm aginn." };
  const K = kaeuferVon(Z, k);
  if (K) return { name: K.label, kid: K.kid, eintraege: [] };
  if (!k.neu) {
    // gleiche Schreibweise → bekannten nehmen (auch aus geplanten Bestellungen)
    const bekannt = [...Z.kaeufer.map(x => x.name), ...Z.livraisons.map(L => L.kunde)].find(n => String(n).toLowerCase() === label.toLowerCase());
    // Wer kein Client ist, behält trotzdem, was in welchem Feld stand (`kf`), sonst stünde beim Ändern einer Bestellung
    // wieder alles in „Numm“ (vom Nutzer gemeldet, Fassung h: „Reimen“ / „David“ kam als „Reimen David“ in Numm zurück).
    const kf = {}; for (const x of ["firma", "name", "vorname"]) if (sauber(k[x])) kf[x] = sauber(k[x]);
    return { name: bekannt || label, kid: null, kf, eintraege: [] };
  }
  const mail = sauber(k.mail);
  if (mail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)) return { fehler: "D'E-Mail-Adress gesäit net richteg aus." };
  const vorher = sauber(k.vorher);
  const e = { art: "kunde", v: 2, kid: "k-" + neueId().replace(/[^A-Za-z0-9-]/g, "").slice(0, 40),
    firma: sauber(k.firma), name: sauber(k.name), vorname: sauber(k.vorname), adresse: String(k.adresse || "").trim(), ort: sauber(k.ort),
    tel: sauber(k.tel), mail, notiz: "", ...(vorher && vorher.toLowerCase() !== label.toLowerCase() ? { alias: [vorher] } : {}) };
  if (!gueltig({ ...e, id: "x", zeit: 0 })) return { fehler: "Eppes beim Client ass ze laang." };
  return { name: label, kid: e.kid, eintraege: [e] };
}

      tel: sauber(F.tel), mail: sauber(F.mail), notiz: sauber(F.notiz) };
    if (!e.firma && !e.name && !e.vorname) return meld("Firma, Numm oder Virnumm aginn.");

/* ---------- Kalender (vom Nutzer, 16.11.2026) ----------
   📅 oben neben dem Zahnrad. Gemeinsame Termine (Eintrag `termin`, je tid gilt der neueste, weg = gelöscht) und – nur in der
   App, nicht im Abo – die geplanten Bestellungen. Abonnieren über den Worker (/kalender/<schlüssel>.ics), Schlüssel aus dem Code. */
let KALFORM = null, KAL_SICHT = "kommend", KAL_SCHLUESSEL = "", KAL_MELD = "";
const KAL_AUF = new Set();
const KAL_FILTER = new Set(); // Arten (und "bestellung"); leer = alle (vom Nutzer, Fassung d)
// Afëllen mit der Bierflasche der App statt 🍾 (vom Nutzer, Fassung d); in Text (Verlauf, Abo) bleibt 🍾
const FLASCHE_SVG = `<svg class="tflasche" viewBox="0 0 24 48" aria-hidden="true"><rect x="9" y="1" width="6" height="3" rx="1" fill="#c9c9c9"/><path d="M9.5 4h5v8c0 2 1 3 2.5 5s3 4 3 7.5V44a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V24.5c0-3.5 1.5-5.5 3-7.5S9.5 14 9.5 12z" fill="#8a4b14"/><rect x="5" y="26" width="14" height="10" rx="1.5" fill="#f3ece2"/><rect x="7.5" y="29.5" width="9" height="3" rx="1" fill="#e3141b"/></svg>`;
const terminIc = typ => typ === "abfuellen" ? FLASCHE_SVG : typ === "bestellung" ? "🚚" : esc((TERMIN_ARTEN[typ] || TERMIN_ARTEN.aanescht).ic);
const heuteLux = () => new Date().toLocaleDateString("sv-SE", { timeZone: TZ });
const plusTage = (d, n) => { const x = new Date(d + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const KAL_MON = ["JAN", "FEB", "MÄE", "ABR", "MEE", "JUN", "JUL", "AUG", "SEP", "OKT", "NOV", "DEZ"];
const WOCHENTAG = ["So", "Mé", "Dë", "Më", "Do", "Fr", "Sa"];
const MONATE = ["Januar", "Februar", "Mäerz", "Abrëll", "Mee", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
async function kalenderSchluessel(code) {
  const h = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("millebeier-kalender:" + String(code).trim()));
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 32);
}
// Termine + geplante Bestellungen (die nur hier, nicht im abonnierten Kalender — vom Nutzer)
function kalenderPunkte(Z) {
  const p = Z.termine.map(t => ({ ...t, quelle: "termin" }));
  for (const L of Z.livraisons) if (!L.verkauf) p.push({ quelle: "bestellung", tid: "liv-" + L.id, datum: L.datum, titel: "Bestellung " + L.kunde, liv: L });
  return p.sort((a, b) => a.datum.localeCompare(b.datum) || (a.uhr || "").localeCompare(b.uhr || ""));
}
function kalAnzahlBald(Z) {
  const h = heuteLux(), m = plusTage(h, 1);
  return kalenderPunkte(Z).filter(p => p.datum === h || p.datum === m).length;
}
function kalZeile(p, heute) {
  const morgen = plusTage(heute, 1), [j, mo, t] = p.datum.split("-").map(Number);
  const wt = WOCHENTAG[new Date(Date.UTC(j, mo - 1, t)).getUTCDay()];
  const auf = KAL_AUF.has(p.tid), vorbei = p.datum < heute;
  const ic = terminIc(p.quelle === "bestellung" ? "bestellung" : p.typ);
  const zeit = p.quelle === "bestellung" ? `${postenText(p.liv.posten)} · ${p.liv.kontakt}` :
    [p.uhr ? p.uhr + (p.bis ? "–" + p.bis : "") : "ganzen Dag", p.wou].filter(Boolean).join(" · ");
  const wer = p.quelle === "termin" && (p.wer || []).length ? (p.wer || []).map(w => `<span class="chip">${esc(w)}</span>`).join("") : "";
  return `<div class="ter ${vorbei ? "vorbei" : ""}" data-ter="${esc(p.tid)}">
    <div class="tdat ${p.datum === heute ? "haut" : ""}"><small>${p.datum === heute ? "Haut" : p.datum === morgen ? "Muer" : wt}</small><b>${t}</b></div>
    <div class="tinh"><b>${ic} ${esc(p.titel)}${p.bier ? " · " + esc(p.bier) : ""}</b><div class="z">${esc(zeit)}</div>
      ${wer}${p.quelle === "bestellung" ? `<span class="chip auto">aus de Bestellungen</span>` : ""}
      ${auf ? `${p.notiz ? `<div class="hinweis" style="margin:6px 0 0">${esc(p.notiz)}</div>` : ""}
        <div class="knopfe ${p.quelle === "termin" ? "einz t" : ""}" style="margin-top:8px">${p.quelle === "termin"
          ? `<button class="knopf" data-ted="${esc(p.tid)}">✎ Änneren</button><button class="knopf rot" data-tweg="${esc(p.tid)}">✕ Läschen</button><button class="knopf gelbk" data-tauf="${esc(p.tid)}">+ Aufgab</button>`
          : `<button class="knopf" data-tliv>→ Bei d'Bestellungen</button>`}</div>
        ${p.quelle === "termin" && A_INLINE && A_INLINE.wo === "termin:" + p.tid ? aufFormHtml(A_INLINE.F, `Nei Aufgab fir ${p.titel} ${tagKurz(p.datum)}`) : ""}` : ""}
    </div></div>`;
}

  const a = [...S.op, ...S.erl].find(x => x.aid === aid) || Z.aufgaben.find(x => x.aid === aid); if (!a || a.ohneHaken) return;
  if (a.jeder) { eintragen([{ art: "aufhak", aid, ...(erledigt ? {} : { an: false }) }]); return; } // nur mein eigener Haken
  eintragen([{ art: "aufgabe", aid, text: a.text, fuer: [...a.fuer], ...(a.bis ? { bis: a.bis } : {}), ...(a.ref ? { ref: { ...a.ref } } : {}), ...(a.auto ? { auto: true } : {}), erledigt }]);
}
function aufGehe(z) {

  if (typ === "sync") { SYNC_AUF = true; render(); window.scrollTo(0, 0); return; }
  if (typ === "termin") {
    const t = Z.termine.find(x => x.tid === id); if (!t) return;
    TAB = "kalender"; KAL_BEREICH = "kalender"; KALFORM = null; KAL_FILTER.clear(); KAL_AUF.add(id); if (t.datum < heuteLux()) KAL_SICHT = "alles";
    render(); const el = document.querySelector(`[data-ter="${CSS.escape(id)}"]`); if (el) el.scrollIntoView({ block: "center" }); return;
  }
  TAB = typ === "liv" ? "livraisons" : typ; EIN.tab = TAB; merke(SP, EIN);
  if (typ === "liv") L_NUR_MEINE = false;
  render(); window.scrollTo(0, 0);
  if (typ === "liv") { const el = document.querySelector(`[data-lid="${CSS.escape(id)}"]`); if (el) el.scrollIntoView({ block: "center" }); }
}
function aufListeBinden(root) {

function aufFormHtml(F, titel) {

function aufFormBinden(root, F, neuBauen, fertig, zu) {
  const q = k => root.querySelector(`[data-af="${k}"]`);
  const t = q("text"); t.oninput = () => { F.text = t.value; };
  t.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); speichern(); } };
  const bi = q("bis"); if (bi) bi.oninput = bi.onchange = () => { F.bis = bi.value; };
  q("bisauf").onclick = () => { F.bisAuf = !F.bisAuf; if (!F.bisAuf) F.bis = ""; if (document.activeElement) document.activeElement.blur(); neuBauen(); };
  root.querySelectorAll("[data-afuer]").forEach(b => b.onclick = () => {
    const p = b.dataset.afuer;
    if (p === "All") F.fuer = ["All"];
    else { F.fuer = F.fuer.filter(x => x !== "All"); F.fuer = F.fuer.includes(p) ? F.fuer.filter(x => x !== p) : [...F.fuer, p]; }
    if (!F.fuer.length) F.fuer = [EIN.ich];
    root.querySelectorAll("[data-afuer]").forEach(x => x.classList.toggle("an", F.fuer.includes(x.dataset.afuer)));
    root.querySelector(".ajed").classList.toggle("versteckt", !mehrere(F));
  });
  root.querySelectorAll("[data-ajed]").forEach(b => b.onclick = () => {
    F.jeder = b.dataset.ajed === "1"; root.querySelectorAll("[data-ajed]").forEach(x => x.classList.toggle("an", (x.dataset.ajed === "1") === F.jeder));
  });
  const z = q("zu"); if (z) z.onclick = zu;
  q("ok").onclick = speichern;
  function speichern() {
    const meld = m => { q("meld").innerHTML = `<div class="meldung fehler">${esc(m)}</div>`; };
    const text = String(F.text || "").trim().replace(/\s+/g, " ");
    if (!text) return meld("Wat ass ze maachen?");
    if (F.bisAuf && F.bis && !/^\d{4}-\d{2}-\d{2}$/.test(F.bis)) return meld("Datum stëmmt net.");
    const e = { art: "aufgabe", aid: "a-" + neueId().replace(/[^A-Za-z0-9-]/g, "").slice(0, 40), text, fuer: [...F.fuer],
      ...(F.bisAuf && F.bis ? { bis: F.bis } : {}), ...(F.ref ? { ref: { ...F.ref } } : {}), ...(F.jeder && mehrere(F) ? { jeder: true } : {}) };
    if (!gueltig({ ...e, id: "x", zeit: 0 })) return meld("Eppes ass ze laang oder net richteg.");
    if (document.activeElement) document.activeElement.blur();
    if (!eintragen([e]).length) return;
    fertig(text);
  }
}
function kalKaesten() {

}

  // „Huelen aus“: Vorgabe ist, wer einträgt (vom Nutzer, Fassung x); ändern nur über den Knopf „Änneren“
  return { k: leererKaeufer(), kontakt: EIN.ich, aus: EIN.ich, ausAendern: false, anlass: "", datum: morgen, n: {}, betrag: null, rechnung: true, notiz: "" };
}
const lArtikel = () => artikelListe(LFORM.aus, LFORM.n);
