    <button class="haupt" id="lOk">${F.ersetzt ? "Späicheren" : "Bestellung plangen"}</button>
    <button class="haupt" id="lZu" style="background:var(--card2);color:var(--text)">Ofbriechen</button>
    <div id="lMeld"></div></div>`;
  const bind = (id, k, ev = "oninput") => { const el = $(id); el[ev] = () => { F[k] = el.value; }; };
  bind("#lAnlass", "anlass"); bind("#lNotiz", "notiz");
  kaeuferBinden("l", F.k);
  $("#lDatum").onchange = $("#lDatum").oninput = e => { F.datum = e.target.value; };
  $("#lKontakt").onchange = e => { F.kontakt = e.target.value; };
  const la0 = $("#lAus"); if (la0) la0.onchange = e => { F.aus = e.target.value; e.target.blur(); renderLForm(true); };
  const lae = $("#lAusAendern"); if (lae) lae.onclick = () => { F.ausAendern = true; renderLForm(true); const sel = $("#lAus"); if (sel) sel.focus(); };
  $("#lRechnung").onchange = e => { F.rechnung = e.target.checked; };
  const betragNach = () => { const inp = $("#lBetrag"); if (F.betrag == null && document.activeElement !== inp) inp.value = lAuto() ? String(lAuto()).replace(".", ",") : ""; };
  const la = lArtikel();
  const setzeN = (i, n) => { const x = la[i]; F.n[x.key] = Math.max(0, Math.min(9999, n | 0)); const inp = $("#lN" + i); if (document.activeElement !== inp) inp.value = F.n[x.key] || ""; betragNach(); };
  box.querySelectorAll("[data-lplus]").forEach(b => b.onclick = () => setzeN(+b.dataset.lplus, (F.n[la[+b.dataset.lplus].key] || 0) + 1));
  box.querySelectorAll("[data-lminus]").forEach(b => b.onclick = () => setzeN(+b.dataset.lminus, (F.n[la[+b.dataset.lminus].key] || 0) - 1));
  box.querySelectorAll("[data-li]").forEach(inp => inp.oninput = () => setzeN(+inp.dataset.li, parseInt(inp.value, 10) || 0));
  $("#lBetrag").oninput = e => { const v = e.target.value.trim().replace(",", "."); F.betrag = v === "" ? null : (isFinite(+v) ? runde(+v) : F.betrag); };
  // Nach Ofbriechen/Späicheren ganz nach oben (vom Nutzer, Fassung l)
  $("#lZu").onclick = () => { L_NEU = false; LFORM = null; renderLForm(); window.scrollTo(0, 0); };
  $("#lOk").onclick = () => {
    const meld = t => $("#lMeld").innerHTML = `<div class="meldung fehler">${esc(t)}</div>`;
    const KE = kaeuferErgebnis(Z, F.k);
    const posten = la.filter(x => F.n[x.key] > 0).map(x => ({ sorte: x.key, n: F.n[x.key] }));
    if (KE.fehler) return meld(KE.fehler);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(F.datum)) return meld("Wéini? Datum feelt.");
    if (!posten.length) return meld("Wat gëtt geliwwert? Mindestens eng Fläsch.");
    const e = { art: "livraison", kunde: KE.name, ...(KE.kid ? { kid: KE.kid } : KE.kf ? { kf: KE.kf } : {}), kontakt: F.kontakt, aus: F.aus, datum: F.datum, posten,
      betrag: F.betrag != null ? F.betrag : lAuto(), rechnung: !!F.rechnung, anlass: F.anlass.trim(), notiz: F.notiz.trim(), ...(F.ersetzt ? { vorher: F.ersetzt } : {}) };
    if (!gueltig({ ...e, id: "x", zeit: 0 })) return meld("Eppes ass ze laang oder net richteg.");
    // Geplante Livraisons zählen schon (reserviert): reicht der freie Rest nicht, warnen (vom Nutzer, 14.11.2026).
    // Beim Ändern zählt die alte Fassung nicht gegen sich selbst.
    const Zp = F.ersetzt ? rechne([...SERVER, ...AUSGANG, { id: "pruef-storno", zeit: Date.now(), art: "storno", ref: F.ersetzt }]) : Z;
    const fehlt = zuWenig(Zp, F.aus, posten);
    if (fehlt.length && !confirm(`⚠️ Net genuch fräi:\n\n${fehltText(F.aus, fehlt)}\n\nTrotzdeem plangen?`)) return;
    if (document.activeElement) document.activeElement.blur();
    const alt = F.ersetzt && Z.livraisons.find(x => x.id === F.ersetzt);
    if (F.ersetzt && (!alt || alt.verkauf)) return meld("Dës Bestellung ass schonn geliwwert oder geläscht — net méi z'änneren.");
    const neu = eintragen([...KE.eintraege, ...(F.ersetzt ? [{ art: "storno", ref: F.ersetzt }] : []), e]);
    if (!neu.length) return;
    L_NEU = false; LFORM = { meldung: `✓ ${F.ersetzt ? "Geännert" : "Geplangt"}: ${e.kunde}, ${datumKurz(e.datum)}, ${postenText(posten)}` };
    renderLForm(); window.scrollTo(0, 0);
  };
}

/* ---------- Verkaufen ---------- */
function leeresFormular() {
  return { verkaeufer: EIN.ich, k: leererKaeufer(), n: {}, betrag: null, wie: null, meldung: FORM && FORM.meldung };
}
function vSorten() { return Z.cfg.sorten.filter(s => !s.aus); }
/* Was man verkaufen/liefern kann: je Bier die Flaschen, Fässer nur, wenn der Halter welche hat (oder schon gewählt). */
function artikelListe(wer, gewaehlt) {
  const fass = s => FAESSER.map(F => fassKey(s.name, F.l)).filter(k => hat(Z, wer, k) > 0 || (gewaehlt && gewaehlt[k] > 0))
    .map(k => ({ key: k, label: `${bierText(s.name)} · Fass ${zerlege(k).l} l`, preis: preisVon(Z.cfg, k), fass: true }));
  return [...vSorten().flatMap(s => [{ key: s.name, label: bierText(s.name), preis: s.preis }, ...fass(s)]),
    // Fässer archivierter Biere bleiben aktuell, solange jemand welche hat (vom Nutzer, Fassung n)
    ...Z.cfg.sorten.filter(s => s.archiv).flatMap(fass)];
}
const vArtikel = () => artikelListe(FORM.verkaeufer, FORM.n);
function vAutoBetrag() { return runde(vArtikel().reduce((a, x) => a + (FORM.n[x.key] || 0) * x.preis, 0)); }
function vFlaschen() { return vArtikel().filter(x => !x.fass).reduce((a, x) => a + (FORM.n[x.key] || 0), 0); }
const u0 = h => h === LAGER ? "vum Lager" : "vum " + h;
const zahlInhalt = k => `<img src="${ZAHLBILD[k]}" alt=""><span>${ZAHLARTEN[k]}</span>`;
function zahlKnoepfe(gewaehlt, mitSpaeter) {
  return `<div class="seg zahl">${Object.entries(ZAHLARTEN).map(([k, t]) => `<button data-bez="${k}" class="zbtn ${gewaehlt === k ? "an gruen" : ""}">${zahlInhalt(k)}</button>`).join("")}
    ${mitSpaeter ? `<button data-bez="spaeter" class="breit ${gewaehlt === "spaeter" ? "an gelb" : ""}">Bezillt méi spéit</button>` : ""}</div>`;
}
const fehltText = (wer, liste) => liste.map(p => `${p.n} × ${artikelText(p.sorte)}: ${de(wer)} huet ${p.hat}` + (p.res ? `, dovun ${p.res} reservéiert fir Bestellungen → fräi ${Math.max(0, p.frei)}` : "")).join("\n");

function renderVerkaufen(egal) {
  if (!FORM) FORM = leeresFormular();
  const box = $("#vForm");
  if (!egal && tipptIn(box)) { vHinweise(); return; }
  const leute = Z.cfg.leute.includes(FORM.verkaeufer) ? Z.cfg.leute : [...Z.cfg.leute, FORM.verkaeufer];
  const art = vArtikel();
  box.innerHTML = `<div class="card">
    <h2>Verkaf androen</h2>
    <label for="vVerk">Wien verkeeft?</label>
    <select id="vVerk">${leute.map(p => `<option ${p === FORM.verkaeufer ? "selected" : ""}>${esc(p)}</option>`).join("")}</select>
    <label for="vFirma">Un wien?</label>${kaeuferHtml("v", FORM.k)}
    <label>Wéi vill?</label>
    ${art.map((x, i) => `<div class="posten">
      <div class="pn"><b>${esc(x.label)}</b><small class="muted" id="vHat${i}"></small></div>
      <div class="stepper"><button data-minus="${i}" aria-label="manner">−</button>
        <input id="vN${i}" data-i="${i}" inputmode="numeric" pattern="[0-9]*" value="${FORM.n[x.key] || ""}" placeholder="0">
        <button data-plus="${i}" aria-label="méi">+</button></div></div>`).join("")}
    <label for="vBetrag">Betrag (€)</label>
    <div class="zeile"><input id="vBetrag" inputmode="decimal" value="${FORM.betrag != null ? String(FORM.betrag).replace(".", ",") : (vAutoBetrag() ? String(vAutoBetrag()).replace(".", ",") : "")}" placeholder="0">
      <small class="muted" id="vAuto" style="flex:1.4"></small></div>
    <label>Bezuelt?</label>
    ${zahlKnoepfe(FORM.wie, true)}
    <button class="haupt" id="vSpeichern">Verkaf androen</button>
    <div id="vMeldung">${FORM.meldung ? `<div class="meldung ${FORM.meldung.art}">${esc(FORM.meldung.text)}</div>` : ""}</div>
  </div>`;
  vHinweise();

  $("#vVerk").onchange = e => { FORM.verkaeufer = e.target.value; e.target.blur(); renderVerkaufen(true); };
  kaeuferBinden("v", FORM.k);
  const setzeN = (i, n) => {
    const x = art[i]; FORM.n[x.key] = Math.max(0, Math.min(9999, n | 0));
    const inp = $("#vN" + i); if (document.activeElement !== inp) inp.value = FORM.n[x.key] || "";
    vHinweise();
  };
  box.querySelectorAll("[data-plus]").forEach(b => b.onclick = () => setzeN(+b.dataset.plus, (FORM.n[art[+b.dataset.plus].key] || 0) + 1));
  box.querySelectorAll("[data-minus]").forEach(b => b.onclick = () => setzeN(+b.dataset.minus, (FORM.n[art[+b.dataset.minus].key] || 0) - 1));
  box.querySelectorAll("[data-i]").forEach(inp => inp.oninput = () => setzeN(+inp.dataset.i, parseInt(inp.value, 10) || 0));
  $("#vBetrag").oninput = e => {
    const v = e.target.value.trim().replace(",", ".");
    FORM.betrag = v === "" ? null : (isFinite(+v) ? runde(+v) : FORM.betrag);
    vHinweise();
  };
  box.querySelectorAll("[data-bez]").forEach(b => b.onclick = () => {
    FORM.wie = b.dataset.bez;
    box.querySelectorAll("[data-bez]").forEach(x => x.classList.remove("an", "gruen", "gelb"));
    b.classList.add("an", FORM.wie === "spaeter" ? "gelb" : "gruen");
  });
  $("#vSpeichern").onclick = vSpeichern;
}

function vHinweise() {
  vArtikel().forEach((x, i) => {
    const el = $("#vHat" + i); if (!el) return;
    const n = hat(Z, FORM.verkaeufer, x.key), r = reserviertBei(Z, FORM.verkaeufer, x.key);
    el.textContent = `${euro(x.preis)} · ${de(FORM.verkaeufer)} huet nach ${n}` + (r ? ` (${r} reservéiert)` : "");
    el.style.color = (FORM.n[x.key] || 0) > n - r ? "var(--gelb)" : "";
  });
  const auto = vAutoBetrag();
  const inp = $("#vBetrag");
  if (inp && FORM.betrag == null && document.activeElement !== inp) inp.value = auto ? String(auto).replace(".", ",") : "";
  const a = $("#vAuto");
  if (a) a.textContent = FORM.betrag != null && FORM.betrag !== auto
    ? `amplaz ${euro(auto)} (${vFlaschen()} Fläschen)` : (vFlaschen() ? `${vFlaschen()} Fläschen` : "");
}

async function vSpeichern() {
  const zeige = (art, t) => { FORM.meldung = { art, text: t }; $("#vMeldung").innerHTML = `<div class="meldung ${art}">${esc(t)}</div>`; };
  const KE = kaeuferErgebnis(Z, FORM.k);
  const posten = vArtikel().filter(x => FORM.n[x.key] > 0).map(x => ({ sorte: x.key, n: FORM.n[x.key] }));
  if (KE.fehler) return zeige("fehler", KE.fehler);
  if (!posten.length) return zeige("fehler", "Wéi vill? Mindestens eng Fläsch oder ee Fass.");
  if (!FORM.wie) return zeige("fehler", "Wéi bezuelt? WERO, SumUp, Iwwerweisung, Bar — oder méi spéit. Tipp w.e.g. eent un.");
  const betrag = FORM.betrag != null ? FORM.betrag : vAutoBetrag();
  const umbuchen = await fehlendesHolen(FORM.verkaeufer, posten);
  if (umbuchen == null) return;
  const neu = eintragen([...KE.eintraege, ...umbuchen, { art: "verkauf", verkaeufer: FORM.verkaeufer, kaeufer: KE.name, ...(KE.kid ? { kid: KE.kid } : KE.kf ? { kf: KE.kf } : {}), posten, betrag }]);
  const v = neu.find(e => e.art === "verkauf");
  if (!v) return; // gerade eben schon gespeichert (Doppeltipp)
  const wie = FORM.wie;
  if (wie !== "spaeter" && betrag > 0) eintragen([{ art: "zahlung", ref: v.id, betrag, wie }]);
  const verk = FORM.verkaeufer;
  FORM = leeresFormular(); FORM.verkaeufer = verk;
  FORM.meldung = { art: "ok", text: `✓ Agedroen: ${KE.name}${KE.eintraege.length ? " (📇 neie Client)" : ""}, ${postenText(posten)}, ${euro(betrag)} — ${wie !== "spaeter" ? "bezuelt per " + ZAHLARTEN[wie] : "steet ënner „Ausstoend“"}` +
    (umbuchen.length ? ` (${umbuchen.map(u => postenText([u])).join(", ")} ${u0(umbuchen[0].von)} ëmgebucht)` : "") };
  if (document.activeElement) document.activeElement.blur();
  renderVerkaufen();
}

/* Auswahlfrage mit mehreren Antworten (Promise mit dem Schlüssel oder null bei Ofbriechen). */
function frageWaehlen(titel, text, optionen) {
  return new Promise(fertig => {
    const box = $("#frageWahl");
    $("#frageTitel").textContent = titel; $("#frageText").textContent = text || "";
    $("#frageKnoepfe").innerHTML = optionen.map(o => `<button data-wahl="${esc(o.key)}" class="${o.gut ? "gut" : ""}">${esc(o.text)}${o.klein ? `<small>${esc(o.klein)}</small>` : ""}</button>`).join("");
    box.classList.remove("versteckt");
    const zu = k => { box.classList.add("versteckt"); fertig(k); };
    box.querySelectorAll("[data-wahl]").forEach(b => b.onclick = () => zu(b.dataset.wahl));
    $("#frageZu").onclick = () => zu(null);
    box.onclick = e => { if (e.target === box) zu(null); };
  });
}
/* Fehlt dem Verkäufer etwas: woher nehmen? Gibt [Umbuchungen] zurück, [] für „trotzdem“, null für Abbruch.
   Angeboten wird nur, wer für alles Fehlende genug frei hat (Reservierungen zählen mit). Vom Nutzer, 14.11.2026. */
async function fehlendesHolen(wer, posten) {
  const fehlt = zuWenig(Z, wer, posten);
  if (!fehlt.length) return [];
  const brauch = fehlt.map(p => ({ sorte: p.sorte, n: p.n - Math.max(0, p.frei) }));
  const was = brauch.map(p => postenText([p])).join(", ");
  const quellen = [LAGER, ...Z.cfg.leute.filter(x => x !== wer)].filter(h => brauch.every(p => frei(Z, h, p.sorte) >= p.n));
  const opt = quellen.map((h, i) => ({ key: "q:" + h, gut: i === 0,
    text: h === LAGER ? "📦 Aus dem Lager huelen" : `Vum ${h} huelen`,
    klein: brauch.map(p => `${postenText([p])} — ${h === LAGER ? "am Lager" : "huet"} fräi ${frei(Z, h, p.sorte)}`).join(" · ") }));
  opt.push({ key: "trotzdem", text: "Trotzdeem androen", klein: `ouni ëmzebuchen — de Stock ${beim(wer)} geet an de Minus` });
  const k = await frageWaehlen(`${de(wer)[0].toUpperCase() + de(wer).slice(1)} feelt: ${was}`,
    fehltText(wer, fehlt) + (quellen.length ? "" : "\n\nKeen huet genuch fräi."), opt);
  if (k == null) return null;
  if (k === "trotzdem") return [];
  const von = k.slice(2);
  return brauch.map(p => ({ art: "bewegung", sorte: p.sorte, n: p.n, von, an: wer }));
}

/* Zahlungsart wählen (Ausstoend, Livraisons): Fenster mit WERO / SumUp / Iwwerweisung / Bar. Gibt die Art oder null.
   Mit `bis` (Vorauszahlung, Fassung h): oben „Wéivill?“, vorbelegt mit allem; weniger = Acompte. Gibt dann {wie, betrag}. */
function zahlartWaehlen(titel, bis) {
  return new Promise(fertig => {
    const box = $("#zahlWahl");
    $("#zahlTitel").textContent = titel;
    const mitBetrag = typeof bis === "number", feld = $("#zahlWieviel");
    $("#zahlBetrag").classList.toggle("versteckt", !mitBetrag);
    if (mitBetrag) { feld.value = String(bis).replace(".", ","); $("#zahlBetragInfo").textContent = `Alles = ${euro(bis)}. Manner = Acompte, de Rescht bleift op.`; }
    box.querySelector(".seg").innerHTML = Object.keys(ZAHLARTEN).map(k => `<button data-wie="${k}" class="zbtn">${zahlInhalt(k)}</button>`).join("");
    box.classList.remove("versteckt");
    const zu = wie => { box.classList.add("versteckt"); if (document.activeElement === feld) feld.blur(); fertig(wie); };
    box.querySelectorAll("[data-wie]").forEach(b => b.onclick = () => {
      if (!mitBetrag) return zu(b.dataset.wie);
      const betrag = runde(Number(String(feld.value).replace(",", ".").replace(/[^\d.]/g, "")));
      if (!(betrag > 0) || betrag > bis) { $("#zahlBetragInfo").innerHTML = `<span style="color:var(--rot)">Betrag tëschent 0 an ${esc(euro(bis))}.</span>`; return; }
      zu({ wie: b.dataset.wie, betrag });
    });
    $("#zahlZu").onclick = () => zu(null);
    box.onclick = e => { if (e.target === box) zu(null); };
  });
}

/* ---------- Offen ---------- */
let NUR_MEINE = false;
function renderOffen() {
  const box = $("#t-offen");
  const liste = Z.kaeufer.map(K => {
    const vs = K.verkaeufe.filter(v => v.offen > 0 && (!NUR_MEINE || v.verkaeufer === EIN.ich));
    return { ...K, sicht: vs, sichtOffen: runde(vs.reduce((a, v) => a + v.offen, 0)) };
  }).filter(K => K.sicht.length);
  box.innerHTML = `<div class="card">
    <div class="kopfz" style="display:flex;justify-content:space-between;align-items:center">
      <h2 style="margin:0">Nach net bezuelt</h2><b style="color:var(--gelb);font-size:20px">${euro(liste.reduce((a, K) => a + K.sichtOffen, 0))}</b></div>
    <div class="seg"><button data-meine="0" class="${NUR_MEINE ? "" : "an"}">All</button><button data-meine="1" class="${NUR_MEINE ? "an" : ""}">Just meng</button></div>
  </div>
  ${liste.length ? liste.map((K, i) => `<div class="card kunde">
    <div class="kopfz"><h2 style="margin:0">${esc(K.name)}</h2><span class="betrag">${euro(K.sichtOffen)}</span></div>
    ${K.sicht.map(v => `<div class="vk"><span>${v.livraison ? `🚚 Bestellung ${esc(datumKurz(v.livraison.datum))}` : datumText(v.zeit)} · ${esc(postenText(v.posten))}<br><small class="muted">${esc(beim(v.verkaeufer))}${v.bezahlt ? ` · ${euro(v.bezahlt)} scho bezuelt` : ""}</small></span><span>${euro(v.offen)}</span></div>`).join("")}
    <div class="knopfe">
      <button class="knopf akt" data-alles="${i}">Alles bezuelt ✓</button>
      <button class="knopf" data-teil="${i}">Deelbetrag…</button>
      <button class="knopf" data-erinnern="${i}">Erënneren 💬</button>
    </div></div>`).join("") : `<div class="card leer">Alles bezuelt. 🎉</div>`}`;
  box.querySelectorAll("[data-meine]").forEach(b => b.onclick = () => { NUR_MEINE = b.dataset.meine === "1"; renderOffen(); });
  box.querySelectorAll("[data-alles]").forEach(b => b.onclick = async () => {
    const K = liste[+b.dataset.alles];
    const wie = await zahlartWaehlen(`${K.name}: ${euro(K.sichtOffen)} bezuelt — wéi?`);
    if (!wie) return;
    eintragen(K.sicht.map(v => ({ art: "zahlung", ref: v.id, betrag: v.offen, wie })));
  });
  box.querySelectorAll("[data-teil]").forEach(b => b.onclick = async () => {
    const K = liste[+b.dataset.teil];
    const t = prompt(`${K.name}: wéi vill gouf bezuelt? (op: ${euro(K.sichtOffen)})`, "");
    if (t == null) return;
    const x = runde(+t.trim().replace(",", ".").replace("€", ""));
    if (!(x > 0)) return alert("Dat ass kee Betrag.");
    const { zahlungen, rest } = verteile(K.sicht, x);
    if (rest > 0 && !confirm(`Dat sinn ${euro(rest)} méi wéi op. Agedroe ginn nëmmen ${euro(x - rest)}. Ok?`)) return;
    const wie = await zahlartWaehlen(`${K.name}: ${euro(x - rest)} bezuelt — wéi?`);
    if (!wie) return;
    eintragen(zahlungen.map(z => ({ ...z, wie })));
  });
  box.querySelectorAll("[data-erinnern]").forEach(b => b.onclick = async () => {
    const K = liste[+b.dataset.erinnern];
    const t = erinnerung({ ...K, verkaeufe: K.sicht, offen: K.sichtOffen });
    try { if (navigator.share) { await navigator.share({ text: t }); return; } } catch (f) { if (f && f.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(t); alert("Text kopéiert:\n\n" + t); } catch { prompt("Text fir ze kopéieren:", t); }
  });
}

/* ---------- Bestand ---------- */
/* ---------- Biere (im Reiter Stock) ---------- */
let BIERFORM = null, ARCHIV_AUF = false, BIER_MELD = ""; // Meldung bleibt stehen, auch wenn ein Abgleich die Liste neu baut
const zahlText = x => x == null ? "" : String(x).replace(".", ",");
const zahlAus = t => { const v = String(t || "").trim().replace(",", "."); return v === "" ? null : (isFinite(+v) ? +v : NaN); };
function bierInfo(c) {
  const m = c.meta || {};

    if (confirm(`${D.name} läschen?`)) eintragen([{ art: "storno", ref: D.id }]);

}

/* Abgefüllt je Bier (vom Nutzer, Fassung c): im Bearbeiten steht die Gesamtzahl; ändern = Unterschied am Lager ausgleichen.
   Technisch: alle bisherigen Abfüllungen dieses Artikels storno + eine neue mit der neuen Gesamtzahl (`vorher` = alte). */
const abgefuelltVon = key => (Z.sorten[key] || {}).abgefuellt || 0;
function abgefuelltFelder(name) {
  const fl = abgefuelltVon(name), f20 = abgefuelltVon(fassKey(name, 20)), f30 = abgefuelltVon(fassKey(name, 30));
  return { flaschen: String(fl || ""), f20: String(f20 || ""), f30: String(f30 || ""), ab0: { flaschen: fl, f20, f30 } };
}
function abfuellKorrektur(name, alt, neu) { // gibt Einträge zurück
  const out = [];
  for (const [feld, key] of [["flaschen", name], ["f20", fassKey(name, 20)], ["f30", fassKey(name, 30)]]) {
    if (neu[feld] === alt[feld]) continue;
    for (const e of Z.aktiv) if (e.art === "abfuellung" && e.sorte === key) out.push({ art: "storno", ref: e.id });
    if (neu[feld] > 0) out.push({ art: "abfuellung", sorte: key, n: neu[feld], ...(alt[feld] ? { vorher: alt[feld] } : {}) });
  }
  return out;
}

      ${F.neu ? "" : `<div class="vorschau versteckt" id="biVor"></div>`}
    <label for="biNotiz">Beschreiwung (fräiwëlleg)</label><input id="biNotiz" value="${esc(F.notiz)}" placeholder="z. B. Hopfen, Geschmaach">
    <button class="haupt" id="biOk">${F.neu ? "Béier uleeën" : "Späicheren"}</button>
    <button class="haupt" id="biZu" style="background:var(--card2);color:var(--text)">Ofbriechen</button>
    <div id="biMeld">${F.meldung ? `<div class="meldung ok">${esc(F.meldung)}</div>` : ""}</div></div>
    ${F.neu ? `<div class="card hinweis">📎 Etikett, Rezept a Brauprotokoll kanns de derbäisetzen, soubal d'Béier ugeluecht ass.</div>` : `<div class="card"><h2>📎 Dokumenter</h2><div id="bierDok"></div></div>`}`;
  if (!F.neu) renderDok(F.name);
  const bind = (id, k) => { const el = $(id); if (el) el.oninput = el.onchange = () => { F[k] = el.value; }; };
  bind("#biName", "name"); bind("#biStil", "stil"); bind("#biBrau", "braudatum"); bind("#biAlk", "alk"); bind("#biLiter", "liter");

  bind("#biP20", "preis20"); bind("#biP30", "preis30"); bind("#biF20", "f20"); bind("#biF30", "f30");
  // Vorschau: was sich am Lager ändert (nur beim Bearbeiten)
  const vor = () => { const el = $("#biVor"); if (!el || !F.ab0) return;
    const anz = t => String(t || "").trim() ? parseInt(t, 10) : 0, teile = [];
    for (const [feld, key, txt] of [["flaschen", F.name, "Fläschen"], ["f20", fassKey(F.name, 20), "× Fass 20 l"], ["f30", fassKey(F.name, 30), "× Fass 30 l"]]) {
      const d = anz(F[feld]) - F.ab0[feld]; if (d && !isNaN(d)) teile.push(`<b>${hat(Z, LAGER, key) + d}</b> ${txt} (${d > 0 ? "+" : ""}${d})`); }
    el.classList.toggle("versteckt", !teile.length); el.innerHTML = "Duerno am 📦 Lager: " + teile.join(" · "); };
  for (const id of ["#biFl", "#biF20", "#biF30"]) { const el = $(id); if (el) el.addEventListener("input", vor); }
  vor();
  $("#biZu").onclick = () => { BIERFORM = null; renderBiere(); };
  $("#biOk").onclick = () => {
    const meld = t => $("#biMeld").innerHTML = `<div class="meldung fehler">${esc(t)}</div>`;
    // Neue Biere: Braudatum gehört zum Namen (zweiter Sud NEIPA = eigenes Bier). Bestehende behalten ihren Namen.
    const grund = F.name.trim().replace(/\s+/g, " ");
    const name = F.neu && F.braudatum && !hatDatum(grund) ? `${grund} (${datumLang(F.braudatum)})` : grund;
    const preis = zahlAus(F.preis), alk = zahlAus(F.alk), liter = zahlAus(F.liter), fl = String(F.flaschen).trim() ? parseInt(F.flaschen, 10) : 0;

    const anz = t => String(t || "").trim() ? parseInt(t, 10) : 0, f20 = anz(F.f20), f30 = anz(F.f30);

    if (F.neu && !/^\d{4}-\d{2}-\d{2}$/.test(F.braudatum || "")) return meld("Braudatum feelt — w.e.g. aginn (et kënnt an den Numm, z. B. „NEIPA (28.07.2026)“).");
    if (F.neu && (Z.cfg.sorten.some(c => c.name.toLowerCase() === name.toLowerCase()) || name === LAGER)) return meld("Dee Numm gëtt et schonn.");
    // Zwei Biere dürfen auch nicht gleich AUSSEHEN (z. B. altes „NEIPA“ + Datum 28.07. und neues „NEIPA (28.07.2026)“):
    // sonst kann man sie nicht unterscheiden, und im Excel hießen zwei Blätter gleich.
    { const sicht = (F.braudatum ? `${grund.replace(/ \(\d{1,2}\.\d{1,2}\.\d{4}\)$/, "")} (${datumLang(F.braudatum)})` : (F.neu ? name : bierText(name))).toLowerCase();
      const gleich = Z.cfg.sorten.find(c => c.name !== name && bierText(c.name).toLowerCase() === sicht);
      if (gleich) return meld(`Dat gesäit aus wéi e Béier, dat et schonn gëtt: „${bierText(gleich.name)}“. Aneren Numm oder anert Braudatum huelen.`); }
    if (preis == null || isNaN(preis)) return meld("Wat kascht eng Fläsch?");
    if (Number.isNaN(alk) || Number.isNaN(liter)) return meld("Alkohol a Liter just als Zuel, z. B. 5,6.");
    if (fl && !ganz(fl)) return meld("Fläschen: just eng ganz Zuel.");
    if ((f20 && !ganz(f20)) || (f30 && !ganz(f30))) return meld("Fässer: just eng ganz Zuel.");
    if (Number.isNaN(p20) || Number.isNaN(p30)) return meld("Fasspräis just als Zuel.");
    if (name.match(/ Keg (20|30)l$/)) return meld("Fässer brauche keen eegent Béier — si stinn ënnert dem Béier.");
    const e = { art: "bier", name, preis: runde(preis), stil: F.stil.trim(), braudatum: F.braudatum, alk, liter, mhd: F.mhd, notiz: F.notiz.trim(),
      ...(p20 != null ? { preis20: runde(p20) } : {}), ...(p30 != null ? { preis30: runde(p30) } : {}) };
    if (!gueltig({ ...e, id: "x", zeit: 0 })) return meld("Eppes ass ze laang oder net richteg (Numm max. 30 Zeechen).");
    const teile = [e];
    if (F.neu && fl) teile.push({ art: "abfuellung", sorte: name, n: fl });
    if (F.neu && f20) teile.push({ art: "abfuellung", sorte: fassKey(name, 20), n: f20 });
    if (F.neu && f30) teile.push({ art: "abfuellung", sorte: fassKey(name, 30), n: f30 });
    if (document.activeElement) document.activeElement.blur();
    if (!F.neu && F.ab0) { // Abgefüllt geändert → am Lager ausgleichen; weniger als im Lager liegt → nachfragen
      const neu = { flaschen: fl || 0, f20, f30 }, korr = abfuellKorrektur(name, F.ab0, neu);
      const zuViel = [["flaschen", name], ["f20", fassKey(name, 20)], ["f30", fassKey(name, 30)]].filter(([f, k]) => F.ab0[f] - neu[f] > hat(Z, LAGER, k));
      if (zuViel.length && !confirm(`Am Lager leien net genuch, fir sou vill erofzehuelen (${zuViel.map(([f, k]) => `${artikelText(k)}: am Lager ${hat(Z, LAGER, k)}`).join(", ")}). De Stock am Lager geet an de Minus.\n\nTrotzdeem?`)) return;
      teile.push(...korr);
    }
    if (!eintragen(teile).length) return;
    FORM = null; BFORM = null; LFORM = null;
    if (F.neu) {
      // Gleich in die Bearbeitung, damit man Etikett & Co. anhängen kann.
      const m = e;
      BIERFORM = { neu: false, name, stil: m.stil, braudatum: m.braudatum, alk: zahlText(m.alk), liter: zahlText(m.liter), preis: zahlText(m.preis),
        preis20: zahlText(m.preis20 ?? 150), preis30: zahlText(m.preis30 ?? 180), mhd: m.mhd, notiz: m.notiz, flaschen: "", f20: "", f30: "",
        meldung: `✓ ${name} ugeluecht` + [fl ? `${fl} Fläschen` : "", f20 ? `${f20} × Fass 20 l` : "", f30 ? `${f30} × Fass 30 l` : ""].filter(Boolean).map((t, i) => (i ? ", " : ", am Lager: ") + t).join("") + `. Elo kanns de Dateien derbäisetzen.` };
      renderBiere(); return;
    }
    BIERFORM = null; BIER_MELD = `✓ ${bierText(name)} gespäichert`;
    renderBiere();
  };
}

  </table></div>

/* Knopf „Fläschen“ auf der Startseite (vom Nutzer, Fassung k): drei Flaschen, ein 20-l- und ein 30-l-Fass */

  <rect x="-${h * 0.1}" y="-${h + 2}" width="${h * 0.2}" height="2.4" rx="0.8" fill="#4a4f55"/>
  <text x="0" y="-${h * 0.42}" font-size="${h * 0.26}" font-weight="900" text-anchor="middle" fill="#2a2d31" font-family="Arial">${txt}</text></g>`;
const ABS_BILD_FLASCHEN = ABS_SVG(`${ABS_FASS(52, 54, 32, "30 l")}${ABS_FASS(36, 54, 25, "20 l")}${ABS_FL(7, 37, 0.7, -5)}${ABS_FL(15, 38, 0.7, 0)}${ABS_FL(23, 39, 0.7, 5, "")}`);
const ABSICHTEN = {
  huelen: { ic: "📥", txt: "Ech huele mer Fläschen", klein: "aus dem Lager" },
  zreck: { ic: "📤", txt: "Zréck an d'Lager", klein: "déi ech net brauch" },
  ginn: { ic: "🤝", txt: "Engem anere ginn", klein: "oder vun him kréien" },

};
const GRUND_IC = { getrunken: "🍻 Selwer gedronk", verschenkt: "🎁 Verschenkt / Prouf", kaputt: "💥 Futti", sonst: "✏️ Soss eppes" };
function renderBForm() {
  const box = $("#bForm");
  if (tipptIn(box)) return;
  const sorten = [...vSorten().flatMap(s => [s.name, ...FAESSER.map(F => fassKey(s.name, F.l))]),
    ...Z.cfg.sorten.filter(s => s.archiv).flatMap(s => FAESSER.map(F => fassKey(s.name, F.l)).filter(k => Z.halter.some(h => hat(Z, h, k) > 0)))];

    zurueck: () => { B.meld = ""; renderBForm(); } });
}

/* Die vier Absichten (Stock und Startseite, Fassung k). kopf = z. B. „✕ Zoumaachen“ auf der Startseite. */

    <div class="hinweis" style="margin-top:10px">Nei ofgefëllt? Bei <b>Eis Béieren am Stock</b> beim Béier op <b>✎ Änneren</b>.</div></div>`;

      von: k === "huelen" ? LAGER : ich, an: k === "huelen" ? ich : k === "zreck" ? LAGER : aner, wer: ich });
    neu();
  });
}

/* Formular einer Absicht (Pfeil, Bier, Anzahl, Vorschau). Läuft im Stock (Präfix „b“) und auf der Startseite (Präfix „h“, nur „huelen“,
   vom Nutzer, Fassung i: „Fläschen huelen“ ohne die Startseite zu verlassen). ids je Präfix, damit sich beide nicht in die Quere kommen. */
function flaschenForm(box, B, P, neu, o) {
  const q = id => box.querySelector("#" + P + id);
  const sorten = [...vSorten().flatMap(s => [s.name, ...FAESSER.map(F => fassKey(s.name, F.l))]),
    ...Z.cfg.sorten.filter(s => s.archiv).flatMap(s => FAESSER.map(F => fassKey(s.name, F.l)).filter(k => Z.halter.some(h => hat(Z, h, k) > 0)))];
  if (!sorten.includes(B.sorte)) B.sorte = sorten[0] || "";
  const A = ABSICHTEN[B.absicht], halter = [LAGER, ...Z.cfg.leute];
  const nameH = h => h === LAGER ? "📦 Lager" : "👤 " + h;
  const opt = (liste, wert, txt = x => x) => liste.map(x => `<option value="${esc(x)}" ${x === wert ? "selected" : ""}>${esc(txt(x))}</option>`).join("");
  const sorteTxt = k => istFass(k) ? `${bierText(zerlege(k).bier)} · Fass ${zerlege(k).l} l` : bierText(k);
  const standTxt = h => { const n = hat(Z, h, B.sorte), r = reserviertBei(Z, h, B.sorte); return r ? `${n - r} fräi · ${n} do` : `huet ${n}`; };
  const kasten = (seite, h, titel = nameH(h)) => `<div class="pk"><b>${esc(titel)}</b><small>${esc(standTxt(h))}</small>
    ${B["aend" + seite] ? `<select data-hw="${seite}">${opt(halter, h, nameH)}</select>` : `<button class="aend" data-aend="${seite}">änneren</button>`}</div>`;
  const fort = B.absicht === "fort";
  box.innerHTML = `<div class="card"><h2>${A.ic} ${esc(A.txt)}</h2>${o.kopf || `<button class="zurueck" id="${P}Zreck">‹ aner Saach</button>`}
    ${fort ? `<label>Wat ass geschitt?</label><div class="gruende">${Object.keys(GRUENDE).map(g => `<button data-grund="${g}" class="${B.grund === g ? "an" : ""}">${GRUND_IC[g]}</button>`).join("")}</div>
      ${B.grund === "sonst" ? `<input id="${P}Notiz" value="${esc(B.notiz)}" placeholder="Wat?" style="margin-top:6px" maxlength="300">` : ""}
      <div class="pfeil eins">${kasten("Wer", B.wer, B.wer === LAGER ? "📦 vum Lager" : B.wer === EIN.ich ? "👤 vu mengen: " + B.wer : "👤 vum " + B.wer)}</div>`
    : `<div class="pfeil">${kasten("Von", B.von)}<div class="pm">➜<button id="${P}Tausch" aria-label="ëmdréinen">⇄</button></div>${kasten("An", B.an)}</div>`}
    <div class="zeile" style="margin-top:6px"><div><label for="${P}Sorte">Béier</label><select id="${P}Sorte">${opt(sorten, B.sorte, sorteTxt)}</select></div>
      <div><label for="${P}N">Unzuel</label><input id="${P}N" inputmode="numeric" pattern="[0-9]*" value="${esc(B.n)}" placeholder="0"></div></div>
    <div class="vorschau" id="${P}Vor"></div>
    <button class="haupt" id="${P}Ok">Androen</button>
    <div id="${P}Meld"></div></div>`;
  const vorschau = () => {
    const n = parseInt(B.n, 10), el = q("Vor"); if (!el) return;
    if (!ganz(n)) { el.classList.add("versteckt"); return; }
    el.classList.remove("versteckt");
    const k = istFass(B.sorte) ? ` ${sorteTxt(B.sorte)}` : ` ${bierText(B.sorte).replace(/ \(.*\)$/, "")}`;
    el.innerHTML = fort ? `Duerno: ${esc(nameH(B.wer))} <b>${hat(Z, B.wer, B.sorte) - n}</b>${esc(k)}`
      : `Duerno: ${esc(nameH(B.von))} <b>${hat(Z, B.von, B.sorte) - n}</b> · ${esc(nameH(B.an))} <b>${hat(Z, B.an, B.sorte) + n}</b>${esc(k)}`;
  };
  vorschau();
  const zr = q("Zreck"); if (zr) zr.onclick = o.zu;
  const t = q("Tausch"); if (t) t.onclick = () => { [B.von, B.an] = [B.an, B.von]; neu(); };
  box.querySelectorAll("[data-aend]").forEach(b => b.onclick = () => { B["aend" + b.dataset.aend] = true; neu(); });
  box.querySelectorAll("[data-hw]").forEach(sel => sel.onchange = () => { const s = sel.dataset.hw; B[s === "Von" ? "von" : s === "An" ? "an" : "wer"] = sel.value; B["aend" + s] = false; sel.blur(); neu(); });
  box.querySelectorAll("[data-grund]").forEach(b => b.onclick = () => { B.grund = b.dataset.grund; neu(); });
  const nt = q("Notiz"); if (nt) nt.oninput = () => { B.notiz = nt.value; };
  q("Sorte").onchange = e => { B.sorte = e.target.value; e.target.blur(); neu(); };
  q("N").oninput = e => { B.n = e.target.value; vorschau(); };
  q("Ok").onclick = () => {
    const meld = t => q("Meld").innerHTML = `<div class="meldung fehler">${esc(t)}</div>`;
    const n = parseInt(B.n, 10);
    if (!ganz(n)) return meld("Wéi vill Fläschen?");
    let e;
    if (!fort) {
      if (B.von === B.an) return meld("Vun an Un sinn d'selwecht.");
      { const f = zuWenig(Z, B.von, [{ sorte: B.sorte, n }]); if (f.length && !confirm(`Net genuch fräi:\n\n${fehltText(B.von, f)}\n\nTrotzdeem?`)) return; }
      e = { art: "bewegung", sorte: B.sorte, n, von: B.von, an: B.an };
    } else {
      { const f = zuWenig(Z, B.wer, [{ sorte: B.sorte, n }]); if (f.length && !confirm(`Net genuch fräi:\n\n${fehltText(B.wer, f)}\n\nTrotzdeem?`)) return; }
      e = { art: "abgang", sorte: B.sorte, n, wer: B.wer, grund: B.grund, ...(B.grund === "sonst" && B.notiz.trim() ? { notiz: B.notiz.trim() } : {}) };
    }
    if (document.activeElement) document.activeElement.blur();
    const text = "✓ " + beschreibe(e, Z);
    o.fertig(text);
    if (!eintragen([e]).length) o.zurueck();
  };
}

let VERLAUF_MAX = 100;
function renderVerlauf() {
  const box = $("#t-verlauf");
  const offenIds = new Set(AUSGANG.map(e => e.id));
  const alle = [...Z.liste].reverse();
  const zeige = alle.slice(0, VERLAUF_MAX);
  box.innerHTML = `<button class="knopf" id="vlZurueck" style="margin-top:12px">← Zréck an d'Astellungen</button><div class="card"><h2>📜 Verlaf</h2>
    ${zeige.length ? zeige.map(e => {
      const weg = Z.storniert.get(e.id);
      const kann = e.art !== "storno" && !weg;
      return `<div class="log ${weg ? "weg" : ""}"><div class="lt"><div>${esc(beschreibe(e, Z))}</div>
        <small>${zeitText(e.zeit)} · ${esc(e.durch || "?")}${offenIds.has(e.id) ? " · ⏳ nach net geschéckt" : ""}${weg ? ` · geläscht vum ${esc(weg.durch || "?")}` : ""}</small></div>
        ${kann ? `<button class="zurueck" data-storno="${esc(e.id)}" aria-label="Läschen" title="Läschen">✕</button>` : ""}</div>`;
    }).join("") : `<div class="leer">Nach näischt agedroen.</div>`}
    ${alle.length > VERLAUF_MAX ? `<button class="knopf" id="mehr" style="width:100%;margin-top:10px">Méi al weisen</button>` : ""}
  </div>`;
  box.querySelectorAll("[data-storno]").forEach(b => b.onclick = () => {
    const e = Z.nachId.get(b.dataset.storno);
    if (!e) return;
    let frage = `Dësen Agab läschen?\n\n${beschreibe(e, Z)}`;
    if (e.art === "verkauf" && (Z.vkNachId.get(e.id) || {}).bezahlt) frage += "\n\nD'Bezuelung dozou zielt dann och net méi.";

    eintragen([{ art: "storno", ref: e.id }]);

  const m = $("#mehr"); if (m) m.onclick = () => { VERLAUF_MAX += 200; renderVerlauf(); };
  $("#vlZurueck").onclick = () => { TAB = "einst"; EFORM = null; render(); window.scrollTo(0, 0); };
}

/* ---------- Doppeltipp-Schutz, Stufe 1 ----------
   Ein zweiter Tipp auf denselben Knopf innerhalb von 800 ms wird verschluckt. „Derselbe“ heißt gleiche
   id, gleiche data-Werte und gleicher Text — gilt also auch, wenn der Knopf inzwischen neu gebaut
   wurde (sonst träfe der zweite Tipp z. B. den nächsten Käufer, der in der Liste nachrückt).
   Verschiedene Knöpfe schnell hintereinander gehen durch. Ausnahme: −/+ beim Verkaufen. */
let LETZTER_TIPP = { k: "", t: 0 };
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("button");
  if (!b || b.closest(".stepper")) return;
  const jetzt = Date.now();
  const k = b.id + "|" + JSON.stringify(b.dataset) + "|" + b.textContent.trim();
  if (k === LETZTER_TIPP.k && jetzt - LETZTER_TIPP.t < 800) { e.preventDefault(); e.stopImmediatePropagation(); return; }
  LETZTER_TIPP = { k, t: jetzt };
}, true);

/* Doppeltipp-Zoom, Stufe 2: touch-action allein hat am iPhone nicht gereicht (Fassung n, gemeldet
   13.11.2026 — in der Koeppchen-App reicht es, Ursache unbekannt). Ein zweiter Ein-Finger-Tipp innerhalb
   von 350 ms wird abgefangen, bevor iOS zoomt. Zwei-Finger-Zoom bleibt (nur changedTouches = 1, und
   nur wenn kein zweiter Finger liegt). −/+ bekommt den Tipp trotzdem (click() von Hand);
   Eingabefelder bleiben unberührt (Doppeltipp markiert dort ein Wort). */
let LETZTES_ENDE = { t: 0, x: 0, y: 0 };
document.addEventListener("touchend", e => {
  const jetzt = Date.now();
  const z = e.target;
  const einFinger = e.changedTouches.length === 1 && e.touches.length === 0;
  const p = e.changedTouches[0];
  // Zoom-Doppeltipp = zweimal dieselbe Stelle. Zwei verschiedene Knöpfe schnell hintereinander gehen durch.
  const nah = p && Math.abs(p.clientX - LETZTES_ENDE.x) < 40 && Math.abs(p.clientY - LETZTES_ENDE.y) < 40;
  if (einFinger && nah && jetzt - LETZTES_ENDE.t < 350 && !(z.closest && z.closest("input,select,textarea"))) {
    e.preventDefault();
    const knopf = z.closest && z.closest(".stepper button");
    if (knopf) knopf.click();
  }
  LETZTES_ENDE = einFinger && p ? { t: jetzt, x: p.clientX, y: p.clientY } : { t: 0, x: 0, y: 0 };
}, { passive: false });

/* ---------- Start ---------- */
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => {
  TAB = b.dataset.tab; EIN.tab = TAB; merke(SP, EIN); BIER_MELD = "";
  if (TAB === "verkaufen" && FORM) FORM.meldung = null;
  EFORM = null; render(); window.scrollTo(0, 0);
});
$("#sync").onclick = () => { SYNC_AUF = !SYNC_AUF; renderSync(); };
$("#hautBtn").onclick = () => { TAB = "haut"; render(); window.scrollTo(0, 0); };
$("#zurHaut").onclick = () => { if (!bereit()) return; TAB = "haut"; render(); window.scrollTo(0, 0); };
$("#kalBtn").onclick = () => { TAB = "kalender"; KAL_BEREICH = "kalender"; A_INLINE = null; KALFORM = null; KAL_MELD = ""; render(); window.scrollTo(0, 0); };
$("#zahnrad").onclick = () => { TAB = "einst"; EFORM = null; render(); window.scrollTo(0, 0); };
/* ---------- Neue Fassung ----------
   Beim Öffnen und bei jeder Rückkehr zur App: liegt bei GitHub eine andere FASSUNG, lädt die App
   sich selbst neu — außer mitten in einem Eintrag, dann ein Knopf. Erst fetch mit cache:"reload"
   (ersetzt die Kopie im Zwischenspeicher), dann reload. Je Zielfassung höchstens ein Versuch in
   5 min, damit ein noch alter CDN-Stand keine Schleife macht. */
let NEUE = "";
function mittenImEintrag() {
  const a = document.activeElement;
  if (a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return true;
  if (TAB === "einst" && EFORM) return true;
  if (FORM && (kundeLabel(FORM.k) || Object.values(FORM.n).some(n => n > 0) || FORM.betrag != null)) return true;
  if (BFORM && String(BFORM.n).trim()) return true;
  if (KFORM) return true;
  if (KALFORM) return true;
  if (L_NEU || BIERFORM || UPLOAD || ANSICHT || !$("#zahlWahl").classList.contains("versteckt") || !$("#frageWahl").classList.contains("versteckt")) return true;
  if (FORM && FORM.wie) return true;
  return false;
}
function neuLaden() {
  try { localStorage.setItem("millebeier_v1_update", JSON.stringify({ f: NEUE, t: Date.now() })); } catch {}
  location.reload();
}
async function updatePruefen() {
  if (navigator.onLine === false) return;
  try {
    const r = await fetch(location.href.split("#")[0], { cache: "reload" });
    if (!r.ok) return;
    const m = (await r.text()).match(/const FASSUNG = "([^"]+)"/);
    if (!m || m[1] === FASSUNG) return;
    NEUE = m[1];
    const v = lade("millebeier_v1_update", {});
    const kuerzlich = v.f === NEUE && Date.now() - v.t < 5 * 60000;
    if (!kuerzlich && !mittenImEintrag()) return neuLaden();
    const k = $("#neu");
    k.textContent = `Nei Versioun (${NEUE}) — tippen fir ze aktualiséieren`;
    k.classList.remove("versteckt");
  } catch {}
}
$("#neu").onclick = neuLaden;
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") { for (const r in ZUKLAPPEN) if (!ZU_WEG[r]) ZU_WEG[r] = Date.now(); HAUT_WEG = Date.now(); return; }
  if (document.visibilityState === "visible") {
    // Länger als 5 min weg → Startseite (vom Nutzer, Fassung b), außer mitten in einem Eintrag
    const lang = HAUT_WEG && Date.now() - HAUT_WEG > ZU_MS; HAUT_WEG = null;
    if (lang && bereit() && TAB !== "haut" && !mittenImEintrag()) { TAB = "haut"; render(); window.scrollTo(0, 0); }
    else if (ZUKLAPPEN[TAB]) render();
    abgleichen(); updatePruefen();
  }
});
window.addEventListener("online", abgleichen);
setInterval(() => { if (document.visibilityState === "visible") abgleichen(); }, 20000);

neuRechnen();
render();
abgleichen();
updatePruefen();
</script>
