<!doctype html>
<html lang="lb">
<head>
<meta charset="utf-8">
<!-- Kein viewport-fit=cover (Lehre aus den anderen Apps: iOS legt die Seite dann selbst in den sicheren Bereich). -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Millebéier</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Millebéier">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" sizes="180x180" href="bilder/icon-180.png">
<link rel="icon" type="image/png" href="bilder/icon-180.png">
<style>
:root{
  --bg:#000000; --card:#151515; --card2:#232323; --line:#353535;
  --text:#ffffff; --muted:#a8a8a8; --akzent:#e3141b; --akzent2:#ff6b6f; --weissgrau:#dcdcdc;
  --gruen:#7cc47f; --rot:#ff5a52; --gelb:#e8c547;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html{touch-action:manipulation} /* wie in der Koeppchen-App: kein Zoom beim Doppeltippen, zwei Finger zoomen weiter */
*{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:0 0 40px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:3px solid var(--akzent);box-shadow:0 1px 0 var(--weissgrau);padding:10px 0 8px}
.kopf{display:flex;align-items:center;gap:10px}
.kopf h1{font-size:22px;margin:0;flex:1;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.kopf h1 img{width:36px;height:36px;display:block}
.kopf h1 .akz{position:relative;display:inline-block}
.kopf h1 .akz::after{content:"";position:absolute;left:.07em;top:.3em;width:.38em;height:.11em;background:var(--akzent);border-radius:1px;transform:rotate(-10deg)}
#sync{font-size:12px;color:var(--muted);text-align:right;min-width:0;flex-shrink:1}
.kopf h1 > span{white-space:nowrap} /* Name nie umbrechen, auch bei langem Status daneben */
#sync.fehler{color:var(--gelb)}
.zahnrad{background:none;border:0;color:var(--text);font-size:22px;padding:4px 2px;cursor:pointer}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}
@media (min-width:600px){nav{grid-template-columns:repeat(6,1fr)}}
nav button{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;
  padding:8px 0;font-size:13px;font-weight:600;cursor:pointer;position:relative;white-space:nowrap}
nav button.an{background:var(--akzent);color:#fff;border-color:var(--akzent)}
nav .badge{position:absolute;top:-6px;right:-4px;background:var(--rot);color:#fff;border-radius:9px;
  font-size:11px;padding:1px 6px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.card h2{font-size:17px;margin:0 0 10px}
.card h3{font-size:15px;margin:14px 0 6px;color:var(--akzent2)}
.muted{color:var(--muted)} small{font-size:13px}
.kacheln{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kachel{background:var(--card2);border-radius:12px;padding:10px 12px}
.kachel b{display:block;font-size:26px;line-height:1.15}
.kachel span{font-size:13px;color:var(--muted)}
.kachel.geld b{color:var(--gruen)} .kachel.offen b{color:var(--gelb)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
tr.summe td{font-weight:700;border-bottom:0}
.tabwrap{overflow-x:auto}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,select{width:100%;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 12px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:30px}
.zeile{display:flex;gap:8px;align-items:center}
.zeile > *{flex:1}
.posten{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.posten:last-child{border-bottom:0}
.posten .pn{flex:1;min-width:0}
.posten .pn b{display:block}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);
  color:var(--text);font-size:24px;line-height:1;cursor:pointer;touch-action:manipulation}
.stepper input{width:56px;text-align:center;font-size:20px;font-weight:700;padding:8px 2px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.seg.drei{grid-template-columns:1fr 1fr 1fr}
.seg button{padding:12px 4px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);
  font-size:15px;font-weight:600;cursor:pointer}
.seg button.an{background:var(--akzent);color:#fff;border-color:var(--akzent)}
.seg button.an.gruen{background:var(--gruen);border-color:var(--gruen);color:#0d1f0e}
.seg.zahl{grid-template-columns:1fr 1fr;margin-top:4px} .seg button.breit{grid-column:1/-1}
/* Zahlungsart-Knöpfe: Bild oben, Name darunter; gewählt = grüner Rahmen, das Bild bleibt sichtbar */
.seg button.zbtn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 7px 6px}
.seg button.zbtn img{display:block;width:100%;height:48px;object-fit:cover;border-radius:8px}
.seg button.zbtn span{font-size:13px}
.seg button.zbtn.an{background:var(--card2);color:var(--text);border-color:var(--gruen);box-shadow:0 0 0 2px var(--gruen) inset}
.seg button.zbtn.an span::before{content:"✓ ";color:var(--gruen)}
#zahlWahl .seg button.zbtn{padding:8px}
#zahlWahl .seg button.zbtn img{height:56px}
.seg button.an.gelb{background:var(--gelb);border-color:var(--gelb);color:#231d05}
.haupt{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:var(--akzent);color:#fff;
  font-size:17px;font-weight:700;cursor:pointer}
.haupt:disabled{opacity:.45}
.knopf{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);
  font-size:14px;font-weight:600;cursor:pointer}
.knopf.gruen{background:var(--gruen);color:#10200f;border-color:var(--gruen)}
.knopfe{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.meldung{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:14px}
.meldung.ok{background:#20331f;color:#bfe8c0}
.meldung.warn{background:#3a3115;color:#f4e2a0}
.meldung.fehler{background:#3d1c18;color:#ffc2b8}
.leer{color:var(--muted);text-align:center;padding:12px 0}
.kunde .kopfz{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.kunde .betrag{font-size:22px;font-weight:700;color:var(--gelb);white-space:nowrap}
.vk{font-size:14px;padding:6px 0;border-top:1px dashed var(--line);display:flex;justify-content:space-between;gap:8px}
.vk span:last-child{white-space:nowrap}
.log{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.log:last-child{border-bottom:0}
.log .lt{flex:1;min-width:0}
.log .lt small{display:block;color:var(--muted)}
.log.weg .lt > div{text-decoration:line-through;color:var(--muted)}
.log .zurueck{background:none;border:1.5px solid var(--akzent);color:var(--akzent);border-radius:10px;min-width:40px;height:36px;padding:0 10px;font-size:18px;font-weight:700;line-height:1;cursor:pointer}
.hinweis{font-size:13px;color:var(--muted);margin-top:8px}
#neu{display:block;width:100%;margin:8px 0 0;padding:10px 12px;border:0;border-radius:10px;background:var(--akzent);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.probe{background:#3a3115;color:#f4e2a0;border-radius:10px;padding:8px 12px;font-size:13px;margin-top:10px}
.sorte-ed{display:grid;grid-template-columns:1fr 84px 44px 32px;gap:6px;align-items:center;margin-bottom:6px}
.sorte-ed input[type=checkbox]{width:22px;height:22px;-webkit-appearance:checkbox;appearance:auto}
.sorte-ed button,.person-ed button{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer}
.person-ed{display:grid;grid-template-columns:1fr 32px;gap:6px;margin-bottom:6px}
.ichwahl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ichwahl button{padding:16px 8px;font-size:18px;font-weight:700;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);cursor:pointer}
.liv{border-top:1px solid var(--line);padding:12px 0}
.liv:first-of-type{border-top:0}
.liv .kopfz{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.liv .kopfz b{font-size:17px}
.liv .wann{font-size:13px;color:var(--muted)}
.liv .wann.faellig{color:var(--gelb);font-weight:700}
.chip{display:inline-block;font-size:12px;padding:3px 8px;border-radius:9px;background:var(--card2);margin:6px 4px 0 0}
.chip.ok{background:#1f3a20;color:#bfe8c0} .chip.warn{background:#3a3115;color:#f4e2a0}
/* Dreieck links fest, Name darf umbrechen (lange Namen wie „Brown Porter 01/2026 Keg 30l“ sprengten sonst die Tabelle) */
tr.klick{cursor:pointer} tr.klick td:first-child{position:relative;padding-left:22px}
tr.klick td:first-child::before{content:"▶";position:absolute;left:0;color:var(--akzent);font-size:15px}
tr.klick.auf td:first-child::before{content:"▼"}
tr.klick.klein td{font-size:13px;color:var(--muted)} tr.klick.klein td:first-child{padding-left:38px}
tr.klick.klein td:first-child::before{font-size:11px;left:20px;top:9px}
tr.archivzeile td{border-top:1px solid var(--line)}
tr.fass td{font-size:12px;color:var(--muted);border-bottom-style:dashed} tr.fass td:first-child{padding-left:30px}
tr.klick.klein + tr.fass td:first-child, tr.fass + tr.fass.unter td:first-child{padding-left:46px}
@media (max-width:350px){table{font-size:12px} th{font-size:10px} th,td{padding:6px 2px} .wrap{padding:0 10px}}
.bier{border-top:1px solid var(--line);padding:12px 0}
.bier:first-of-type{border-top:0}
.bier .kopfz{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bier .kopfz b{font-size:17px}
.bier .kopfz{align-items:center}
.bier-name{display:flex;align-items:center;gap:10px;min-width:0}
.bier-etikett{flex:none;width:44px;height:44px;padding:0;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--card2);font-size:22px;cursor:pointer}
.bier-etikett img{width:100%;height:100%;object-fit:cover;display:block}
.knopf.rot{border-color:var(--akzent);color:var(--akzent);background:none}
.bier .knopfe{flex-wrap:nowrap} .bier .knopf{flex:1;padding:9px 4px;font-size:13px;white-space:nowrap}
#bTabelle td:first-child{white-space:nowrap}
.detail td{font-size:13px;vertical-align:top}
.detail td:first-child,.detail th:first-child{text-align:left;padding-right:8px}
.detail tr.geplant td{color:var(--muted);font-style:italic}
input[type=date]{min-height:44px}
textarea{width:100%;font:16px/1.4 inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.check{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:15px}
.check input{width:22px;height:22px;-webkit-appearance:checkbox;appearance:auto}
.dok{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.dok:first-of-type{border-top:0}
.dok .bild{width:64px;height:64px;flex:none;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center;
  font-size:26px;overflow:hidden;border:1px solid var(--line);cursor:pointer;padding:0}
.dok .bild img{width:100%;height:100%;object-fit:cover}
.dok .bild.leer{border-style:dashed;color:var(--muted);font-size:28px}
.dok .txt{flex:1;min-width:0}
.dok .txt b{display:block;font-size:14px}
.dok .txt span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dok .knopf{padding:7px 9px;font-size:13px}
.dok-titel{font-size:13px;color:var(--muted);margin:14px 0 2px;text-transform:uppercase;letter-spacing:.5px}
#frageWahl{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.75);display:flex;align-items:flex-end;justify-content:center;padding:16px}
#frageWahl .card{width:100%;max-width:520px;margin:0;max-height:90vh;overflow:auto}
#frageKnoepfe button{display:block;width:100%;text-align:left;margin-top:8px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:16px;font-weight:700;cursor:pointer}
#frageKnoepfe button small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
#frageKnoepfe button.gut{border-color:var(--gruen)}
#zahlWahl{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.75);display:flex;align-items:flex-end;justify-content:center;padding:16px}
#zahlWahl .card{width:100%;max-width:520px;margin:0}
#zahlWahl .seg button{padding:16px 4px;font-size:17px}
#ansicht{position:fixed;inset:0;z-index:20;background:#000;overflow:auto;-webkit-overflow-scrolling:touch}
.ansicht-kopf{position:sticky;top:0;display:flex;gap:8px;align-items:center;padding:10px 12px;background:#111;border-bottom:2px solid var(--akzent)}
.ansicht-kopf b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ansichtInhalt{padding:8px}
#ansichtInhalt .tabelle{overflow:auto;-webkit-overflow-scrolling:touch;background:#fff;color:#111;border-radius:6px;margin-bottom:12px}
#ansichtInhalt .tabelle table{border-collapse:collapse;font-size:12px;width:auto;min-width:100%}
#ansichtInhalt .tabelle td{border:1px solid #ccc;padding:3px 6px;text-align:left;white-space:nowrap;color:#111}
#ansichtInhalt .tabelle td:empty{min-width:14px}
#ansichtInhalt .blattname{color:var(--text);margin:8px 0 4px}
#ansichtInhalt img,#ansichtInhalt canvas{display:block;width:100%;height:auto;margin:0 auto 8px;background:#fff}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:24px}
.versteckt{display:none !important}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="kopf">
    <h1><img src="bilder/logo-96.png" alt=""><span aria-label="Millebéier">Milleb<span class="akz">e</span>ier</span></h1>
    <div id="sync"></div>
    <button class="zahnrad" id="zahnrad" aria-label="Astellungen">⚙️</button>
  </div>
  <nav id="nav">
    <button data-tab="bestand">Stock</button>
    <button data-tab="verkaufen">Verkafen</button>
    <button data-tab="livraisons">Livraisons</button>
    <button data-tab="offen">Ausstoend</button>
    <button data-tab="uebersicht">Iwwersiicht</button>
    <button data-tab="verlauf">Verlaf</button>
  </nav>
  <button id="neu" class="versteckt"></button>
</div></header>

<main class="wrap">
  <section id="t-start" class="versteckt"></section>
  <section id="t-uebersicht" class="versteckt"></section>
  <section id="t-verkaufen" class="versteckt"><div id="vForm"></div></section>
  <section id="t-livraisons" class="versteckt"><div id="lListe"></div><div id="lForm"></div></section>
  <section id="t-offen" class="versteckt"></section>
  <section id="t-bestand" class="versteckt"><div id="bTabelle"></div><div id="bForm"></div><div id="bBiere"></div></section>
  <section id="t-verlauf" class="versteckt"></section>
  <section id="t-einst" class="versteckt"></section>
  <footer id="fuss"></footer>
</main>
<datalist id="kaeuferListe"></datalist>
<input type="file" id="dateiWahl" class="versteckt">
<div id="frageWahl" class="versteckt"><div class="card"><h2 id="frageTitel"></h2><div id="frageText" class="hinweis" style="margin:0 0 10px;white-space:pre-line"></div>
  <div id="frageKnoepfe"></div>
  <button class="haupt" id="frageZu" style="background:var(--card2);color:var(--text)">Ofbriechen</button></div></div>
<div id="zahlWahl" class="versteckt"><div class="card"><h2 id="zahlTitel"></h2>
  <div class="seg zahl"></div>
  <button class="haupt" id="zahlZu" style="background:var(--card2);color:var(--text)">Ofbriechen</button></div></div>
<div id="ansicht" class="versteckt"><div class="ansicht-kopf"><b id="ansichtName"></b>
  <button class="knopf" id="ansichtTeilen">⬆️ Deelen</button><button class="knopf rot" id="ansichtZu" aria-label="Zoumaachen">✕</button></div>
  <div id="ansichtInhalt"></div></div>

<script>
/* Adresse des Cloudflare-Workers. Leer = Probe-Modus (alles nur auf diesem Handy). */
const WORKER_URL = "https://millebeier.rjtp6r9s9h.workers.dev/";
const FASSUNG = "14.11.2026 t";

/* === Logik === (kein DOM; test/logik.mjs schneidet diesen Block aus) */
const LAGER = "Lager";
const STANDARD = {
  sorten: [{ name: "NEIPA", preis: 3 }, { name: "White IPA", preis: 3 }, { name: "Brown Porter", preis: 3 }],
  leute: ["Jeff", "Marc", "Claude", "Laurent"],
};
const GRUENDE = { getrunken: "selwer gedronk", verschenkt: "verschenkt / Prouf", kaputt: "futti", sonst: "soss eppes" };
const ARTEN = ["abfuellung", "bewegung", "abgang", "verkauf", "zahlung", "einstellungen", "storno", "livraison", "rechnung", "bier", "bierstatus", "datei"];
/* Gebinde: Fässer sind kein eigenes Bier, sondern „<Bier> Keg 20l“ / „<Bier> Keg 30l“ als Schlüssel im Bestand
   (so hießen die Fass-Biere vorher schon — Altbestand ordnet sich damit von selbst seinem Bier zu). */
const FAESSER = [{ l: 20, std: 150 }, { l: 30, std: 180 }];
const fassKey = (bier, l) => `${bier} Keg ${l}l`;
const zerlege = key => { const m = /^(.*) Keg (20|30)l$/.exec(key); return m ? { bier: m[1], l: +m[2] } : { bier: key, l: 0 }; };
const istFass = key => zerlege(key).l > 0;
const gebindeText = key => { const l = zerlege(key).l; return l ? `Fass ${l} l` : "Fläsch"; };
const ZAHLARTEN = { wero: "WERO", sumup: "SumUp", bank: "Iwwerweisung", bar: "Bar" };
const ZAHLBILD = { wero: "bilder/zahl-wero.jpg", sumup: "bilder/zahl-sumup.png", bank: "bilder/zahl-bank.png", bar: "bilder/zahl-bar.jpg" }; // vom Nutzer, 14.11.2026
const FELDER = { etikett: "Etikett", rezept: "Rezept", protokoll: "Brauprotokoll", anner: "Aner Dateien" };

const ganz = n => Number.isInteger(n) && n > 0 && n <= 100000;
const geld = x => typeof x === "number" && isFinite(x) && x >= 0 && x <= 1000000;
const text = (s, max = 60) => typeof s === "string" && s.trim().length > 0 && s.length <= max;
const runde = x => Math.round(x * 100) / 100;

function euro(x) {
  const r = runde(x || 0);
  return (Number.isInteger(r) ? String(r) : r.toFixed(2).replace(".", ",")) + " €";
}

const optDatum = d => d === undefined || d === "" || (typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d));
const optZahl = (x, a, b) => x === undefined || x === null || (typeof x === "number" && isFinite(x) && x >= a && x <= b);
const optText = (t, m) => t === undefined || (typeof t === "string" && t.length <= m);
const postenOk = p => Array.isArray(p) && p.length > 0 && p.length <= 30 && p.every(x => x && text(x.sorte) && ganz(x.n));

function gueltig(e) {
  if (!e || typeof e !== "object" || typeof e.id !== "string" || typeof e.zeit !== "number") return false;
  switch (e.art) {
    case "abfuellung": return text(e.sorte) && ganz(e.n);
    case "bewegung": return text(e.sorte) && ganz(e.n) && text(e.von) && text(e.an) && e.von !== e.an;
    case "abgang": return text(e.sorte) && ganz(e.n) && text(e.wer) && e.grund in GRUENDE && optText(e.notiz, 300);
    case "verkauf":
      return text(e.verkaeufer) && text(e.kaeufer) && geld(e.betrag) && postenOk(e.posten) &&
        (e.aus === undefined || text(e.aus)) && (e.liv === undefined || typeof e.liv === "string") &&
        optText(e.notiz, 300) && optDatum(e.datum) && (e.alt === undefined || typeof e.alt === "boolean");
    case "livraison":
      return text(e.kunde) && text(e.kontakt, 30) && text(e.aus, 30) && geld(e.betrag) && postenOk(e.posten) &&
        typeof e.datum === "string" && /^\d{4}-\d{2}-\d{2}$/.test(e.datum) &&
        (e.anlass === undefined || e.anlass === "" || text(e.anlass, 80)) &&
        (e.notiz === undefined || (typeof e.notiz === "string" && e.notiz.length <= 300));
    case "rechnung": return typeof e.ref === "string";
    case "bier":
      return text(e.name, 30) && e.name !== LAGER && geld(e.preis) && optDatum(e.braudatum) && optDatum(e.mhd) &&
        optZahl(e.alk, 0, 30) && optZahl(e.liter, 0, 100000) && optText(e.stil, 40) && optText(e.notiz, 300) &&
        (e.preis20 === undefined || geld(e.preis20)) && (e.preis30 === undefined || geld(e.preis30));
    case "bierstatus": return text(e.name, 30) && ["aktiv", "archiv", "weg"].includes(e.status);
    case "datei":
      return typeof e.fid === "string" && /^[A-Za-z0-9_-]{8,80}$/.test(e.fid) && text(e.name, 120) && optText(e.typ, 100) &&
        Number.isInteger(e.groesse) && e.groesse > 0 && Number.isInteger(e.teile) && e.teile >= 1 && e.teile <= 200 &&
        typeof e.bier === "string" && e.bier.length <= 30 && e.feld in FELDER;
    case "zahlung": return typeof e.ref === "string" && geld(e.betrag) && e.betrag > 0 && (e.wie === undefined || e.wie in ZAHLARTEN);
    case "einstellungen":
      return Array.isArray(e.sorten) && e.sorten.length > 0 && e.sorten.length <= 30 &&
        e.sorten.every(s => s && text(s.name, 30) && geld(s.preis)) &&
        Array.isArray(e.leute) && e.leute.length > 0 && e.leute.length <= 30 && e.leute.every(p => text(p, 30) && p !== LAGER);
    case "storno": return typeof e.ref === "string";
  }
  return false;
}

const ordnung = (a, b) => a.zeit - b.zeit || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);

/* Rechnet aus allen Einträgen den Stand. Nichts wird gespeichert außer den Einträgen selbst. */
function rechne(eintraege) {
  const gesehen = new Set();
  const liste = [];
  for (const e of eintraege || []) {
    if (!gueltig(e) || gesehen.has(e.id)) continue;
    gesehen.add(e.id); liste.push(e);
  }
  liste.sort(ordnung);
  const nachId = new Map(liste.map(e => [e.id, e]));
  // Rückgängig nur für echte Einträge, nie für ein Rückgängig selbst.
  const storniert = new Map();
  for (const e of liste) {
    const ziel = e.art === "storno" && nachId.get(e.ref);
    if (ziel && ziel.art !== "storno" && !storniert.has(ziel.id)) storniert.set(ziel.id, e);
  }
  const aktiv = liste.filter(e => e.art !== "storno" && !storniert.has(e.id));

  let cfg = { sorten: STANDARD.sorten.map(s => ({ ...s })), leute: [...STANDARD.leute] };
  for (const e of aktiv) if (e.art === "einstellungen")
    cfg = { sorten: e.sorten.map(s => ({ name: s.name.trim(), preis: runde(s.preis), aus: !!s.aus })), leute: e.leute.map(p => p.trim()) };

  // Biere mit Eigenschaften (seit 14.11.2026). Die Liste aus den Einstellungen bleibt die Grundlage
  // (Altbestand); ein „bier“-Eintrag fügt ein Bier hinzu oder ergänzt Preis und Eigenschaften.
  // Status: archiv = nicht mehr zu verkaufen, bleibt in Iwwersiicht/Excel; weg = verschwindet überall
  // (Verkäufe bleiben im Verlauf und in der Kasse). Ein neuer „bier“-Eintrag holt ein gelöschtes zurück.
  const basisSorten = cfg.sorten.map(x => ({ ...x }));
  const biere = new Map(), status = new Map();
  for (const e of aktiv) {
    if (e.art === "bier") {
      biere.set(e.name, { name: e.name, preis: runde(e.preis), stil: e.stil || "", braudatum: e.braudatum || "", alk: e.alk ?? null,
        liter: e.liter ?? null, mhd: e.mhd || "", notiz: e.notiz || "", id: e.id, zeit: e.zeit,
        preis20: e.preis20 ?? null, preis30: e.preis30 ?? null });
      if (status.get(e.name) === "weg") status.delete(e.name);
    } else if (e.art === "bierstatus") status.set(e.name, e.status);
  }
  const sl = cfg.sorten.filter(x => !istFass(x.name)).map(x => ({ ...x }));
  const altFass = []; // früher als eigenes Bier angelegte Fässer („Rusty Keg 30l“): nur ihr Preis zählt, fürs Bier
  for (const b of biere.values()) {
    if (istFass(b.name)) { altFass.push(b); continue; }
    const x = sl.find(y => y.name === b.name); if (x) x.preis = b.preis; else sl.push({ name: b.name, preis: b.preis });
  }
  for (const x of sl) {
    const m = biere.get(x.name) || {};
    for (const F of FAESSER) {
      const alt = altFass.find(b => zerlege(b.name).bier === x.name && zerlege(b.name).l === F.l);
      x["preis" + F.l] = m["preis" + F.l] != null ? m["preis" + F.l] : alt ? alt.preis : F.std;
    }
  }
  for (const x of sl) {
    x.meta = biere.get(x.name) || null;
    const stt = status.get(x.name);
    if (stt === "archiv" || (x.aus && stt !== "aktiv")) { x.aus = true; x.archiv = true; }
    if (stt === "aktiv") { x.aus = false; x.archiv = false; }
    if (stt === "weg") x.weg = true;
  }
  const geloescht = new Set(sl.filter(x => x.weg).flatMap(x => [x.name, ...FAESSER.map(F => fassKey(x.name, F.l))]));
  BRAUDATEN = new Map(sl.filter(x => x.meta && x.meta.braudatum).map(x => [x.name, x.meta.braudatum]));
  cfg = { ...cfg, sorten: sl.filter(x => !x.weg) };

  const bestand = {};
  const add = (h, s, n) => { (bestand[h] ||= {}); bestand[h][s] = (bestand[h][s] || 0) + n; };
  const sorten = {};
  const st = s => (sorten[s] ||= { abgefuellt: 0, verkauft: 0, abgang: 0, da: 0 });
  for (const s of cfg.sorten) st(s.name);
  const personen = {};
  const pe = p => (personen[p] ||= { verkauft: 0, umsatz: 0, bezahlt: 0, offen: 0 });
  for (const p of cfg.leute) pe(p);
  const vk = new Map(), altVk = [];

  for (const e of aktiv) {
    if (e.art === "abfuellung") { add(LAGER, e.sorte, e.n); st(e.sorte).abgefuellt += e.n; }
    else if (e.art === "bewegung") { add(e.von, e.sorte, -e.n); add(e.an, e.sorte, e.n); st(e.sorte); }
    else if (e.art === "abgang") { add(e.wer, e.sorte, -e.n); st(e.sorte).abgang += e.n; }
    else if (e.art === "verkauf") {
      let n = 0;
      // Flaschen kommen von „aus“ (z. B. Lager bei einer Livraison), sonst vom Verkäufer selbst.
      for (const p of e.posten) { add(e.aus || e.verkaeufer, p.sorte, -p.n); st(p.sorte).verkauft += p.n; n += p.n; }
      // Alte Verkäufe aus der Excel-Tabelle (alt: true, vom Nutzer 14.11.2026: „gar nicht in die Kasse“):
      // zählen im Bestand und in der Liste pro Bier, nie in Kasse, Ausstoend oder Umsatz je Person.
      if (e.alt) { altVk.push({ ...e, flaschen: n }); continue; }
      vk.set(e.id, { ...e, flaschen: n, bezahlt: 0, offen: 0 });
      // Je Person: Flaschen und Fässer getrennt zählen (nie zusammen in einer Zahl).
      const P = pe(e.verkaeufer); P.umsatz += e.betrag;
      for (const p of e.posten) if (istFass(p.sorte)) P.faesser = (P.faesser || 0) + p.n; else P.verkauft += p.n;
    }
  }
  // Livraisons: geplant, bis ein (nicht rückgängig gemachter) Verkauf mit liv = ihre id existiert.
  const liv = new Map();
  for (const e of aktiv) if (e.art === "livraison") { liv.set(e.id, { ...e, verkauf: null }); for (const p of e.posten) st(p.sorte); }
  for (const v of vk.values()) if (v.liv && liv.has(v.liv)) { liv.get(v.liv).verkauf = v; v.livraison = liv.get(v.liv); }
  for (const e of aktiv) if (e.art === "rechnung" && vk.has(e.ref)) vk.get(e.ref).rechnungGemacht = true;
  let kasse = 0;
  for (const e of aktiv) if (e.art === "zahlung") {
    const v = vk.get(e.ref);
    if (!v) continue; // Verkauf rückgängig gemacht → Zahlung zählt nicht mehr
    v.bezahlt = runde(v.bezahlt + e.betrag);
    if (e.wie) (v.wie ||= []).includes(e.wie) || v.wie.push(e.wie);
    kasse = runde(kasse + e.betrag);
  }
  let offen = 0;
  const kaeufer = new Map();
  for (const v of vk.values()) {
    v.offen = runde(Math.max(0, v.betrag - v.bezahlt));
    offen = runde(offen + v.offen);
    const P = pe(v.verkaeufer); P.bezahlt = runde(P.bezahlt + Math.min(v.bezahlt, v.betrag)); P.offen = runde(P.offen + v.offen);
    const k = v.kaeufer.trim();
    const K = kaeufer.get(k.toLowerCase()) || { name: k, offen: 0, verkaeufe: [] };
    K.offen = runde(K.offen + v.offen); K.verkaeufe.push(v);
    kaeufer.set(k.toLowerCase(), K);
  }
  for (const h in bestand) for (const s in bestand[h]) st(s).da += bestand[h][s];

  const halter = [LAGER, ...cfg.leute];
  for (const h in bestand) if (!halter.includes(h) && Object.values(bestand[h]).some(n => n !== 0)) halter.push(h);
  // sortenNamen = Biere (Flaschen-Schlüssel). Fässer hängen am Bier: fassNamen(bier).
  const sortenNamen = [...cfg.sorten.map(s => s.name), ...Object.keys(sorten).filter(s => !istFass(s) && !cfg.sorten.some(c => c.name === s) && !geloescht.has(s))];
  for (const k of Object.keys(sorten)) if (istFass(k) && !geloescht.has(k) && !sortenNamen.includes(zerlege(k).bier)) sortenNamen.push(zerlege(k).bier);
  for (const s of sortenNamen) st(s);
  const summe = f => sortenNamen.reduce((a, s) => a + sorten[s][f], 0);
  // Reserviert: geplante Livraisons belegen den Bestand dort, wo sie herkommen (vom Nutzer, 14.11.2026).
  const reserviert = {};
  for (const L of liv.values()) if (!L.verkauf) for (const p of L.posten) {
    (reserviert[L.aus] ||= {}); reserviert[L.aus][p.sorte] = (reserviert[L.aus][p.sorte] || 0) + p.n;
  }
  const kasseNach = {};
  for (const e of aktiv) if (e.art === "zahlung" && vk.has(e.ref)) kasseNach[e.wie || "?"] = runde((kasseNach[e.wie || "?"] || 0) + e.betrag);

  return {
    reserviert, kasseNach, cfg, basisSorten, geloescht, liste, aktiv, storniert, nachId, bestand, halter, sorten, sortenNamen, personen,
    verkaeufe: [...vk.values()],
    altVerkaeufe: altVk,
    vkNachId: vk,
    livraisons: [...liv.values()].sort((a, b) => a.datum.localeCompare(b.datum) || ordnung(a, b)),
    dateien: aktiv.filter(e => e.art === "datei"),
    kaeufer: [...kaeufer.values()].sort((a, b) => b.offen - a.offen || a.name.localeCompare(b.name, "de")),
    kasse, offen,
    umsatz: runde([...vk.values()].reduce((a, v) => a + v.betrag, 0)),
    flaschen: { abgefuellt: summe("abgefuellt"), verkauft: summe("verkauft"), abgang: summe("abgang"), da: summe("da") },
  };
}

/* Luxemburgisch steht vor Namen ein Artikel. Die Verkäufer sind Männer → „de“/„beim“; Käufer (Geschlecht
   unbekannt) bekommen keinen, die Sätze sind dort ohne Artikel gebaut. */
const de = h => h === LAGER ? "d'Lager" : "de " + h;
const beim = h => h === LAGER ? "am Lager" : "beim " + h;
const hat = (Z, wer, sorte) => (Z.bestand[wer] && Z.bestand[wer][sorte]) || 0;
const reserviertBei = (Z, wer, sorte) => (Z.reserviert[wer] && Z.reserviert[wer][sorte]) || 0;
const frei = (Z, wer, sorte) => hat(Z, wer, sorte) - reserviertBei(Z, wer, sorte);
const preisVon = (cfg, key) => {
  const { bier, l } = zerlege(key);
  const s = cfg.sorten.find(x => x.name === bier);
  if (!s) return l ? FAESSER.find(F => F.l === l).std : 0;
  return l ? s["preis" + l] : s.preis;
};
/* Schlüssel eines Biers: Flaschen immer, Fässer nur, wenn es sie gibt oder gab. */
const fassNamen = (Z, bier) => FAESSER.map(F => fassKey(bier, F.l)).filter(k => Z.sorten[k] && (Z.sorten[k].abgefuellt || Z.sorten[k].da || Z.sorten[k].verkauft || Z.sorten[k].abgang || Z.halter.some(h => reserviertBei(Z, h, k))));
const artikelVon = (Z, bier) => [bier, ...fassNamen(Z, bier)];
/* Was eine Menge braucht und was fehlt: [{sorte, n, frei}] für alle Posten mit n > frei. */
const zuWenig = (Z, wer, posten) => posten.map(p => ({ ...p, frei: frei(Z, wer, p.sorte), hat: hat(Z, wer, p.sorte), res: reserviertBei(Z, wer, p.sorte) })).filter(p => p.n > p.frei);
/* Name mit Braudatum in Klammern (vom Nutzer, Fassung r): „NEIPA (28.07.2026)“. Neue Biere tragen das Datum schon im
   Namen; ältere bekommen es nur angezeigt. Namen, die schon ein Datum oder „MM/JJJJ“ enthalten, bleiben wie sie sind. */
let BRAUDATEN = new Map();
const hatDatum = n => /\(\d{1,2}\.\d{1,2}\.\d{4}\)|\d{2}\/\d{4}/.test(n);
// Angezeigt wird immer das aktuelle Braudatum: steht schon ein (älteres) Datum im Namen, wird es in der Anzeige
// ersetzt — der Name selbst (Schlüssel des Bestands) bleibt unverändert. „MM/JJJJ“-Namen (alter Import) bleiben.
const bierText = name => {
  const d = BRAUDATEN.get(name);
  if (!d || /\d{2}\/\d{4}/.test(name)) return name;
  return `${name.replace(/ \(\d{1,2}\.\d{1,2}\.\d{4}\)$/, "")} (${datumLang(d)})`;
};
const datumLang = d => { const [j, m, t] = d.split("-"); return `${t}.${m}.${j}`; };
const artikelText = key => istFass(key) ? `${bierText(zerlege(key).bier)} (Fass ${zerlege(key).l} l)` : bierText(key);
const postenText = posten => posten.map(p => `${p.n} × ${artikelText(p.sorte)}`).join(", ");

function beschreibe(e, Z) {
  switch (e.art) {
    case "abfuellung": return `🍺 ${e.n} × ${artikelText(e.sorte)} ofgefëllt (an d'Lager)`;
    case "bewegung": return `➡️ ${e.n} × ${artikelText(e.sorte)}: ${e.von} → ${e.an}`;
    case "abgang": return `🗑️ ${e.n} × ${artikelText(e.sorte)} ${beim(e.wer)}: ${GRUENDE[e.grund]}`;
    case "verkauf": return `${e.alt ? "📜 Al Tabell:" : e.liv ? "🚚 Geliwwert" : "💶"} ${e.verkaeufer} → ${e.kaeufer}: ${postenText(e.posten)} · ${euro(e.betrag)}`;
    case "zahlung": {
      const v = Z && Z.nachId.get(e.ref);
      return `✓ ${euro(e.betrag)} bezuelt${e.wie ? " per " + ZAHLARTEN[e.wie] : ""}` + (v ? `: ${v.kaeufer} (${beim(v.verkaeufer)})` : "");
    }
    case "livraison": return `🚚 Livraison geplangt: ${e.kunde}, ${postenText(e.posten)}, ${datumKurz(e.datum)} · ${euro(e.betrag)}`;
    case "rechnung": {
      const v = Z && Z.nachId.get(e.ref);
      return "🧾 Rechnung gemaach" + (v ? `: ${v.kaeufer}` : "");
    }
    case "bier": return `🍺 Béier: ${e.name}` + [e.stil, e.alk != null ? String(e.alk).replace(".", ",") + " %" : "", euro(e.preis), e.braudatum ? "gebraut " + datumKurz(e.braudatum) : ""].filter(Boolean).map(x => " · " + x).join("");
    case "bierstatus": return { archiv: "📦 Archivéiert: ", aktiv: "↩️ Aus dem Archiv zréck: ", weg: "✕ Béier geläscht: " }[e.status] + e.name;
    case "datei": return `📎 ${FELDER[e.feld]}${e.bier ? " · " + e.bier : ""}: ${e.name}`;
    case "einstellungen": return `⚙️ Zorten/Präisser/Leit geännert: ${e.sorten.filter(s => !s.aus).map(s => `${s.name} ${euro(s.preis)}`).join(", ")}`;
    case "storno": {
      const z = Z && Z.nachId.get(e.ref);
      return "✕ Geläscht: " + (z ? beschreibe(z, Z) : "?");
    }
  }
  return "?";
}

/* Teilbetrag auf die ältesten offenen Verkäufe verteilen. */
function verteile(verkaeufe, betrag) {
  const out = [];
  let rest = runde(betrag);
  for (const v of [...verkaeufe].sort(ordnung)) {
    if (rest <= 0) break;
    if (v.offen <= 0) continue;
    const b = runde(Math.min(rest, v.offen));
    out.push({ art: "zahlung", ref: v.id, betrag: b });
    rest = runde(rest - b);
  }
  return { zahlungen: out, rest };
}

function erinnerung(K) {
  const offene = K.verkaeufe.filter(v => v.offen > 0);
  const posten = {};
  for (const v of offene) for (const p of v.posten) posten[p.sorte] = (posten[p.sorte] || 0) + p.n;
  const was = Object.entries(posten).map(([s, n]) => `${n}x ${s}`).join(", ");
  return `Moien ${K.name}, vir den Millebéier (${was}) stinn nach ${euro(K.offen)} op. Merci & Prost! 🍺`;
}

function csv(Z, zeitText) {
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  const zeilen = [["Datum", "Verkeefer", "Keefer", ...Z.sortenNamen, "Fläschen", "Betrag", "Bezuelt", "Op"].map(q).join(";")];
  for (const v of [...Z.verkaeufe].sort(ordnung)) {
    const n = Z.sortenNamen.map(s => v.posten.filter(p => p.sorte === s).reduce((a, p) => a + p.n, 0));
    zeilen.push([zeitText(v.zeit), v.verkaeufer, v.kaeufer, ...n, v.flaschen,
      String(v.betrag).replace(".", ","), String(v.bezahlt).replace(".", ","), String(v.offen).replace(".", ",")].map(q).join(";"));
  }
  return "﻿" + zeilen.join("\r\n") + "\r\n";
}

const datumKurz = d => { const [j, m, t] = d.split("-"); return `${+t}.${+m}.${j}`; };

/* Dateien eines Biers (bier "" = allgemein): je festes Feld die neueste, „anner“ alle (neueste zuerst). */
function dateienVon(Z, bier) {
  const d = Z.dateien.filter(x => x.bier === bier);
  const out = { anner: d.filter(x => x.feld === "anner").reverse() };
  for (const f of ["etikett", "rezept", "protokoll"]) out[f] = d.filter(x => x.feld === f).pop() || null;
  out.anzahl = ["etikett", "rezept", "protokoll"].filter(f => out[f]).length + out.anner.length;
  return out;
}
const groesseText = b => b < 1024 * 1024 ? Math.max(1, Math.round(b / 1024)) + " KB" : (b / 1048576).toFixed(1).replace(".", ",") + " MB";

/* Anteil eines Postens am Betrag (gewichtet nach Listenpreis; ohne Preise nach Flaschen). */
function anteil(cfg, posten, betrag, p) {
  const w = x => x.n * preisVon(cfg, x.sorte);
  const summe = posten.reduce((a, x) => a + w(x), 0);
  if (summe > 0) return runde(betrag * w(p) / summe);
  const n = posten.reduce((a, x) => a + x.n, 0);
  return n ? runde(betrag * p.n / n) : 0;
}
// Zahlungsart eigens (vom Nutzer: in Iwwersiicht und Excel muss klar stehen, wie bezahlt wurde)
const wieListe = v => v && v.wie && v.wie.length ? v.wie.map(w => ZAHLARTEN[w]).join(", ") : "";
const bezahltText = v => v.offen <= 0 ? "Jo" : v.bezahlt > 0 ? `Deelweis (${euro(v.offen)} op)` : "Nee";

/* Alle Zeilen einer Sorte, wie ein Blatt in der alten Excel-Tabelle: wer hat was wem verkauft. */
function proSorte(Z, sorte) {
  // Ein Bier mit seinen Fässern; jede Zeile sagt, ob Flaschen oder Fass (geb).
  const keys = new Set(artikelVon(Z, sorte));
  const zeilen = [];
  for (const v of Z.verkaeufe) for (const p of v.posten) if (keys.has(p.sorte)) {
    const r = anteil(Z.cfg, v.posten, v.betrag, p);
    const L = v.livraison;
    zeilen.push({ geb: gebindeText(p.sorte), zeit: v.zeit, datum: L ? L.datum : null, kunde: v.kaeufer, kontakt: v.verkaeufer, n: p.n,
      preis: runde(r / p.n), recetten: r, geliwwert: "Jo", bezuelt: bezahltText(v), wie: wieListe(v) || (v.bezahlt > 0 ? "ouni Aart" : ""),
      rechnung: L && L.rechnung ? (v.rechnungGemacht ? "gemaach" : "nach ze maachen") : "",
      remarque: L ? [L.anlass, L.notiz].filter(Boolean).join(" · ") : "", id: v.id });
  }
  for (const v of Z.altVerkaeufe) for (const p of v.posten) if (keys.has(p.sorte)) {
    const r = anteil(Z.cfg, v.posten, v.betrag, p);
    zeilen.push({ geb: gebindeText(p.sorte), zeit: v.zeit, datum: v.datum || null, kunde: v.kaeufer, kontakt: v.verkaeufer, n: p.n, preis: runde(r / p.n), recetten: r,
      geliwwert: "Jo", bezuelt: "–", rechnung: "", remarque: v.notiz || "", id: v.id, alt: true });
  }
  for (const e of Z.aktiv) if (e.art === "abgang" && keys.has(e.sorte))
    zeilen.push({ geb: gebindeText(e.sorte), zeit: e.zeit, datum: e.datum || null, kunde: GRUENDE[e.grund], kontakt: e.wer, n: e.n, preis: 0, recetten: 0,
      geliwwert: "–", bezuelt: "–", rechnung: "", remarque: e.notiz || "", id: e.id, alt: e.durch === "Excel-Import" });
  for (const L of Z.livraisons) if (!L.verkauf) for (const p of L.posten) if (keys.has(p.sorte)) {
    const r = anteil(Z.cfg, L.posten, L.betrag, p);
    zeilen.push({ geb: gebindeText(p.sorte), zeit: L.zeit, datum: L.datum, kunde: L.kunde, kontakt: L.kontakt, n: p.n, preis: runde(r / p.n), recetten: r,
      geliwwert: "geplangt " + datumKurz(L.datum), bezuelt: "–", rechnung: L.rechnung ? "nach ze maachen" : "",
      remarque: [L.anlass, L.notiz].filter(Boolean).join(" · "), id: L.id, geplant: true });
  }
  return zeilen.sort((a, b) => (a.datum ? Date.parse(a.datum) : a.zeit) - (b.datum ? Date.parse(b.datum) : b.zeit));
}

/* Tabellen für den Excel-Export: je Sorte ein Blatt wie bisher, dazu Livraisons und Stock.
   Reine Daten (Zeilen als Arrays), damit der Test ohne Excel-Bibliothek prüfen kann. */
function exportBlaetter(Z, zeitFmt) {
  const blaetter = [];
  const kopf = ["Datum", "Client", "Kontakt", "Unzuel", "Gebinde", "Präis", "Recetten", "geliwwert?", "bezuel?", "bezuelt per", "Rechnung", "Remarquen"];
  for (const s of Z.sortenNamen) {
    const z = proSorte(Z, s), x = Z.sorten[s];
    if (!z.length && !x.abgefuellt && !x.da && !(Z.cfg.sorten.find(y => y.name === s) || {}).meta) continue;
    const zeilen = z.map(r => [r.datum ? datumKurz(r.datum) : r.alt ? "" : zeitFmt(r.zeit), r.kunde, r.kontakt, r.n, r.geb, r.preis, r.recetten, r.geliwwert, r.bezuelt, r.wie || "", r.rechnung, r.remarque]);
    const fest = z.filter(r => !r.geplant), festFl = fest.filter(r => r.geb === "Fläsch");
    const c = Z.cfg.sorten.find(y => y.name === s) || {}, m = c.meta || {};
    blaetter.push({ name: bierText(s), titel: bierText(s), info: [
      [m.stil, m.braudatum ? `Braugang vum ${datumKurz(m.braudatum)}` : "", m.alk != null ? `Alk: ${String(m.alk).replace(".", ",")} %` : "",
        m.liter != null ? `Quantitéit: ${String(m.liter).replace(".", ",")} L` : "", m.mhd ? `Haltbar bis ${datumKurz(m.mhd)}` : "", c.archiv ? "ARCHIVÉIERT" : ""].filter(Boolean).join(" · "),
      `Fläschen — ofgefëllt: ${x.abgefuellt} · verkaaft: ${x.verkauft} · fort: ${x.abgang} · nach do: ${x.da}`,
      ...fassNamen(Z, s).map(k => { const y = Z.sorten[k]; return `${gebindeText(k)} — ofgefëllt: ${y.abgefuellt} · verkaaft: ${y.verkauft} · fort: ${y.abgang} · nach do: ${y.da}`; }),
      `Verkafspräis: ${euro(preisVon(Z.cfg, s))} pro Fläsch` + fassNamen(Z, s).map(k => ` · ${euro(preisVon(Z.cfg, k))} pro ${gebindeText(k)}`).join(""), m.notiz || ""].filter(Boolean),
      kopf, zeilen,
      summe: ["Total", "", "", festFl.reduce((a, r) => a + r.n, 0), "Fläschen", "", runde(fest.reduce((a, r) => a + r.recetten, 0)), "", "", "", "", "Recetten mat Fässer, ouni geplangten"] });
  }
  blaetter.push({ name: "Livraisons", titel: "Livraisons", info: [],
    kopf: ["Datum", "Client", "Kontakt", "Wat", "Betrag", "Anlass", "geliwwert?", "Rechnung", "bezuel?", "bezuelt per", "Remarquen"],
    zeilen: Z.livraisons.map(L => [datumKurz(L.datum), L.kunde, L.kontakt, postenText(L.posten), L.betrag, L.anlass || "",
      L.verkauf ? "Jo" : "geplangt", L.rechnung ? (L.verkauf && L.verkauf.rechnungGemacht ? "gemaach" : "nach ze maachen") : "",
      L.verkauf ? bezahltText(L.verkauf) : "–", L.verkauf ? wieListe(L.verkauf) : "", L.notiz || ""]), summe: null });
  const alleK = Z.sortenNamen.flatMap(s => artikelVon(Z, s));
  blaetter.push({ name: "Stock", titel: "Stock", info: ["Total = Fläschen; Fässer an hiren eegene Kolonnen."], kopf: ["", ...alleK.map(artikelText), "Total Fl."],
    zeilen: Z.halter.map(h => [h, ...alleK.map(k => hat(Z, h, k)), Z.sortenNamen.reduce((a, s) => a + hat(Z, h, s), 0)]),
    summe: ["Total", ...alleK.map(k => Z.sorten[k].da), Z.flaschen.da] });
  return blaetter;
}

function neueId() {
  if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
  return "x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
}
/* === Oberfläche === */

const SP = "millebeier_v1";              // {code, ich, tab}
const SP_DATEN = "millebeier_v1_daten";  // letzter Stand vom Server (offline lesbar)
const SP_AUSGANG = "millebeier_v1_ausgang"; // Einträge, die noch nicht beim Server sind
const SP_PROBE = "millebeier_v1_probe";  // Probe-Modus: die „Datenbank“ auf dem Handy

const lade = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch { return d; } };
const merke = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const PROBE = !WORKER_URL;

let EIN = lade(SP, {});
let SERVER = lade(SP_DATEN, []);
let AUSGANG = lade(SP_AUSGANG, []);
let Z = rechne([]);
let TAB = EIN.tab || "verkaufen";
let STATUS = { zuletzt: 0, fehler: "" };
let FORM = null, BFORM = null, EFORM = null;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TZ = "Europe/Luxembourg";
const zeitText = t => new Date(t).toLocaleString("de-LU", { timeZone: TZ, weekday: "short", day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" });
const datumText = t => new Date(t).toLocaleDateString("de-DE", { timeZone: TZ, day: "numeric", month: "numeric", year: "numeric" });

function neuRechnen() {
  const ids = new Set(SERVER.map(e => e.id));
  Z = rechne([...SERVER, ...AUSGANG.filter(e => !ids.has(e.id))]);
  document.getElementById("kaeuferListe").innerHTML = Z.kaeufer.map(k => `<option value="${esc(k.name)}">`).join("");
}

/* ---------- Server ---------- */
async function anfrage(daten) {
  if (PROBE) {
    const db = lade(SP_PROBE, []);
    if (daten.aktion === "neu") {
      const ids = new Set(db.map(e => e.id));
      for (const e of daten.eintraege) if (!ids.has(e.id)) db.push(e);
      merke(SP_PROBE, db);
    }
    return { eintraege: db };
  }
  const r = await fetch(WORKER_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ code: EIN.code, ...daten }) });
  let j = {};
  try { j = await r.json(); } catch {}
  if (!r.ok) { const f = new Error(j.fehler || `Feeler ${r.status}`); f.status = r.status; throw f; }
  return j;
}

let LAEUFT = false, ALT_NACHHOLEN = false;
async function abgleichen() {
  if (LAEUFT || !bereit()) return;
  LAEUFT = true;
  try {
    let antwort, abgelehnt = [];
    const uebernehmen = a => {
      SERVER = a.eintraege || [];
      const ids = new Set(SERVER.map(e => e.id));
      AUSGANG = AUSGANG.filter(e => !ids.has(e.id));
      merke(SP_DATEN, SERVER); merke(SP_AUSGANG, AUSGANG);
    };
    do {
      const bündel = AUSGANG.filter(e => !abgelehnt.includes(e.id)).slice(0, 50);
      if (!bündel.length) { antwort = await anfrage({ aktion: "liste" }); uebernehmen(antwort); break; }
      try { antwort = await anfrage({ aktion: "neu", eintraege: bündel }); uebernehmen(antwort); }
      catch (f) {
        if (f.status !== 400) throw f;
        // Ein Eintrag, den der Server nicht kennt (z. B. alter Worker), darf die anderen nicht aufhalten:
        // einzeln schicken, Abgelehntes bleibt im Ausgang.
        for (const e of bündel) {
          try { uebernehmen(await anfrage({ aktion: "neu", eintraege: [e] })); }
          catch (f2) { if (f2.status !== 400) throw f2; abgelehnt.push(e.id); }
        }
      }
    } while (AUSGANG.some(e => !abgelehnt.includes(e.id)));
    // Alte Verkäufe aus der Excel-Tabelle einmalig von selbst einspielen, sobald der Server-Stand bekannt ist
    // (vom Nutzer: der Knopf in ⚙️ wurde übersehen). Feste ids → nie doppelt, auch wenn alle Handys es tun.
    if (!PROBE && !window.OHNE_ALTIMPORT) {
      const ids = new Set([...SERVER, ...AUSGANG].map(e => e.id));
      const korr = altKorrekturen(ids);
      if (korr.length) { AUSGANG.push(...korr); merke(SP_AUSGANG, AUSGANG); ALT_NACHHOLEN = true; }
    }
    if (!PROBE && !window.OHNE_ALTIMPORT && !SERVER.some(e => e.id === ALT_KENNUNG) && !AUSGANG.some(e => e.id === ALT_KENNUNG)) { const ids = new Set(SERVER.map(e => e.id)); const neu = altImport().filter(e => !ids.has(e.id)); if (neu.length) { AUSGANG.push(...neu); merke(SP_AUSGANG, AUSGANG); ALT_NACHHOLEN = true; } }
    STATUS = { zuletzt: Date.now(), fehler: abgelehnt.length ? `${abgelehnt.length} Agab(en) refuséiert — Worker muss aktualiséiert ginn` : "" };
  } catch (f) {
    if (f.status === 401) { EIN.code = ""; merke(SP, EIN); STATUS.fehler = "Code stëmmt net méi"; }
    else STATUS.fehler = navigator.onLine === false ? "offline" : f.status ? (f.message || "Feeler " + f.status) : "keng Verbindung"; // Browser-Meldungen („Failed to fetch“) sind englisch
  } finally {
    LAEUFT = false;
    neuRechnen(); render();
    if (ALT_NACHHOLEN) { ALT_NACHHOLEN = false; setTimeout(abgleichen, 0); }
  }
}

/* Doppeltipp-Schutz, Stufe 2: derselbe Inhalt innerhalb von 3 s wird nicht noch einmal gespeichert. */
let LETZTER_EINTRAG = { sig: "", t: 0 };
function eintragen(teile) {
  const jetzt = Date.now();
  const sig = JSON.stringify([EIN.ich, teile]);
  if (sig === LETZTER_EINTRAG.sig && jetzt - LETZTER_EINTRAG.t < 3000) return [];
  LETZTER_EINTRAG = { sig, t: jetzt };
  const neu = teile.map((t, i) => ({ ...t, id: neueId(), zeit: jetzt + i, durch: EIN.ich }));
  AUSGANG.push(...neu);
  merke(SP_AUSGANG, AUSGANG);
  neuRechnen(); render();
  abgleichen();
  return neu;
}

/* ---------- Rendern ---------- */
const bereit = () => !!EIN.ich && (PROBE || !!EIN.code);
// iPhone-Regel: nie einen Kasten neu bauen, in dem gerade getippt wird.
function tipptIn(el) {
  const a = document.activeElement;
  return !!(a && el && el.contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName));
}

function render() {
  const tab = bereit() ? TAB : "start";

  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("an", b.dataset.tab === tab));

  $('#nav [data-tab="offen"]').innerHTML = "Ausstoend" + (nOffen ? ` <span class="badge">${nOffen}</span>` : "");
  renderSync();
  const nGeplant = Z.livraisons.filter(L => !L.verkauf).length;

  ({ start: renderStart, uebersicht: renderUebersicht, verkaufen: renderVerkaufen, offen: renderOffen, livraisons: renderLivraisons,
     bestand: renderBestand, verlauf: renderVerlauf, einst: renderEinst })[tab]();
  $("#fuss").innerHTML = `Versioun ${esc(FASSUNG)}` + (EIN.ich ? ` · Du bass ${esc(de(EIN.ich))}` : "");
}

function renderSync() {
  const el = $("#sync");
  let t = "";
  if (PROBE) t = "Prouf-Modus";
  else if (STATUS.fehler) t = "⚠️ " + STATUS.fehler;
  else if (STATUS.zuletzt) t = "✓ synchroniséiert";
  if (AUSGANG.length) t += `<br>⏳ ${AUSGANG.length} nach net geschéckt`;
  el.innerHTML = t;
  el.classList.toggle("fehler", !!STATUS.fehler || AUSGANG.length > 0);
}

/* Excel-Export: SheetJS wird erst beim Tippen geladen (cdnjs, feste Version). */
const SHEETJS = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
function sheetjsLaden() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((ok, nok) => {
    const sc = document.createElement("script");
    sc.src = SHEETJS; sc.onload = () => ok(window.XLSX); sc.onerror = () => nok(new Error("Excel-Bibliothéik net geluede (Internet?)"));
    document.head.appendChild(sc);
  });
}
async function excelExport(meldBox) {
  const meld = (art, t) => { if (meldBox) meldBox.innerHTML = `<div class="meldung ${art}">${esc(t)}</div>`; };
  try {
    meld("ok", "Excel gëtt gemaach…");
    const X = await sheetjsLaden();
    const wb = X.utils.book_new();
    const heute = new Date().toLocaleDateString("de-DE", { timeZone: TZ });
    for (const b of exportBlaetter(Z, t => new Date(t).toLocaleDateString("de-DE", { timeZone: TZ }))) {
      const aoa = [[`MILLEBÉIER – ${b.titel.toUpperCase()}`], [`Stand: ${heute}`], ...b.info.map(i => [i]), [], b.kopf, ...b.zeilen];
      if (b.summe) aoa.push([], b.summe);
      const ws = X.utils.aoa_to_sheet(aoa);
      ws["!cols"] = b.kopf.map((k, i) => ({ wch: k === "Client" || k === "Remarquen" ? 28 : k === "Wat" ? 30 : k === "bezuelt per" ? 14 : 12 }));
      ws["!merges"] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: Math.max(3, b.kopf.length - 1) } }];
      // Euro-Format für Geldspalten
      const kopfZeile = 3 + b.info.length;
      b.kopf.forEach((k, c) => {
        if (!/Präis|Recetten|Betrag/.test(k)) return;
        for (let r = kopfZeile + 1; r < aoa.length; r++) { const z = ws[X.utils.encode_cell({ r, c })]; if (z && z.t === "n") z.z = '#,##0.00 "€"'; }
      });
      // Blattnamen: max. 31 Zeichen, keine Sonderzeichen, und nie doppelt (Excel lehnt das ab)
      let blatt = b.name.replace(/[\\/?*\[\]:]/g, " ").slice(0, 31), nr = 2;
      while (wb.SheetNames.some(n => n.toLowerCase() === blatt.toLowerCase())) blatt = (b.name.replace(/[\\/?*\[\]:]/g, " ").slice(0, 26) + ` (${nr++})`);
      X.utils.book_append_sheet(wb, ws, blatt);
    }
    const daten = X.write(wb, { bookType: "xlsx", type: "array" });
    const name = `Millebeier-${new Date().toISOString().slice(0, 10)}.xlsx`;
    const datei = new File([daten], name, { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    meld("ok", "✓ " + name);
    try { if (navigator.canShare && navigator.canShare({ files: [datei] })) { await navigator.share({ files: [datei] }); return; } }
    catch (f) { if (f && f.name === "AbortError") return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(datei); a.download = name; a.click();
  } catch (f) { meld("fehler", f.message || "Excel-Export huet net geklappt."); }
}

    const meld = t => $("#lMeld").innerHTML = `<div class="meldung fehler">${esc(t)}</div>`;

    const posten = la.filter(x => F.n[x.key] > 0).map(x => ({ sorte: x.key, n: F.n[x.key] }));
    if (!kunde) return meld("Wéi heescht de Client?");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(F.datum)) return meld("Wéini? Datum feelt.");
    if (!posten.length) return meld("Wat gëtt geliwwert? Mindestens eng Fläsch.");
    const bekannt = Z.kaeufer.find(k => k.name.toLowerCase() === kunde.toLowerCase());
    const e = { art: "livraison", kunde: bekannt ? bekannt.name : kunde, kontakt: F.kontakt, aus: F.aus, datum: F.datum, posten,
      betrag: F.betrag != null ? F.betrag : lAuto(), rechnung: !!F.rechnung, anlass: F.anlass.trim(), notiz: F.notiz.trim() };
    if (!gueltig({ ...e, id: "x", zeit: 0 })) return meld("Eppes ass ze laang oder net richteg.");
    // Geplante Livraisons zählen schon (reserviert): reicht der freie Rest nicht, warnen (vom Nutzer, 14.11.2026).
    const fehlt = zuWenig(Z, F.aus, posten);
    if (fehlt.length && !confirm(`⚠️ Net genuch fräi:\n\n${fehltText(F.aus, fehlt)}\n\nTrotzdeem plangen?`)) return;
    if (document.activeElement) document.activeElement.blur();
    const neu = eintragen([e]);
    if (!neu.length) return;
    L_NEU = false; LFORM = { meldung: `✓ Geplangt: ${e.kunde}, ${datumKurz(e.datum)}, ${postenText(posten)}` };
    renderLForm();
  };
}

/* ---------- Verkaufen ---------- */
function leeresFormular() {
  return { verkaeufer: EIN.ich, kaeufer: "", n: {}, betrag: null, wie: null, meldung: FORM && FORM.meldung };
}
function vSorten() { return Z.cfg.sorten.filter(s => !s.aus); }
/* Was man verkaufen/liefern kann: je Bier die Flaschen, Fässer nur, wenn der Halter welche hat (oder schon gewählt). */
function artikelListe(wer, gewaehlt) {
  const fass = s => FAESSER.map(F => fassKey(s.name, F.l)).filter(k => hat(Z, wer, k) > 0 || (gewaehlt && gewaehlt[k] > 0))
    .map(k => ({ key: k, label: `${bierText(s.name)} · Fass ${zerlege(k).l} l`, preis: preisVon(Z.cfg, k), fass: true }));
  return [...vSorten().flatMap(s => [{ key: s.name, label: bierText(s.name), preis: s.preis }, ...fass(s)]),
    // Fässer archivierter Biere bleiben aktuell, solange jemand welche hat (vom Nutzer, Fassung n)
    ...Z.cfg.sorten.filter(s => s.archiv).flatMap(fass)];
}
const vArtikel = () => artikelListe(FORM.verkaeufer, FORM.n);
function vAutoBetrag() { return runde(vArtikel().reduce((a, x) => a + (FORM.n[x.key] || 0) * x.preis, 0)); }
function vFlaschen() { return vArtikel().filter(x => !x.fass).reduce((a, x) => a + (FORM.n[x.key] || 0), 0); }
const u0 = h => h === LAGER ? "vum Lager" : "vum " + h;
const zahlInhalt = k => `<img src="${ZAHLBILD[k]}" alt=""><span>${ZAHLARTEN[k]}</span>`;
function zahlKnoepfe(gewaehlt, mitSpaeter) {
  return `<div class="seg zahl">${Object.entries(ZAHLARTEN).map(([k, t]) => `<button data-bez="${k}" class="zbtn ${gewaehlt === k ? "an gruen" : ""}">${zahlInhalt(k)}</button>`).join("")}
    ${mitSpaeter ? `<button data-bez="spaeter" class="breit ${gewaehlt === "spaeter" ? "an gelb" : ""}">Bezillt méi spéit</button>` : ""}</div>`;
}
const fehltText = (wer, liste) => liste.map(p => `${p.n} × ${artikelText(p.sorte)}: ${de(wer)} huet ${p.hat}` + (p.res ? `, dovun ${p.res} reservéiert fir Livraisons → fräi ${Math.max(0, p.frei)}` : "")).join("\n");

function renderVerkaufen(egal) {
  if (!FORM) FORM = leeresFormular();
  const box = $("#vForm");
  if (!egal && tipptIn(box)) { vHinweise(); return; }
  const leute = Z.cfg.leute.includes(FORM.verkaeufer) ? Z.cfg.leute : [...Z.cfg.leute, FORM.verkaeufer];
  const art = vArtikel();
  box.innerHTML = `<div class="card">
    <h2>Verkaf androen</h2>
    <label for="vVerk">Wien verkeeft?</label>
    <select id="vVerk">${leute.map(p => `<option ${p === FORM.verkaeufer ? "selected" : ""}>${esc(p)}</option>`).join("")}</select>
    <label for="vKaeufer">Un wien?</label>
    <input id="vKaeufer" list="kaeuferListe" autocomplete="off" autocapitalize="words" placeholder="Numm vum Keefer" value="${esc(FORM.kaeufer)}">
    <label>Wéi vill?</label>
    ${art.map((x, i) => `<div class="posten">
      <div class="pn"><b>${esc(x.label)}</b><small class="muted" id="vHat${i}"></small></div>
      <div class="stepper"><button data-minus="${i}" aria-label="manner">−</button>
        <input id="vN${i}" data-i="${i}" inputmode="numeric" pattern="[0-9]*" value="${FORM.n[x.key] || ""}" placeholder="0">
        <button data-plus="${i}" aria-label="méi">+</button></div></div>`).join("")}
    <label for="vBetrag">Betrag (€)</label>
    <div class="zeile"><input id="vBetrag" inputmode="decimal" value="${FORM.betrag != null ? String(FORM.betrag).replace(".", ",") : (vAutoBetrag() ? String(vAutoBetrag()).replace(".", ",") : "")}" placeholder="0">
      <small class="muted" id="vAuto" style="flex:1.4"></small></div>
    <label>Bezuelt?</label>
    ${zahlKnoepfe(FORM.wie, true)}
    <button class="haupt" id="vSpeichern">Verkaf androen</button>
    <div id="vMeldung">${FORM.meldung ? `<div class="meldung ${FORM.meldung.art}">${esc(FORM.meldung.text)}</div>` : ""}</div>
  </div>`;
  vHinweise();

  $("#vVerk").onchange = e => { FORM.verkaeufer = e.target.value; e.target.blur(); renderVerkaufen(true); };
  $("#vKaeufer").oninput = e => { FORM.kaeufer = e.target.value; };
  const setzeN = (i, n) => {
    const x = art[i]; FORM.n[x.key] = Math.max(0, Math.min(9999, n | 0));
    const inp = $("#vN" + i); if (document.activeElement !== inp) inp.value = FORM.n[x.key] || "";
    vHinweise();
  };
  box.querySelectorAll("[data-plus]").forEach(b => b.onclick = () => setzeN(+b.dataset.plus, (FORM.n[art[+b.dataset.plus].key] || 0) + 1));
  box.querySelectorAll("[data-minus]").forEach(b => b.onclick = () => setzeN(+b.dataset.minus, (FORM.n[art[+b.dataset.minus].key] || 0) - 1));
  box.querySelectorAll("[data-i]").forEach(inp => inp.oninput = () => setzeN(+inp.dataset.i, parseInt(inp.value, 10) || 0));
  $("#vBetrag").oninput = e => {
    const v = e.target.value.trim().replace(",", ".");
    FORM.betrag = v === "" ? null : (isFinite(+v) ? runde(+v) : FORM.betrag);
    vHinweise();
  };
  box.querySelectorAll("[data-bez]").forEach(b => b.onclick = () => {
    FORM.wie = b.dataset.bez;
    box.querySelectorAll("[data-bez]").forEach(x => x.classList.remove("an", "gruen", "gelb"));
    b.classList.add("an", FORM.wie === "spaeter" ? "gelb" : "gruen");
  });
  $("#vSpeichern").onclick = vSpeichern;
}

function vHinweise() {
  vArtikel().forEach((x, i) => {
    const el = $("#vHat" + i); if (!el) return;
    const n = hat(Z, FORM.verkaeufer, x.key), r = reserviertBei(Z, FORM.verkaeufer, x.key);
    el.textContent = `${euro(x.preis)} · ${de(FORM.verkaeufer)} huet nach ${n}` + (r ? ` (${r} reservéiert)` : "");
    el.style.color = (FORM.n[x.key] || 0) > n - r ? "var(--gelb)" : "";
  });
  const auto = vAutoBetrag();
  const inp = $("#vBetrag");
  if (inp && FORM.betrag == null && document.activeElement !== inp) inp.value = auto ? String(auto).replace(".", ",") : "";
  const a = $("#vAuto");
  if (a) a.textContent = FORM.betrag != null && FORM.betrag !== auto
    ? `amplaz ${euro(auto)} (${vFlaschen()} Fläschen)` : (vFlaschen() ? `${vFlaschen()} Fläschen` : "");
}

async function vSpeichern() {
  const zeige = (art, t) => { FORM.meldung = { art, text: t }; $("#vMeldung").innerHTML = `<div class="meldung ${art}">${esc(t)}</div>`; };
  const kaeufer = FORM.kaeufer.trim().replace(/\s+/g, " ");
  const posten = vArtikel().filter(x => FORM.n[x.key] > 0).map(x => ({ sorte: x.key, n: FORM.n[x.key] }));
  if (!kaeufer) return zeige("fehler", "Un wien? Schreif w.e.g. en Numm an.");
  if (!posten.length) return zeige("fehler", "Wéi vill? Mindestens eng Fläsch oder ee Fass.");
  if (!FORM.wie) return zeige("fehler", "Wéi bezuelt? WERO, SumUp, Iwwerweisung, Bar — oder méi spéit. Tipp w.e.g. eent un.");
  const betrag = FORM.betrag != null ? FORM.betrag : vAutoBetrag();
  const umbuchen = await fehlendesHolen(FORM.verkaeufer, posten);
  if (umbuchen == null) return;
  // Gleicher Name in anderer Schreibweise? Dann den bekannten nehmen.
  const bekannt = Z.kaeufer.find(k => k.name.toLowerCase() === kaeufer.toLowerCase());
  const name = bekannt ? bekannt.name : kaeufer;
  const neu = eintragen([...umbuchen, { art: "verkauf", verkaeufer: FORM.verkaeufer, kaeufer: name, posten, betrag }]);
  const v = neu.find(e => e.art === "verkauf");
  if (!v) return; // gerade eben schon gespeichert (Doppeltipp)
  const wie = FORM.wie;
  if (wie !== "spaeter" && betrag > 0) eintragen([{ art: "zahlung", ref: v.id, betrag, wie }]);
  const verk = FORM.verkaeufer;
  FORM = leeresFormular(); FORM.verkaeufer = verk;
  FORM.meldung = { art: "ok", text: `✓ Agedroen: ${name}, ${postenText(posten)}, ${euro(betrag)} — ${wie !== "spaeter" ? "bezuelt per " + ZAHLARTEN[wie] : "steet ënner „Ausstoend“"}` +
    (umbuchen.length ? ` (${umbuchen.map(u => postenText([u])).join(", ")} ${u0(umbuchen[0].von)} ëmgebucht)` : "") };
  if (document.activeElement) document.activeElement.blur();
  renderVerkaufen();
}

/* Auswahlfrage mit mehreren Antworten (Promise mit dem Schlüssel oder null bei Ofbriechen). */
function frageWaehlen(titel, text, optionen) {
  return new Promise(fertig => {
    const box = $("#frageWahl");
    $("#frageTitel").textContent = titel; $("#frageText").textContent = text || "";
    $("#frageKnoepfe").innerHTML = optionen.map(o => `<button data-wahl="${esc(o.key)}" class="${o.gut ? "gut" : ""}">${esc(o.text)}${o.klein ? `<small>${esc(o.klein)}</small>` : ""}</button>`).join("");
    box.classList.remove("versteckt");
    const zu = k => { box.classList.add("versteckt"); fertig(k); };
    box.querySelectorAll("[data-wahl]").forEach(b => b.onclick = () => zu(b.dataset.wahl));
    $("#frageZu").onclick = () => zu(null);
    box.onclick = e => { if (e.target === box) zu(null); };
  });
}
/* Fehlt dem Verkäufer etwas: woher nehmen? Gibt [Umbuchungen] zurück, [] für „trotzdem“, null für Abbruch.
   Angeboten wird nur, wer für alles Fehlende genug frei hat (Reservierungen zählen mit). Vom Nutzer, 14.11.2026. */
async function fehlendesHolen(wer, posten) {
  const fehlt = zuWenig(Z, wer, posten);
  if (!fehlt.length) return [];
  const brauch = fehlt.map(p => ({ sorte: p.sorte, n: p.n - Math.max(0, p.frei) }));
  const was = brauch.map(p => postenText([p])).join(", ");
  const quellen = [LAGER, ...Z.cfg.leute.filter(x => x !== wer)].filter(h => brauch.every(p => frei(Z, h, p.sorte) >= p.n));
  const opt = quellen.map((h, i) => ({ key: "q:" + h, gut: i === 0,
    text: h === LAGER ? "📦 Aus dem Lager huelen" : `Vum ${h} huelen`,
    klein: brauch.map(p => `${postenText([p])} — ${h === LAGER ? "am Lager" : "huet"} fräi ${frei(Z, h, p.sorte)}`).join(" · ") }));
  opt.push({ key: "trotzdem", text: "Trotzdeem androen", klein: `ouni ëmzebuchen — de Stock ${beim(wer)} geet an de Minus` });
  const k = await frageWaehlen(`${de(wer)[0].toUpperCase() + de(wer).slice(1)} feelt: ${was}`,
    fehltText(wer, fehlt) + (quellen.length ? "" : "\n\nKeen huet genuch fräi."), opt);
  if (k == null) return null;
  if (k === "trotzdem") return [];
  const von = k.slice(2);
  return brauch.map(p => ({ art: "bewegung", sorte: p.sorte, n: p.n, von, an: wer }));
}

/* Zahlungsart wählen (Ausstoend, Livraisons): Fenster mit WERO / SumUp / Iwwerweisung / Bar. Gibt die Art oder null. */
function zahlartWaehlen(titel) {
  return new Promise(fertig => {
    const box = $("#zahlWahl");
    $("#zahlTitel").textContent = titel;
    box.querySelector(".seg").innerHTML = Object.keys(ZAHLARTEN).map(k => `<button data-wie="${k}" class="zbtn">${zahlInhalt(k)}</button>`).join("");
    box.classList.remove("versteckt");
    const zu = wie => { box.classList.add("versteckt"); fertig(wie); };
    box.querySelectorAll("[data-wie]").forEach(b => b.onclick = () => zu(b.dataset.wie));
    $("#zahlZu").onclick = () => zu(null);
    box.onclick = e => { if (e.target === box) zu(null); };
  });
}

/* ---------- Offen ---------- */
let NUR_MEINE = false;
function renderOffen() {
  const box = $("#t-offen");
  const liste = Z.kaeufer.map(K => {
    const vs = K.verkaeufe.filter(v => v.offen > 0 && (!NUR_MEINE || v.verkaeufer === EIN.ich));
    return { ...K, sicht: vs, sichtOffen: runde(vs.reduce((a, v) => a + v.offen, 0)) };
  }).filter(K => K.sicht.length);
  box.innerHTML = `<div class="card">
    <div class="kopfz" style="display:flex;justify-content:space-between;align-items:center">
      <h2 style="margin:0">Nach net bezuelt</h2><b style="color:var(--gelb);font-size:20px">${euro(liste.reduce((a, K) => a + K.sichtOffen, 0))}</b></div>
    <div class="seg"><button data-meine="0" class="${NUR_MEINE ? "" : "an"}">All</button><button data-meine="1" class="${NUR_MEINE ? "an" : ""}">Just meng</button></div>
  </div>
  ${liste.length ? liste.map((K, i) => `<div class="card kunde">
    <div class="kopfz"><h2 style="margin:0">${esc(K.name)}</h2><span class="betrag">${euro(K.sichtOffen)}</span></div>
    ${K.sicht.map(v => `<div class="vk"><span>${v.livraison ? `🚚 Livraisoun ${esc(datumKurz(v.livraison.datum))}` : datumText(v.zeit)} · ${esc(postenText(v.posten))}<br><small class="muted">${esc(beim(v.verkaeufer))}${v.bezahlt ? ` · ${euro(v.bezahlt)} scho bezuelt` : ""}</small></span><span>${euro(v.offen)}</span></div>`).join("")}
    <div class="knopfe">
      <button class="knopf gruen" data-alles="${i}">Alles bezuelt ✓</button>
      <button class="knopf" data-teil="${i}">Deelbetrag…</button>
      <button class="knopf" data-erinnern="${i}">Erënneren 💬</button>
    </div></div>`).join("") : `<div class="card leer">Alles bezuelt. 🎉</div>`}`;
  box.querySelectorAll("[data-meine]").forEach(b => b.onclick = () => { NUR_MEINE = b.dataset.meine === "1"; renderOffen(); });
  box.querySelectorAll("[data-alles]").forEach(b => b.onclick = async () => {
    const K = liste[+b.dataset.alles];
    const wie = await zahlartWaehlen(`${K.name}: ${euro(K.sichtOffen)} bezuelt — wéi?`);
    if (!wie) return;
    eintragen(K.sicht.map(v => ({ art: "zahlung", ref: v.id, betrag: v.offen, wie })));
  });
  box.querySelectorAll("[data-teil]").forEach(b => b.onclick = async () => {
    const K = liste[+b.dataset.teil];
    const t = prompt(`${K.name}: wéi vill gouf bezuelt? (op: ${euro(K.sichtOffen)})`, "");
    if (t == null) return;
    const x = runde(+t.trim().replace(",", ".").replace("€", ""));
    if (!(x > 0)) return alert("Dat ass kee Betrag.");
    const { zahlungen, rest } = verteile(K.sicht, x);
    if (rest > 0 && !confirm(`Dat sinn ${euro(rest)} méi wéi op. Agedroe ginn nëmmen ${euro(x - rest)}. Ok?`)) return;
    const wie = await zahlartWaehlen(`${K.name}: ${euro(x - rest)} bezuelt — wéi?`);
    if (!wie) return;
    eintragen(zahlungen.map(z => ({ ...z, wie })));
  });
  box.querySelectorAll("[data-erinnern]").forEach(b => b.onclick = async () => {
    const K = liste[+b.dataset.erinnern];
    const t = erinnerung({ ...K, verkaeufe: K.sicht, offen: K.sichtOffen });
    try { if (navigator.share) { await navigator.share({ text: t }); return; } } catch (f) { if (f && f.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(t); alert("Text kopéiert:\n\n" + t); } catch { prompt("Text fir ze kopéieren:", t); }
  });
}

/* ---------- Bestand ---------- */
/* ---------- Biere (im Reiter Stock) ---------- */
let BIERFORM = null, ARCHIV_AUF = false;
const zahlText = x => x == null ? "" : String(x).replace(".", ",");
const zahlAus = t => { const v = String(t || "").trim().replace(",", "."); return v === "" ? null : (isFinite(+v) ? +v : NaN); };
function bierInfo(c) {
  const m = c.meta || {};
  const fp = fassNamen(Z, c.name).map(k => `${euro(preisVon(Z.cfg, k))}/Fass ${zerlege(k).l} l`);
  return [m.stil, m.alk != null ? zahlText(m.alk) + " %" : "", euro(c.preis) + "/Fl", ...fp,
    m.braudatum ? "gebraut " + datumKurz(m.braudatum) : "", m.liter != null ? zahlText(m.liter) + " L" : "", m.mhd ? "haltbar bis " + datumKurz(m.mhd) : ""].filter(Boolean).join(" · ");
}
/* Was von einem Bier (Flaschen und Fässer) noch irgendwo liegt oder für Livraisons geplant ist — als Textzeilen. */
function restVon(bier) {
  const zeilen = [];
  for (const k of [bier, ...FAESSER.map(F => fassKey(bier, F.l))]) {
    const wo = Z.halter.filter(h => hat(Z, h, k) > 0).map(h => `${h === LAGER ? "Lager" : h} ${hat(Z, h, k)}`);
    if (wo.length) zeilen.push(`• ${istFass(k) ? `Fass ${zerlege(k).l} l` : "Fläschen"}: ${wo.join(", ")}`);
  }
  const geplant = Z.livraisons.filter(L => !L.verkauf && L.posten.some(p => zerlege(p.sorte).bier === bier));
  if (geplant.length) zeilen.push(`• geplangt Livraisons: ${geplant.map(L => `${L.kunde} (${datumKurz(L.datum)})`).join(", ")}`);
  return zeilen;
}

function renderBiere() {
  const box = $("#bBiere");
  if (BIERFORM && !BIERFORM.neu && $("#bierDok")) { renderDok(BIERFORM.name); return; } // Formular stehen lassen
  if (tipptIn(box)) return;
  if (BIERFORM) return renderBierForm(box);
  const aktivB = Z.cfg.sorten.filter(c => !c.archiv), archiv = Z.cfg.sorten.filter(c => c.archiv);
  const doText = c => [`${Z.sorten[c.name] ? Z.sorten[c.name].da : 0} Fl.`, ...fassNamen(Z, c.name).filter(k => Z.sorten[k].da).map(k => `${Z.sorten[k].da} × ${zerlege(k).l} l`)].join(" · ") + " do";
  // Etikett als kleines Bild vor dem Namen (vom Nutzer, Fassung q); antippen öffnet es
  const etikett = c => { const D = dateienVon(Z, c.name).etikett; if (!D) return ""; thumbLaden(D);
    return `<button class="bier-etikett" data-thumb="${esc(D.fid)}" data-etikett="${esc(D.fid)}" aria-label="Etikett opmaachen">${bildHtml(D)}</button>`; };
  const zeile = c => `<div class="bier"><div class="kopfz"><span class="bier-name">${etikett(c)}<b>${esc(bierText(c.name))}</b></span><span class="muted">${doText(c)}</span></div>
      <div class="hinweis" style="margin-top:2px">${esc(bierInfo(c))}</div>
      ${c.meta && c.meta.notiz ? `<div class="hinweis" style="margin-top:2px">${esc(c.meta.notiz)}</div>` : ""}
      ${dateienVon(Z, c.name).anzahl ? `<div class="hinweis" style="margin-top:2px">📎 ${["etikett", "rezept", "protokoll"].filter(f => dateienVon(Z, c.name)[f]).map(f => FELDER[f]).concat(dateienVon(Z, c.name).anner.length ? [dateienVon(Z, c.name).anner.length + " aner"] : []).join(" · ")}</div>` : ""}
      <div class="knopfe"><button class="knopf" data-bed="${esc(c.name)}">✎ Änneren</button>
        ${c.archiv ? `<button class="knopf" data-bzr="${esc(c.name)}">↩️ Zréckhuelen</button>` : `<button class="knopf" data-barch="${esc(c.name)}">📦 Archiv</button>`}
        <button class="knopf rot" data-bweg="${esc(c.name)}">✕ Läschen</button></div></div>`;
  box.innerHTML = `<div class="card"><h2>Eis Béieren</h2>
    ${aktivB.length ? aktivB.map(zeile).join("") : `<div class="leer">Nach keen Béier.</div>`}
    <button class="haupt" id="bierNeu">+ Neien Béier</button>
    ${archiv.length ? `<button class="knopf" id="archivAuf" style="width:100%;margin-top:12px">📦 Archiv (${archiv.length}) ${ARCHIV_AUF ? "▴" : "▾"}</button>
      ${ARCHIV_AUF ? archiv.map(zeile).join("") : ""}` : ""}

async function aufLeinwand(quelle, breite) {
  const c = document.createElement("canvas");
  const f = Math.min(1, breite / quelle.width);

}
async function vorschau(datei) {

      const c = await aufLeinwand(img, 240); URL.revokeObjectURL(url);
      return c.toDataURL("image/jpeg", 0.7);

    if (istPdf(datei.type, datei.name)) {
      const pdfjs = await pdfjsLaden();
      const doc = await pdfjs.getDocument({ data: new Uint8Array(await datei.arrayBuffer()) }).promise;
      const seite = await doc.getPage(1);
      const v0 = seite.getViewport({ scale: 1 }), v = seite.getViewport({ scale: 240 / v0.width });
      const c = document.createElement("canvas"); c.width = Math.round(v.width); c.height = Math.round(v.height);
      await seite.render({ canvasContext: c.getContext("2d"), viewport: v }).promise;

async function dateiHochladen(datei, bier, feld) {
  if (UPLOAD) return;

  if (!PROBE && navigator.onLine === false) { alert("Fir Dateien eropzelueden brauchs de Internet."); return; }
  UPLOAD = { bier, feld, text: "Gëtt virbereet…" }; renderDok(bier);
  try {
    const fid = "f-" + neueId().replace(/[^A-Za-z0-9-]/g, "");
    const thumb = await vorschau(datei);
    const b64 = await alsBase64(datei);
    const n = Math.max(1, Math.ceil(b64.length / STUECK));
    if (thumb) { await teilHoch(fid + "-t", 0, thumb); THUMBS.set(fid, thumb); }
    for (let i = 0; i < n; i++) {
      UPLOAD.text = `Eroplueden… ${Math.round(i / n * 100)} %`; renderDok(bier);
      await teilHoch(fid, i, b64.slice(i * STUECK, (i + 1) * STUECK));

    DATEN.set(fid, datei);

  } catch (f) {

async function dateiDaten(D) {

    const name = F.neu && F.braudatum && !hatDatum(grund) ? `${grund} (${datumLang(F.braudatum)})` : grund;
    const preis = zahlAus(F.preis), alk = zahlAus(F.alk), liter = zahlAus(F.liter), fl = String(F.flaschen).trim() ? parseInt(F.flaschen, 10) : 0;
    const p20 = zahlAus(F.preis20), p30 = zahlAus(F.preis30);
    const anz = t => String(t || "").trim() ? parseInt(t, 10) : 0, f20 = anz(F.f20), f30 = anz(F.f30);
    if (!grund) return meld("Wéi heescht d'Béier?");
    if (F.neu && (Z.cfg.sorten.some(c => c.name.toLowerCase() === name.toLowerCase()) || name === LAGER)) return meld("Dee Numm gëtt et schonn.");
    // Zwei Biere dürfen auch nicht gleich AUSSEHEN (z. B. altes „NEIPA“ + Datum 28.07. und neues „NEIPA (28.07.2026)“):
    // sonst kann man sie nicht unterscheiden, und im Excel hießen zwei Blätter gleich.
    { const sicht = (F.braudatum ? `${grund.replace(/ \(\d{1,2}\.\d{1,2}\.\d{4}\)$/, "")} (${datumLang(F.braudatum)})` : (F.neu ? name : bierText(name))).toLowerCase();
      const gleich = Z.cfg.sorten.find(c => c.name !== name && bierText(c.name).toLowerCase() === sicht);
      if (gleich) return meld(`Dat gesäit aus wéi e Béier, dat et schonn gëtt: „${bierText(gleich.name)}“. Aneren Numm oder anert Braudatum huelen.`); }
    if (preis == null || isNaN(preis)) return meld("Wat kascht eng Fläsch?");
    if (Number.isNaN(alk) || Number.isNaN(liter)) return meld("Alkohol a Liter just als Zuel, z. B. 5,6.");
    if (fl && !ganz(fl)) return meld("Fläschen: just eng ganz Zuel.");
    if ((f20 && !ganz(f20)) || (f30 && !ganz(f30))) return meld("Fässer: just eng ganz Zuel.");
    if (Number.isNaN(p20) || Number.isNaN(p30)) return meld("Fasspräis just als Zuel.");
    if (name.match(/ Keg (20|30)l$/)) return meld("Fässer brauche keen eegent Béier — si stinn ënnert dem Béier.");
    const e = { art: "bier", name, preis: runde(preis), stil: F.stil.trim(), braudatum: F.braudatum, alk, liter, mhd: F.mhd, notiz: F.notiz.trim(),
      ...(p20 != null ? { preis20: runde(p20) } : {}), ...(p30 != null ? { preis30: runde(p30) } : {}) };
    if (!gueltig({ ...e, id: "x", zeit: 0 })) return meld("Eppes ass ze laang oder net richteg (Numm max. 30 Zeechen).");
    const teile = [e];
    if (F.neu && fl) teile.push({ art: "abfuellung", sorte: name, n: fl });
    if (F.neu && f20) teile.push({ art: "abfuellung", sorte: fassKey(name, 20), n: f20 });
    if (F.neu && f30) teile.push({ art: "abfuellung", sorte: fassKey(name, 30), n: f30 });
    if (document.activeElement) document.activeElement.blur();
    if (!eintragen(teile).length) return;
    FORM = null; BFORM = null; LFORM = null;
    if (F.neu) {
      // Gleich in die Bearbeitung, damit man Etikett & Co. anhängen kann.
      const m = e;
      BIERFORM = { neu: false, name, stil: m.stil, braudatum: m.braudatum, alk: zahlText(m.alk), liter: zahlText(m.liter), preis: zahlText(m.preis),
        preis20: zahlText(m.preis20 ?? 150), preis30: zahlText(m.preis30 ?? 180), mhd: m.mhd, notiz: m.notiz, flaschen: "", f20: "", f30: "",
        meldung: `✓ ${name} ugeluecht` + [fl ? `${fl} Fläschen` : "", f20 ? `${f20} × Fass 20 l` : "", f30 ? `${f30} × Fass 30 l` : ""].filter(Boolean).map((t, i) => (i ? ", " : ", am Lager: ") + t).join("") + `. Elo kanns de Dateien derbäisetzen.` };
      renderBiere(); return;
    }
    BIERFORM = null;
    renderBiere();
    $("#bierMeld").innerHTML = `<div class="meldung ok">✓ ${esc(name)} gespäichert</div>`;
  };
}

/* ---------- Doppeltipp-Schutz, Stufe 1 ----------
   Ein zweiter Tipp auf denselben Knopf innerhalb von 800 ms wird verschluckt. „Derselbe“ heißt gleiche
   id, gleiche data-Werte und gleicher Text — gilt also auch, wenn der Knopf inzwischen neu gebaut
   wurde (sonst träfe der zweite Tipp z. B. den nächsten Käufer, der in der Liste nachrückt).
   Verschiedene Knöpfe schnell hintereinander gehen durch. Ausnahme: −/+ beim Verkaufen. */
let LETZTER_TIPP = { k: "", t: 0 };
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("button");
  if (!b || b.closest(".stepper")) return;
  const jetzt = Date.now();
  const k = b.id + "|" + JSON.stringify(b.dataset) + "|" + b.textContent.trim();
  if (k === LETZTER_TIPP.k && jetzt - LETZTER_TIPP.t < 800) { e.preventDefault(); e.stopImmediatePropagation(); return; }
  LETZTER_TIPP = { k, t: jetzt };
}, true);

/* Doppeltipp-Zoom, Stufe 2: touch-action allein hat am iPhone nicht gereicht (Fassung n, gemeldet
   13.11.2026 — in der Koeppchen-App reicht es, Ursache unbekannt). Ein zweiter Ein-Finger-Tipp innerhalb
   von 350 ms wird abgefangen, bevor iOS zoomt. Zwei-Finger-Zoom bleibt (nur changedTouches = 1, und
   nur wenn kein zweiter Finger liegt). −/+ bekommt den Tipp trotzdem (click() von Hand);
   Eingabefelder bleiben unberührt (Doppeltipp markiert dort ein Wort). */
let LETZTES_ENDE = { t: 0, x: 0, y: 0 };
document.addEventListener("touchend", e => {
  const jetzt = Date.now();
  const z = e.target;
  const einFinger = e.changedTouches.length === 1 && e.touches.length === 0;
  const p = e.changedTouches[0];
  // Zoom-Doppeltipp = zweimal dieselbe Stelle. Zwei verschiedene Knöpfe schnell hintereinander gehen durch.
  const nah = p && Math.abs(p.clientX - LETZTES_ENDE.x) < 40 && Math.abs(p.clientY - LETZTES_ENDE.y) < 40;
  if (einFinger && nah && jetzt - LETZTES_ENDE.t < 350 && !(z.closest && z.closest("input,select,textarea"))) {
    e.preventDefault();
    const knopf = z.closest && z.closest(".stepper button");
    if (knopf) knopf.click();
  }
  LETZTES_ENDE = einFinger && p ? { t: jetzt, x: p.clientX, y: p.clientY } : { t: 0, x: 0, y: 0 };
}, { passive: false });

/* ---------- Neue Fassung ----------
   Beim Öffnen und bei jeder Rückkehr zur App: liegt bei GitHub eine andere FASSUNG, lädt die App
   sich selbst neu — außer mitten in einem Eintrag, dann ein Knopf. Erst fetch mit cache:"reload"
   (ersetzt die Kopie im Zwischenspeicher), dann reload. Je Zielfassung höchstens ein Versuch in
   5 min, damit ein noch alter CDN-Stand keine Schleife macht. */
let NEUE = "";
function mittenImEintrag() {
  const a = document.activeElement;
  if (a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return true;
  if (TAB === "einst" && EFORM) return true;
  if (FORM && (FORM.kaeufer.trim() || Object.values(FORM.n).some(n => n > 0) || FORM.betrag != null)) return true;
  if (BFORM && String(BFORM.n).trim()) return true;
  if (L_NEU || BIERFORM || UPLOAD || ANSICHT || !$("#zahlWahl").classList.contains("versteckt") || !$("#frageWahl").classList.contains("versteckt")) return true;
  if (FORM && FORM.wie) return true;
  return false;
}
function neuLaden() {
  try { localStorage.setItem("millebeier_v1_update", JSON.stringify({ f: NEUE, t: Date.now() })); } catch {}
  location.reload();
}
async function updatePruefen() {
  if (navigator.onLine === false) return;
  try {
    const r = await fetch(location.href.split("#")[0], { cache: "reload" });
    if (!r.ok) return;
    const m = (await r.text()).match(/const FASSUNG = "([^"]+)"/);
    if (!m || m[1] === FASSUNG) return;
    NEUE = m[1];
    const v = lade("millebeier_v1_update", {});
    const kuerzlich = v.f === NEUE && Date.now() - v.t < 5 * 60000;
    if (!kuerzlich && !mittenImEintrag()) return neuLaden();
    const k = $("#neu");
    k.textContent = `Nei Versioun (${NEUE}) — tippen fir ze aktualiséieren`;
    k.classList.remove("versteckt");
  } catch {}
}
$("#neu").onclick = neuLaden;
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { abgleichen(); updatePruefen(); } });
window.addEventListener("online", abgleichen);
setInterval(() => { if (document.visibilityState === "visible") abgleichen(); }, 20000);

neuRechnen();
render();
abgleichen();
updatePruefen();
</script>
